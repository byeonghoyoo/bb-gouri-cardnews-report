<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>언어베리 워크트리 · 이벤트 랜딩 · 뷰티블라썸</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #0f1218; --panel: #161a22; --card: #1b2029; --line: #2a303b; --ink: #eef1f6; --muted: #9aa3b2; --pink: #f4a6c4; --pink-d: #e5487f; --green: #3fbf7f; --amber: #f2b84b; --blue: #6aa8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  a { color: inherit; }
  .app { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh; }
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 24px 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .brand-mark { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #f7b7cf, #e5487f); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 20px; }
  .brand b { display: block; font-size: 16px; }
  .brand small { color: var(--muted); font-size: 12px; }
  .hub { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 12px 14px; margin-bottom: 6px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font: inherit; font-weight: 700; text-align: left; cursor: pointer; }
  .hub:hover { background: #20252f; }
  .hub.current { background: #2b1f27; color: var(--pink); }
  .hub .n { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 22px; padding: 0 8px; border-radius: 999px; background: #262c37; color: var(--muted); font-size: 12px; line-height: 1; }
  .side-note { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .side-note b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 4px; }
  .main { padding: 28px 40px 80px; min-width: 0; }
  .crumb { color: var(--muted); font-weight: 700; margin-bottom: 26px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .who { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .who input { width: 140px; height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: #11151c; color: var(--ink); font: inherit; }
  h1 { margin: 0 0 6px; font-size: 40px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 4px; color: #c9d0db; }
  .sync { font-size: 12px; font-weight: 700; color: var(--green); min-height: 18px; }
  .sync.bad { color: #ff8a8a; }
  .tools { margin: 24px 0 18px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
  .tool-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .search { flex: 1; min-width: 220px; height: 42px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line); background: #11151c; color: var(--ink); font: inherit; }
  select { height: 42px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line); background: #11151c; color: var(--ink); font: inherit; font-weight: 700; }
  .count { color: var(--muted); font-weight: 700; margin-left: auto; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #11151c; color: var(--ink); font: inherit; font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer; }
  .chip.current { background: var(--ink); color: #11151c; border-color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .d-wait { background: var(--amber); } .d-doing { background: var(--blue); } .d-done { background: var(--green); } .d-up { background: var(--pink); }
  .help { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 18px; }
  .group-title { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: 14px 0 0; font-size: 17px; font-weight: 800; }
  .group-title small { color: var(--muted); font-weight: 700; }
  .card { border: 2px solid var(--line); border-radius: 18px; background: var(--card); padding: 20px 22px; min-width: 0; }
  .card.st-done { border-color: #2f7e57; } .card.st-up { border-color: #a8456c; }
  .card-id { color: var(--muted); font-size: 12px; font-weight: 700; }
  .card h2 { margin: 2px 0 8px; font-size: 21px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 8px; border: 1px solid #5b4a2a; background: #2a2416; color: #f3cf7a; font-size: 12px; font-weight: 800; line-height: 1; }
  .state { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; margin-bottom: 12px; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #151922; color: var(--ink); font-weight: 800; font-size: 14px; line-height: 1; text-decoration: none; }
  .btn:hover { border-color: #3a4250; }
  .btn.pink { border-color: #8e3d5e; background: #2b1a22; color: #ffd0e1; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-size: 12px; font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th.c, td.c { text-align: center; width: 84px; }
  td { padding: 9px 4px; border-bottom: 1px solid #232833; font-weight: 700; }
  td small { color: var(--muted); font-weight: 700; margin-left: 4px; }
  td a { text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .box { width: 22px; height: 22px; accent-color: var(--green); cursor: pointer; vertical-align: middle; }
  .box:disabled { cursor: not-allowed; opacity: .5; }
  .dash { color: var(--muted); }
  .who-tag { display: block; font-size: 10px; color: var(--muted); font-weight: 600; line-height: 1.2; margin-top: 2px; min-height: 12px; }
  .bar { height: 6px; border-radius: 3px; background: #262c37; overflow: hidden; margin: 4px 0 12px; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .empty { color: var(--muted); padding: 30px 0; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } .side { position: static; height: auto; } .main { padding: 20px 16px 60px; } .grid { grid-template-columns: 1fr; } h1 { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">B</div><div><b>Beauty Blossom</b><small>이벤트 랜딩 언어베리</small></div></div>
    <nav id="hubs" aria-label="이벤트 묶음"></nav>
    <div class="side-note"><b>작업은 한곳에서</b>시트를 열어 검토하고, 끝낸 국가를 체크해 주세요. 체크는 팀 공용이라 다른 PC에도 바로 보입니다.</div>
  </aside>
  <main class="main">

    <h1 id="title">언어베리</h1>

    <section class="tools">

        <span class="count" id="count"></span>
      </div>
      <div class="chips" id="chips" role="group" aria-label="상태"></div>
    </section>
    <p class="help">언어검토 체크는 그 나라 담당자가 시트 검토를 끝냈다는 표시입니다(G열 수정문구가 없어도 됩니다). 업로드 체크는 그 나라 홈페이지에 올린 뒤에 표시합니다.</p>
    <div class="grid" id="grid"></div>
  </main>
</div>
