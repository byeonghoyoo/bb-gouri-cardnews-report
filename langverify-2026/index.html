  }
  function card(e) {
    var s = status(e), r = reviewed(e);
    var rows = LOCS.map(function (l) {
      var gid = e.gids && e.gids[l[0]];
      var name = l[0] === 'KO' ? el('span', null, [l[1], el('small', { text: 'KO' })]) : el('a', { href: e.sheet + (gid ? '#gid=' + gid : ''), target: '_blank', rel: 'noopener', title: l[1] + ' 탭 열기' }, [l[1], el('small', { text: l[0] })]);
      return el('tr', null, [el('td', null, [name]), el('td', { class: 'c' }, [l[0] === 'KO' ? el('span', { class: 'dash', text: '—' }) : box(e, l[0], 'lv_review', l[1] + ' 언어검토')]), el('td', { class: 'c' }, [box(e, l[0], 'lv_upload', l[1] + ' 업로드')])]);
    });
    return el('article', { class: 'card st-' + s, 'data-event': e.id }, [
      el('div', { class: 'card-id', text: e.id }),
      el('h2', null, [e.label, el('span', { class: 'badge', text: '기준일 ' + e.date.slice(5).replace('-', '.') + ' · ' + e.rows + '문구' })]),
      el('div', { class: 'state' }, [el('span', { class: 'dot ' + STATUS[s][1] }), STATUS[s][0] + ' · 언어검토 ' + r + '/' + FOREIGN.length]),
      el('div', { class: 'bar' }, [el('i', { style: 'width:' + Math.round(r / FOREIGN.length * 100) + '%' })]),
      el('div', { class: 'links' }, [el('a', { class: 'btn pink', href: e.sheet, target: '_blank', rel: 'noopener', text: '언어베리 시트 ↗' }), e.board ? el('a', { class: 'btn', href: e.board, target: '_blank', rel: 'noopener', text: '시안 보기 ↗' }) : null]),
      el('table', null, [el('thead', null, [el('tr', null, [el('th', { text: '적용 국가 ' + LOCS.length + '개' }), el('th', { class: 'c', text: '언어검토' }), el('th', { class: 'c', text: '업로드' })])]), el('tbody', null, rows)]),
    ]);
  }
  function render() {
    var b = cur(), hub = st.hub === 'all' ? null : b.hubs.filter(function (h) { return h.id === st.hub; })[0];
    $('eyebrow').textContent = hub ? hub.label : '전체 ' + b.events.length + '개';
    $('title').textContent = b.title;
    document.title = b.title + ' · 언어베리 워크트리 · 뷰티블라썸';
    renderSide(); renderChips(b);
    var list = visible(b); $('count').textContent = list.length + '개';
    var out = [];
    b.hubs.forEach(function (h) {
      var items = list.filter(function (e) { return e.hub === h.id; });
      if (!items.length) return;
      if (st.hub === 'all') out.push(el('div', { class: 'group-title' }, [h.label, el('small', { text: items.length + '개' })]));
      items.forEach(function (e) { out.push(card(e)); });
    });
    if (!out.length) out.push(el('p', { class: 'empty', text: '조건에 맞는 항목이 없습니다.' }));
    $('grid').replaceChildren.apply($('grid'), out);
  }
  FOREIGN.forEach(function (l) { $('loc').appendChild(el('option', { value: l[0], text: l[1] + ' 미완료' })); });
  $('q').addEventListener('input', function (e) { st.q = e.target.value; render(); });
  $('loc').addEventListener('change', function (e) { st.loc = e.target.value; render(); });
  $('menu').addEventListener('click', function () { toggleSide(); });
  $('scrim').addEventListener('click', function () { toggleSide(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !wide.matches && document.body.classList.contains('drawer-open')) toggleSide(false); });
  wide.addEventListener('change', syncMenu);
  try { $('who').value = localStorage.getItem('lv-name') || ''; if (localStorage.getItem('lv-side-closed') === '1' && wide.matches) $('app').classList.add('side-closed'); } catch (x) {}
  $('who').addEventListener('change', function (e) { try { localStorage.setItem('lv-name', e.target.value.trim()); } catch (x) {} });
  readHash();
  window.addEventListener('hashchange', function () { readHash(); render(); });
  syncMenu(); render(); load();
  setInterval(function () { if (document.visibilityState === 'visible' && !Object.keys(busy).length) load(); }, 4000);
})();
