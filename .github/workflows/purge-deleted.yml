name: Purge deleted review items

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Upload the current tree to Cloudflare Pages even when nothing was purged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: purge-deleted
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Purge deleted items
        env:
          REVIEW_API: https://bb-event-review-sync.beautyblossom.workers.dev
          REVIEW_HEADER: event-review-2026
          REVIEW_ORIGIN: https://byeonghoyoo.github.io
        run: node .github/scripts/purge-deleted.cjs
      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- events-2026-12; then
            echo 'No deleted items to purge.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add events-2026-12
            git commit -m 'Purge deleted review items'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # 2026-11-10: the board is served from the Cloudflare Pages project bb-event-review.
      # After a purge, upload the newest main there too so deleted items' files leave the live site.
      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || inputs.deploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3b791e40dd935daaed954333981d58bd
        run: |
          git fetch origin main
          git reset --hard origin/main
          node .github/scripts/cf-build-dist.cjs
          npx --yes wrangler@4 pages deploy dist --project-name bb-event-review --branch main --commit-dirty=true --commit-message "Purge deleted review items"