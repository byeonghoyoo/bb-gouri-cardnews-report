          <ul class="ch-list"><li class="ch"><span class="ch-q" data-copy="fc_c4_r1_q"></span><i class="ch-line" aria-hidden="true"></i><span class="ch-a" data-copy="fc_c4_r1_a"></span></li><li class="ch"><span class="ch-q" data-copy="fc_c4_r2_q"></span><i class="ch-line" aria-hidden="true"></i><span class="ch-a" data-copy="fc_c4_r2_a"></span></li><li class="ch"><span class="ch-q" data-copy="fc_c4_r3_q"></span><i class="ch-line" aria-hidden="true"></i><span class="ch-a" data-copy="fc_c4_r3_a"></span></li><li class="ch"><span class="ch-q" data-copy="fc_c4_r4_q"></span><i class="ch-line" aria-hidden="true"></i><span class="ch-a" data-copy="fc_c4_r4_a"></span></li><li class="ch"><span class="ch-q" data-copy="fc_c4_r5_q"></span><i class="ch-line" aria-hidden="true"></i><span class="ch-a" data-copy="fc_c4_r5_a"></span></li><li class="ch"><span class="ch-q" data-copy="fc_c4_r6_q"></span><i class="ch-line" aria-hidden="true"></i><span class="ch-a" data-copy="fc_c4_r6_a"></span></li></ul>
          <p class="c4-note"><img class="note-ico" src="assets/icons/waves.webp" alt="" aria-hidden="true" width="192" height="192"><span data-copy="fc_c4_note"></span></p>
        </div>
        <p class="src" data-copy="fc_c4_src"></p>
      </div>
    </section>

    <!-- 5 : the treatment day (steps with the shared icons, treatment info, things to tell, care; a different frame of the same model in a thick white frame) -->
    <section class="card c5" data-card="5" aria-labelledby="fc_t5">
      <img class="tex tex-flip" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <img class="dec c5-heart" src="assets/dec/heart.png" alt="" aria-hidden="true" width="394" height="342">
      <img class="dec fr-c5" src="assets/dec/frost-2.png" alt="" aria-hidden="true" width="388" height="321">
      <img class="dec c5-sn" src="assets/dec/snow-2.png" alt="" aria-hidden="true" width="288" height="310">

        <header class="top solo"><img class="brand wordmark" src="assets/logo-wordmark-222b6e.png" alt="BEAUTY BLOSSOM" width="975" height="111"></header>
        <div class="c5-headrow">
          <div class="q-head">
            <p class="kicker"><span class="pill pill-k" data-copy="fc_c5_kicker"></span></p>
            <h2 class="q-title" id="fc_t5" data-copy="fc_c5_q"></h2>
            <p class="q-ans" data-copy="fc_c5_a"></p>
          </div>
          <figure class="c5-photo"><img class="c5-img" src="assets/model-c5.jpg?v=a" data-alt="fc_alt_c5" alt="" width="680" height="850"></figure>

        <ol class="steps">
          <li class="st s1"><img class="st-ico" src="assets/icons/diagnosis.webp" alt="" aria-hidden="true" width="192" height="192"><div class="st-tx"><p class="st-no" data-copy="fc_c5_s1_no"></p><h3 class="st-t" data-copy="fc_c5_s1_t"></h3><p class="st-d" data-copy="fc_c5_s1_d"></p></div></li>

          <li class="st s4"><img class="st-ico" src="assets/icons/calendar.webp" alt="" aria-hidden="true" width="192" height="192"><div class="st-tx"><p class="st-no" data-copy="fc_c5_s4_no"></p><h3 class="st-t" data-copy="fc_c5_s4_t"></h3><p class="st-d" data-copy="fc_c5_s4_d"></p></div></li>
        </ol>
        <ul class="infos">
          <li class="inf"><span class="inf-k" data-copy="fc_c5_i1_k"></span><span class="inf-v" data-copy="fc_c5_i1_v"></span><span class="inf-n" data-copy="fc_c5_i1_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="fc_c5_i2_k"></span><span class="inf-v" data-copy="fc_c5_i2_v"></span><span class="inf-n" data-copy="fc_c5_i2_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="fc_c5_i3_k"></span><span class="inf-v" data-copy="fc_c5_i3_v"></span><span class="inf-n" data-copy="fc_c5_i3_n"></span></li>

        <div class="ask"><p class="ask-t"><img class="ask-ico" src="assets/icons/consult.webp" alt="" aria-hidden="true" width="192" height="192"><span data-copy="fc_c5_ask_t"></span></p><p class="ask-d" data-copy="fc_c5_ask_d"></p></div>
        <ul class="care">
          <li><img class="care-ico" src="assets/icons/snow.webp" alt="" aria-hidden="true" width="192" height="192"><span data-copy="fc_c5_care1"></span></li>
          <li><img class="care-ico" src="assets/icons/heart.webp" alt="" aria-hidden="true" width="192" height="192"><span data-copy="fc_c5_care2"></span></li>
        </ul>
        <p class="src" data-copy="fc_c5_src"></p>
      </div>
    </section>

    <!-- 6 : clinic intro (same content and order as oligio12 / FV12 / combo12a: director, three room photos, four strengths, Google map, hours, booking) in this bundle's tone -->
    <section class="card c6" data-card="6" aria-labelledby="fc_t6">
      <img class="tex" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <img class="dec fr-c6" src="assets/dec/frost-1.png" alt="" aria-hidden="true" width="692" height="510">
      <img class="dec c6-gl" src="assets/dec/glint-1.png" alt="" aria-hidden="true" width="224" height="228">
      <div class="cx-in">
        <header class="top solo"><img class="brand wordmark" src="assets/logo-wordmark-222b6e.png" alt="BEAUTY BLOSSOM" width="975" height="111"></header>
        <div class="bento">
          <div class="bt bt-about">
            <div class="ab-top">
              <div class="ab-intro">
                <p class="bt-k" data-copy="fc_ab_kicker"></p>
                <h2 class="ab-title" id="fc_t6" data-copy="fc_ab_title"></h2>

              <figure class="dr">
                <img class="dr-img" src="assets/director-lee.webp?v=a" data-alt="fc_alt_director" alt="" width="640" height="640">

            </div>

              <figure class="ph-w"><img src="assets/hp-care.png?v=a" data-alt="fc_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="fc_ab_ph2"></figcaption></figure>
              <figure class="ph-w"><img src="assets/hp-treatment.jpg?v=a" data-alt="fc_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="fc_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><img class="si" src="assets/icons/genuine.webp" alt="" aria-hidden="true" width="192" height="192"><span class="sh"><span class="at" data-copy="fc_ab_s1_t"></span><span class="ad" data-copy="fc_ab_s1_d"></span></span></li>
              <li><img class="si" src="assets/icons/consult.webp" alt="" aria-hidden="true" width="192" height="192"><span class="sh"><span class="at" data-copy="fc_ab_s2_t"></span><span class="ad" data-copy="fc_ab_s2_d"></span></span></li>
              <li><img class="si" src="assets/icons/hours.webp" alt="" aria-hidden="true" width="192" height="192"><span class="sh"><span class="at" data-copy="fc_ab_s3_t"></span><span class="ad" data-copy="fc_ab_s3_d"></span></span></li>
              <li><img class="si" src="assets/icons/language.webp" alt="" aria-hidden="true" width="192" height="192"><span class="sh"><span class="at" data-copy="fc_ab_s4_t"></span><span class="ad" data-copy="fc_ab_s4_d"></span></span></li>
            </ul>
          </div>
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="fc_ab_loc"></p><h3 class="bt-t" data-copy="fc_ab_loc_title"></h3></div>

              <picture>
                <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="fc_alt_map" alt="" width="460" height="425">

            </figure>
            <div class="way">
              <img class="way-pin" src="assets/icons/pin.webp" alt="" aria-hidden="true" width="192" height="192">
              <div class="way-tx">
                <p class="way-top"><span class="way-st" data-copy="fc_ab_way_station"></span><span class="way-line" data-copy="fc_ab_way_line"></span></p>
                <p class="way-addr"><span data-copy="fc_ab_way_addr"></span><span class="way-desk" data-copy="fc_ab_way_desk"></span></p>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="fc_ab_hours_kicker"></p>

          <div class="bt bt-book">

              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="fc_alt_qr" alt="" width="424" height="424"><figcaption data-copy="fc_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="fc_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><a data-link="kakao"><span data-copy="fc_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><img class="bk-ico" src="assets/icons/phone.webp" alt="" aria-hidden="true" width="192" height="192"><a data-link="phone"><span data-copy="fc_ab_phone"></span></a></p>
              </div>
            </div>
            <img class="bk-mark wordmark" src="assets/logo-wordmark-222b6e.png" alt="BEAUTY BLOSSOM" width="975" height="111">
          </div>
        </div>
      </div>
    </section>

    <!-- notes under the cards (not a card) -->
    <section class="notes" aria-labelledby="fc_notes">

        <li><span class="dot" aria-hidden="true"></span><span data-copy="fc_cond4"></span></li>
