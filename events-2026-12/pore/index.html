<!doctype html>
<html lang="ko" data-locale="KO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>모공은 결부터 챙겨요 · BEAUTY BLOSSOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link id="locale-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<link rel="stylesheet" href="pore.css?v=20261029-pore2">
<script src="copy-data.js?v=20261029-pore2" defer></script>
<script src="../inline-edit.js?v=20261029-pore2" defer></script>
<script src="pore.js?v=20261029-pore2" defer></script>
</head>
<body>
<main class="rp" id="rp">
<div class="sheet">

  <!-- 1. COVER: dark report cover + three route prices -->
  <section class="cover" aria-labelledby="cover-title">
    <div class="cover-band">
      <header class="cover-top">
        <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
        <span class="meta">NO.04 · PORE CARE</span>
      </header>
      <div class="cover-grid">
        <div class="cover-text">
          <p class="eyebrow"><span data-copy="tx_eyebrow"></span></p>
          <div class="type"><img class="type-img" src="assets/miri/type_texture_report.webp" alt="TEXTURE REPORT"></div>
          <h1 class="title" id="cover-title"><span class="t1" data-copy="tx_title1"></span><span class="t2"><span class="hl" data-copy="tx_title2"></span></span></h1>
          <p class="lead" data-copy="tx_lead"></p>
          <div class="pills" data-optional-group>
            <span class="pill" data-copy="tx_period" data-optional data-placeholder="기간 입력 (예: 12.1 – 12.31)"></span>
            <span class="pill" data-copy="tx_target" data-optional data-placeholder="대상·조건 입력"></span>
          </div>
        </div>
        <figure class="cover-photo">
          <span class="frame">
            <img class="ph" src="assets/hero.jpg" data-alt="tx_alt_hero" alt="" width="1000" height="1250">
            <span class="crop c1" aria-hidden="true"></span><span class="crop c2" aria-hidden="true"></span><span class="crop c3" aria-hidden="true"></span><span class="crop c4" aria-hidden="true"></span>
            <svg class="callout" aria-hidden="true" focusable="false"><line x1="62.2%" y1="36.7%" x2="21%" y2="78%"/></svg>
            <span class="target" aria-hidden="true"></span>
            <span class="lens" aria-hidden="true"><img src="assets/hero.jpg" alt="" width="1000" height="1250"></span>
            <span class="lens-ring" aria-hidden="true"></span>
            <span class="zoom-tag" aria-hidden="true">ZOOM ×2.4</span>
          </span>
        </figure>
      </div>
    </div>
    <div class="summary">
      <div class="sum sa">
        <p class="sum-flag"><span data-copy="tx_entry_label"></span></p>
        <p class="sum-head"><span class="lab">ROUTE A</span><b data-copy="tx_ra_tag"></b></p>
        <p class="sum-title" data-copy="tx_ra_title"></p>
        <p class="sum-item"><span data-copy="tx_ra1_name"></span> <span class="sum-detail" data-copy="tx_ra1_detail"></span></p>
        <p class="price fit"><b data-copy="tx_ra1_price"></b><span class="unit" data-copy="tx_unit"></span></p>
        <p class="tax" data-copy="tx_tax"></p>
      </div>
      <div class="sum sb">
        <p class="sum-head"><span class="lab">ROUTE B</span><b data-copy="tx_rb_tag"></b></p>
        <p class="sum-title" data-copy="tx_rb_title"></p>
        <p class="sum-item"><span data-copy="tx_rb1_name"></span> <span class="sum-detail" data-copy="tx_rb1_detail"></span></p>
        <p class="price fit"><b data-copy="tx_rb1_price"></b><span class="unit" data-copy="tx_unit"></span></p>
        <p class="tax" data-copy="tx_tax"></p>
      </div>
      <div class="sum sc">
        <p class="sum-head"><span class="lab">ROUTE C</span><b data-copy="tx_rc_tag"></b></p>
        <p class="sum-title" data-copy="tx_rc_title"></p>
        <p class="sum-item"><span data-copy="tx_rc1_name"></span></p>
        <p class="price fit"><b data-copy="tx_rc1_price"></b><span class="unit" data-copy="tx_unit"></span></p>
        <p class="tax" data-copy="tx_tax"></p>
      </div>
    </div>
  </section>

  <!-- 2. CHECK -->
  <section class="check sec" aria-labelledby="check-title">
    <div class="sec-head"><span class="sec-no">01</span><h2 class="sec-title" id="check-title" data-copy="tx_check_title"></h2></div>
    <div class="check-grid">
      <figure class="map">
        <img class="ph" src="assets/close.jpg" data-alt="tx_alt_close" alt="" width="880" height="1100">
        <span class="map-grid" aria-hidden="true"></span>
        <span class="map-pin p1" aria-hidden="true"></span>
        <span class="map-pin p2" aria-hidden="true"></span>
        <span class="map-label" aria-hidden="true">TEXTURE MAP</span>
        <img class="deco loupe-ic" src="assets/miri/loupe.webp" alt="">
      </figure>
      <div class="check-sheet">
        <ol class="checks">
          <li><span class="no">A</span><i class="cb" aria-hidden="true"><img src="assets/miri/check_badge.webp" alt=""></i><span class="ct" data-copy="tx_check1"></span></li>
          <li><span class="no">B</span><i class="cb" aria-hidden="true"><img src="assets/miri/check_badge.webp" alt=""></i><span class="ct" data-copy="tx_check2"></span></li>
          <li><span class="no">C</span><i class="cb" aria-hidden="true"><img src="assets/miri/check_badge.webp" alt=""></i><span class="ct" data-copy="tx_check3"></span></li>
          <li><span class="no">D</span><i class="cb" aria-hidden="true"><img src="assets/miri/check_badge.webp" alt=""></i><span class="ct" data-copy="tx_check4"></span></li>
        </ol>
        <p class="check-note" data-copy="tx_check_note"></p>
        <span class="stamp" aria-hidden="true"><img src="assets/miri/stamp_checked.webp" alt=""><span class="stamp-txt">CHECKED</span></span>
      </div>
    </div>
  </section>
  <!-- 3. ROUTES -->
  <section class="routes sec band-mint" aria-labelledby="routes-title">
    <div class="sec-head"><span class="sec-no">02</span><h2 class="sec-title" id="routes-title" data-copy="tx_routes_title"></h2></div>

    <article class="route ra">
      <div class="route-tab"><span class="lab">ROUTE A</span><b data-copy="tx_ra_tag"></b></div>
      <div class="route-card">
        <div class="route-head"><p class="route-hook" data-copy="tx_ra_hook"></p><h3 class="route-title" data-copy="tx_ra_title"></h3><p class="route-desc" data-copy="tx_ra_desc"></p></div>
        <div class="rt">
          <div class="rt-head"><span data-copy="tx_col_item"></span><span class="rt-hp"><span data-copy="tx_col_price"></span><span class="rt-tax" data-copy="tx_tax"></span></span></div>
          <div class="rt-row"><p class="rt-item"><b class="rt-name" data-copy="tx_ra1_name"></b><span class="rt-detail" data-copy="tx_ra1_detail"></span></p><p class="r-price fit"><b data-copy="tx_ra1_price"></b><span class="unit" data-copy="tx_unit"></span></p></div>
          <div class="rt-row"><p class="rt-item"><b class="rt-name" data-copy="tx_ra2_name"></b><span class="rt-detail" data-copy="tx_ra2_detail"></span></p><p class="r-price fit"><b data-copy="tx_ra2_price"></b><span class="unit" data-copy="tx_unit"></span></p></div>
          <div class="rt-row"><p class="rt-item"><b class="rt-name" data-copy="tx_ra3_name"></b><span class="rt-detail" data-copy="tx_ra3_detail"></span></p><p class="r-price fit"><b data-copy="tx_ra3_price"></b><span class="unit" data-copy="tx_unit"></span></p></div>
        </div>
      </div>
    </article>

    <article class="route rb">
      <div class="route-tab"><span class="lab">ROUTE B</span><b data-copy="tx_rb_tag"></b></div>
      <div class="route-card">
        <div class="route-head"><p class="route-hook" data-copy="tx_rb_hook"></p><h3 class="route-title" data-copy="tx_rb_title"></h3><p class="route-desc" data-copy="tx_rb_desc"></p></div>
        <div class="rt">
          <div class="rt-head"><span data-copy="tx_col_item"></span><span class="rt-hp"><span data-copy="tx_col_price"></span><span class="rt-tax" data-copy="tx_tax"></span></span></div>
          <div class="rt-row"><p class="rt-item"><b class="rt-name" data-copy="tx_rb1_name"></b><span class="rt-detail" data-copy="tx_rb1_detail"></span></p><p class="r-price fit"><b data-copy="tx_rb1_price"></b><span class="unit" data-copy="tx_unit"></span></p></div>
          <div class="rt-row"><p class="rt-item"><b class="rt-name" data-copy="tx_rb2_name"></b><span class="rt-detail" data-copy="tx_rb2_detail"></span></p><p class="r-price fit"><b data-copy="tx_rb2_price"></b><span class="unit" data-copy="tx_unit"></span></p></div>
          <div class="rt-row"><p class="rt-item"><b class="rt-name" data-copy="tx_rb3_name"></b><span class="rt-detail" data-copy="tx_rb3_detail"></span></p><p class="r-price fit"><b data-copy="tx_rb3_price"></b><span class="unit" data-copy="tx_unit"></span></p></div>
        </div>
      </div>
    </article>

    <article class="route rc">
      <div class="route-tab"><span class="lab">ROUTE C</span><b data-copy="tx_rc_tag"></b></div>
      <div class="route-card">
        <div class="route-head"><p class="route-hook" data-copy="tx_rc_hook"></p><h3 class="route-title" data-copy="tx_rc_title"></h3><p class="route-desc" data-copy="tx_rc_desc"></p></div>
        <div class="rt rt-c">
          <div class="rt-head"><span data-copy="tx_col_item"></span><span class="rt-hp"><span data-copy="tx_col_price"></span><span class="rt-tax" data-copy="tx_tax"></span></span></div>
          <div class="rt-row"><p class="rt-item"><b class="rt-name" data-copy="tx_rc1_name"></b></p><p class="r-price fit"><b data-copy="tx_rc1_price"></b><span class="unit" data-copy="tx_unit"></span></p></div>
          <div class="rt-row"><p class="rt-item"><b class="rt-name" data-copy="tx_rc2_name"></b></p><p class="r-price fit"><b data-copy="tx_rc2_price"></b><span class="unit" data-copy="tx_unit"></span></p></div>
        </div>
      </div>
    </article>
    <p class="route-note" data-copy="tx_route_note"></p>
  </section>

  <!-- 4. KIT -->
  <section class="kit sec band-dark" aria-labelledby="kit-title">
    <div class="sec-head"><span class="sec-no">03</span><h2 class="sec-title" id="kit-title" data-copy="tx_prod_title"></h2></div>
    <div class="kit-row">
      <figure class="kit-item"><span class="sample">SAMPLE 01</span><span class="kit-ph"><img class="cut" src="assets/prod-potenza.webp" data-alt="tx_alt_prod1" alt="" width="1000" height="1000"></span><figcaption><b data-copy="tx_prod1"></b><span class="kit-note" data-copy="tx_prod1_note"></span></figcaption></figure>
      <figure class="kit-item"><span class="sample">SAMPLE 02</span><span class="kit-ph"><img class="cut" src="assets/prod-picosure.webp" data-alt="tx_alt_prod2" alt="" width="1000" height="1000"></span><figcaption><b data-copy="tx_prod2"></b><span class="kit-note" data-copy="tx_prod2_note"></span></figcaption></figure>
      <figure class="kit-item"><span class="sample">SAMPLE 03</span><span class="kit-ph"><img class="cut" src="assets/prod-juvelook.webp" data-alt="tx_alt_prod3" alt="" width="1000" height="1000"></span><figcaption><b data-copy="tx_prod3"></b><span class="kit-note" data-copy="tx_prod3_note"></span></figcaption></figure>
      <figure class="kit-item"><span class="sample">SAMPLE 04</span><span class="kit-ph"><img class="cut" src="assets/prod-rejuran.webp" data-alt="tx_alt_prod4" alt="" width="1000" height="1000"></span><figcaption><b data-copy="tx_prod4"></b><span class="kit-note" data-copy="tx_prod4_note"></span></figcaption></figure>
    </div>
  </section>

  <!-- 5. MEMO -->
  <section class="memo sec" aria-labelledby="memo-title">
    <div class="memo-grid">
      <figure class="memo-ph"><img class="ph" src="assets/care.jpg" data-alt="tx_alt_care" alt="" width="880" height="1100"><img class="deco sparkle" src="assets/miri/sparkle_mint.webp" alt=""></figure>
      <div class="memo-body">
        <div class="sec-head"><span class="sec-no">04</span><h2 class="sec-title" id="memo-title" data-copy="tx_care_title"></h2></div>
        <ol class="notes">
          <li><span class="lab">NOTE 01</span><p data-copy="tx_care1"></p></li>
          <li><span class="lab">NOTE 02</span><p data-copy="tx_care2"></p></li>
          <li><span class="lab">NOTE 03</span><p data-copy="tx_care3"></p></li>
        </ol>
      </div>
    </div>
  </section>

  <!-- 6. FAQ -->
  <section class="faq sec band-mint" aria-labelledby="faq-title">
    <div class="sec-head"><span class="sec-no">05</span><h2 class="sec-title" id="faq-title" data-copy="tx_faq_title"></h2></div>
    <div class="qa-grid">
      <article class="qa"><p class="q"><b>Q</b><span data-copy="tx_q1"></span></p><p class="a" data-copy="tx_a1"></p></article>
      <article class="qa"><p class="q"><b>Q</b><span data-copy="tx_q2"></span></p><p class="a" data-copy="tx_a2"></p></article>
      <article class="qa"><p class="q"><b>Q</b><span data-copy="tx_q3"></span></p><p class="a" data-copy="tx_a3"></p></article>
      <article class="qa"><p class="q"><b>Q</b><span data-copy="tx_q4"></span></p><p class="a" data-copy="tx_a4"></p></article>
    </div>
  </section>

  <!-- 7. SIGN-OFF / BOOKING -->
  <section class="sign" aria-labelledby="sign-title">
    <div class="sign-card">
      <div class="sign-main">
        <div class="sign-head"><span class="lab">NEXT STEP</span><h2 class="sign-title" id="sign-title" data-copy="tx_cta_title"></h2></div>
        <dl class="sign-rows">
          <div class="sign-row"><dt data-copy="tx_label_booking"></dt><dd><a data-link="booking" data-copy="tx_link_naver"></a><span class="sep">/</span><a data-link="kakao" data-copy="tx_link_kakao"></a></dd></div>
          <div class="sign-row"><dt data-copy="tx_label_place"></dt><dd data-copy="tx_place"></dd></div>
          <div class="sign-row"><dt data-copy="tx_label_phone"></dt><dd><a class="tel" data-link="phone" data-copy="tx_phone"></a></dd></div>
        </dl>
      </div>
      <div class="sign-side">
        <img class="qr" src="assets/naver-booking-qr.png" alt="" width="424" height="424">
        <p class="qr-label" data-copy="tx_qr_label"></p>
        <img class="seal" src="assets/logo-square.png" alt="" width="360" height="360">
      </div>
    </div>
    <div class="cta">
      <a class="btn btn-naver" data-link="booking" data-copy="tx_btn_naver"></a>
      <a class="btn btn-kakao" data-link="kakao" data-copy="tx_btn_kakao"></a>
    </div>
  </section>

  <!-- 8. NOTICE + FOOTER -->
  <section class="notice">
    <h2 class="notice-title" data-copy="tx_notice_title"></h2>
    <ul>
      <li data-copy="tx_cond1"></li>
      <li data-copy="tx_cond2"></li>
      <li data-copy="tx_cond3"></li>
      <li data-copy="tx_cond4" data-optional data-placeholder="추가 안내 입력 (예: 이벤트 기간·대상)"></li>
    </ul>
  </section>
  <footer class="foot">
    <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
    <p><span data-copy="tx_place"></span><span class="sep">·</span><a data-link="phone" data-copy="tx_phone"></a></p>
  </footer>

</div>
</main>
</body>
</html>
