<!doctype html>
<html lang="ko" data-locale="KO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>찬바람 부는 12월, 피부도 포근하게 챙겨요 · BEAUTY BLOSSOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link id="locale-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&amp;family=Gowun+Batang:wght@400;700&amp;family=Hi+Melody&amp;display=swap">
<link rel="stylesheet" href="winter.css?v=20261029-winter1">
<script src="copy-data.js?v=20261029-winter1" defer></script>
<script src="../inline-edit.js?v=20261029-winter1" defer></script>
<script src="winter.js?v=20261029-winter1" defer></script>
</head>
<body>
<main class="winter" id="winter">
<div class="sheet">

  <!-- 1. HERO: berry knit + arched snowy window + hang tag on a peg -->
  <section class="hero" aria-labelledby="hero-type">
    <div class="hero-top">
      <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
      <span class="hero-eyebrow" data-copy="w_eyebrow"></span>
    </div>
    <h1 class="hero-type" id="hero-type"><img class="type-img" src="assets/miri/type_winter_ritual.webp" alt="Winter Skin Ritual" width="1800" height="212"></h1>
    <div class="hero-grid">
      <figure class="window">
        <img class="window-photo" src="assets/hero.jpg" data-alt="w_alt_hero" alt="" width="1024" height="1536">
      </figure>
      <div class="hero-copy">
        <p class="hero-title"><span data-copy="w_title"></span> <strong data-copy="w_title_strong"></strong></p>
        <div class="hero-pills" data-optional-group>
          <span class="pill" data-copy="w_period" data-optional data-placeholder="기간 입력 (예: 12.1 – 12.31)"></span>
          <span class="pill" data-copy="w_target" data-optional data-placeholder="대상·조건 입력"></span>
        </div>
      </div>
      <div class="tag-wrap hero-tag">
        <div class="tag tag-hero">
          <i class="tag-hole" aria-hidden="true"></i>
          <p class="tag-hook" data-copy="w_set_hook"></p>
          <p class="tag-name"><span class="tag-title" data-copy="w_set_title"></span><span class="tag-count" data-copy="w_set_count"></span></p>
          <p class="price fit"><b data-copy="w_set_price"></b><span class="unit" data-copy="w_unit"></span></p>
          <p class="tag-vat" data-copy="w_vat"></p>
        </div>
      </div>
    </div>
    <img class="deco flake fl1" src="assets/miri/snowflake.webp" alt="">
    <img class="deco flake fl2" src="assets/miri/snowflake.webp" alt="">
    <img class="deco flake fl3" src="assets/miri/snowflake.webp" alt="">
    <img class="deco hero-mug" src="assets/miri/mug_cocoa.webp" alt="">
  </section>

  <!-- 2. FEEL: mittens on a yarn line -->
  <section class="feel knit" aria-labelledby="feel-title">
    <h2 class="sec-title feel-title" id="feel-title" data-copy="w_feel_title"></h2>
    <div class="line">
      <svg class="yarn" viewBox="0 0 1080 140" preserveAspectRatio="none" aria-hidden="true"><path d="M-20 34 C 300 132, 780 132, 1100 34" fill="none" stroke="#A72F3B" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9" opacity=".9"/><path d="M-20 34 C 300 132, 780 132, 1100 34" fill="none" stroke="#7A1E29" stroke-width="2.4" stroke-linecap="round"/></svg>
      <ul class="mittens">
        <li class="mitten m1"><span class="pin" aria-hidden="true"></span><p data-copy="w_feel1"></p></li>
        <li class="mitten m2"><span class="pin" aria-hidden="true"></span><p data-copy="w_feel2"></p></li>
        <li class="mitten m3"><span class="pin" aria-hidden="true"></span><p data-copy="w_feel3"></p></li>
      </ul>
    </div>
    <p class="feel-answer" data-copy="w_feel_answer"></p>
    <img class="deco mitten-art" src="assets/miri/mitten_berry.webp" alt="">
    <img class="deco flake fl5" src="assets/miri/snowflake.webp" alt="">
  </section>

  <!-- 3. INTRO -->
  <section class="intro" aria-labelledby="intro-title">
    <span class="stitch-rule" aria-hidden="true"></span>
    <h2 class="sec-title intro-title" id="intro-title" data-copy="w_intro_title"></h2>
    <p class="intro-body" data-copy="w_intro_body"></p>
  </section>

  <!-- 4. SIGNATURE: 5-step set -->
  <section class="ritual" aria-labelledby="set-title">
    <div class="ritual-grid">
      <figure class="patch-photo">
        <img src="assets/ritual.jpg" data-alt="w_alt_set" alt="" width="880" height="1100">
        <figcaption data-copy="w_set_caption"></figcaption>
      </figure>
      <div class="ritual-body">
        <p class="hook" data-copy="w_set_hook"></p>
        <h2 class="sec-title set-title" id="set-title" data-copy="w_set_title"></h2>
        <div class="set-row">
        <div class="tag-wrap set-tag">
          <div class="tag tag-set">
            <i class="tag-hole" aria-hidden="true"></i>
            <p class="tag-name"><span class="tag-count solo" data-copy="w_set_count"></span></p>
            <p class="price fit"><b data-copy="w_set_price"></b><span class="unit" data-copy="w_unit"></span></p>
            <p class="tag-vat" data-copy="w_vat"></p>
          </div>
        </div>
        <figure class="prod prod-mini">
          <img class="ph" src="assets/prod-lhala-peel.webp" data-alt="w_alt_prod_lhala" alt="" width="1000" height="1000">
        </figure>
        </div>
      </div>
    </div>
    <div class="steps-wrap">
      <p class="steps-label"><span data-copy="w_steps_label"></span></p>
      <ol class="steps">
        <li class="s0"><b data-copy="w_step_ready"></b><span data-copy="w_set_step0"></span></li>
        <li><b>1</b><span data-copy="w_set_step1"></span></li>
        <li><b>2</b><span data-copy="w_set_step2"></span></li>
        <li><b>3</b><span data-copy="w_set_step3"></span></li>
        <li><b>4</b><span data-copy="w_set_step4"></span></li>
        <li><b>5</b><span data-copy="w_set_step5"></span></li>
      </ol>
      <p class="steps-note" data-copy="w_set_note"></p>
      <img class="deco yarn-ball" src="assets/miri/yarn_ball.webp" alt="">
    </div>
  </section>

  <!-- 5. PEEL OPTIONS: tags on a rack + shelf -->
  <section class="peel" aria-labelledby="peel-title">
    <div class="peel-grid">
      <div class="peel-body">
        <p class="hook" data-copy="w_peel_hook"></p>
        <h2 class="sec-title peel-title" id="peel-title" data-copy="w_peel_title"></h2>
        <div class="rack">
          <div class="tag t1">
            <i class="tag-hole" aria-hidden="true"></i>
            <p class="tag-name"><span class="tag-title" data-copy="w_peel1_title"></span><span class="tag-count" data-copy="w_peel1_count"></span></p>
            <p class="price fit"><b data-copy="w_peel1_price"></b><span class="unit" data-copy="w_unit"></span></p>
            <p class="tag-vat" data-copy="w_vat"></p>
          </div>
          <div class="tag t3">
            <i class="tag-hole" aria-hidden="true"></i>
            <p class="tag-name"><span class="tag-title" data-copy="w_peel3_title"></span><span class="tag-count" data-copy="w_peel3_count"></span></p>
            <p class="price fit"><b data-copy="w_peel3_price"></b><span class="unit" data-copy="w_unit"></span></p>
            <p class="tag-vat" data-copy="w_vat"></p>
          </div>
        </div>
        <p class="peel-note" data-copy="w_peel_note"></p>
      </div>
      <figure class="arch-photo">
        <img src="assets/peel.jpg" data-alt="w_alt_peel" alt="" width="880" height="1100">
        <figcaption data-copy="w_peel_caption"></figcaption>
      </figure>
      <img class="deco flake fl6" src="assets/miri/snowflake.webp" alt="">
      <img class="deco flake fl7" src="assets/miri/snowflake.webp" alt="">
    </div>
    <div class="shelf">
      <figure class="prod"><img class="ph" src="assets/prod-black-peel.webp" data-alt="w_alt_prod_black" alt="" width="1000" height="1000"><figcaption data-copy="w_prod_black"></figcaption></figure>
      <figure class="prod"><img class="ph" src="assets/prod-lhala-peel.webp" data-alt="w_alt_prod_lhala" alt="" width="1000" height="1000"><figcaption data-copy="w_prod_lhala"></figcaption></figure>
    </div>
  </section>

  <!-- 6. Q&A: knit patches -->
  <section class="qa" aria-labelledby="qa-title">
    <h2 class="sec-title qa-title" id="qa-title" data-copy="w_qa_title"></h2>
    <div class="patches">
      <article class="patch pa1"><p class="q"><b>Q.</b><span data-copy="w_qa1_q"></span></p><p class="a" data-copy="w_qa1_a"></p></article>
      <article class="patch pa2"><p class="q"><b>Q.</b><span data-copy="w_qa2_q"></span></p><p class="a" data-copy="w_qa2_a"></p></article>
      <article class="patch pa3"><p class="q"><b>Q.</b><span data-copy="w_qa3_q"></span></p><p class="a" data-copy="w_qa3_a"></p></article>
      <article class="patch pa4"><p class="q"><b>Q.</b><span data-copy="w_qa4_q"></span></p><p class="a" data-copy="w_qa4_a"></p></article>
    </div>
    <img class="deco qa-mug" src="assets/miri/mug_cocoa.webp" alt="">
  </section>

  <!-- 7. BOOKING: care tag -->
  <section class="book knit" aria-labelledby="ct-title">
    <div class="caretag">
      <i class="ct-hole" aria-hidden="true"></i>
      <div class="ct-main">
        <div class="ct-head"><span class="ct-en">WINTER CARE TAG</span><h2 class="ct-title" id="ct-title" data-copy="w_book_title"></h2></div>
        <div class="ct-body">
          <figure class="ct-photo"><img src="assets/tag.jpg" data-alt="w_alt_tag" alt="" width="640" height="800"></figure>
          <dl class="ct-rows">
            <div class="ct-row"><dt data-copy="w_label_booking"></dt><dd><a data-link="booking" data-copy="w_link_naver"></a><span class="sep">/</span><a data-link="kakao" data-copy="w_link_kakao"></a></dd></div>
            <div class="ct-row"><dt data-copy="w_label_place"></dt><dd data-copy="w_place"></dd></div>
            <div class="ct-row"><dt data-copy="w_label_phone"></dt><dd><a class="ct-tel" data-link="phone" data-copy="w_phone"></a></dd></div>
          </dl>
        </div>
      </div>
      <div class="ct-stub">
        <img class="qr" src="assets/naver-booking-qr.png" alt="" width="424" height="424">
        <p class="qr-label" data-copy="w_qr_label"></p>
      </div>
      <img class="deco ct-stamp" src="assets/miri/stamp_winter_care.webp" alt="">
    </div>
    <div class="cta">
      <a class="btn btn-naver" data-link="booking" data-copy="w_cta_naver"></a>
      <a class="btn btn-kakao" data-link="kakao" data-copy="w_cta_kakao"></a>
    </div>
  </section>

  <!-- 8. NOTICE (care label) + FOOTER -->
  <section class="notice" aria-labelledby="nt-title">
    <div class="care-label">
      <p class="cl-head" aria-hidden="true">CARE</p>
      <h2 class="cl-title" id="nt-title" data-copy="w_notice_title"></h2>
      <ul>
        <li data-copy="w_cond1"></li>
        <li data-copy="w_cond2"></li>
        <li data-copy="w_cond3" data-optional data-placeholder="추가 안내 입력"></li>
      </ul>
    </div>
  </section>
  <footer class="foot">
    <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
    <p><span data-copy="w_place"></span><span class="sep">·</span><a data-link="phone" data-copy="w_phone"></a></p>
  </footer>

</div>
</main>
</body>
</html>
