              <figure class="dr">
                <figcaption class="dr-tx"><span class="dr-name" data-copy="c1_ab_dr_name"></span><span class="dr-quote" data-copy="c1_ab_dr_quote"></span></figcaption>
                <img class="dr-img" src="assets/director-lee.webp?v=a" data-alt="c1_alt_director" alt="" width="640" height="640">
              </figure>
            </div>
            <div class="ab-photos">
              <figure class="ph-w"><img src="assets/hp-reception.jpg?v=a" data-alt="c1_alt_ph1" alt="" width="960" height="450"><figcaption data-copy="c1_ab_ph1"></figcaption></figure>
              <figure class="ph-n"><img src="assets/hp-care.png?v=a" data-alt="c1_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="c1_ab_ph2"></figcaption></figure>
              <figure class="ph-w"><img src="assets/hp-treatment.jpg?v=a" data-alt="c1_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="c1_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><img class="si" src="assets/icons/genuine.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="c1_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="c1_ab_s1_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/consult.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="c1_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="c1_ab_s2_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/hours.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="c1_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="c1_ab_s3_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/language.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="c1_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="c1_ab_s4_d"></span></li>
            </ul>
          </div>
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="c1_ab_loc"></p><h3 class="bt-t" data-copy="c1_ab_loc_title"></h3></div>
            <div class="loc-body">
              <figure class="map">
                <picture>
                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="c1_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <img class="way-pin" src="assets/icons/pin.webp" alt="" aria-hidden="true" width="192" height="192">
                <div class="way-tx">
                  <p class="way-top"><span class="way-st" data-copy="c1_ab_way_station"></span><span class="way-line" data-copy="c1_ab_way_line"></span></p>
                  <p class="way-addr"><span data-copy="c1_ab_way_addr"></span><span class="way-desk"><span data-copy="c1_ab_way_desk"></span></span></p>
                </div>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="c1_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="c1_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="c1_ab_h1"></li><li data-copy="c1_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="c1_ab_h3"></p>
          </div>
          <div class="bt bt-book">
            <p class="bt-k" data-copy="c1_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="c1_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="c1_alt_qr" alt="" width="424" height="424"><figcaption data-copy="c1_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="c1_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="c1_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><img class="ico ico-phone" src="assets/icons/phone.webp" alt="" aria-hidden="true" width="192" height="192"><a data-link="phone"><span data-copy="c1_ab_phone"></span></a></p>
              </div>
            </div>
            <span class="bk-mark" data-copy="c1_brand"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- notes under the cards (not a card) -->
    <section class="notes" aria-labelledby="c1_notes">
      <h2 id="c1_notes"><img class="notes-ico" src="assets/icons/snow.webp" alt="" aria-hidden="true" width="192" height="192"><span data-copy="c1_note_title"></span></h2>
      <ul>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="c1_cond1"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="c1_cond2"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="c1_cond3"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="c1_cond4"></span></li>
        <li data-optional-group><span class="dot" aria-hidden="true"></span><span data-copy="c1_cond5" data-optional data-placeholder="추가 안내 (예: 대상·조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
