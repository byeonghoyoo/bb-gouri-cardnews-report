<!doctype html>
<html lang="ko" data-locale="KO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>피부 예보 보고 고르는 12월 색소 관리 · BEAUTY BLOSSOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link id="locale-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700&amp;display=swap">
<link rel="stylesheet" href="tone.css?v=20261029-tone2">
<script src="copy-data.js?v=20261029-tone2" defer></script>
<script src="../inline-edit.js?v=20261029-tone2" defer></script>
<script src="tone.js?v=20261029-tone2" defer></script>
</head>
<body>
<main class="tone" id="tone">
<div class="sheet">

  <!-- 1. HERO · today's skin forecast -->
  <section class="hero" aria-labelledby="hero-type">
    <img class="deco cloud cl-a" src="assets/miri/cloud_big.webp" data-fb="assets/icons/cloud_big.svg" alt="">
    <img class="deco cloud cl-b" src="assets/miri/cloud_small.webp" data-fb="assets/icons/cloud_small.svg" alt="">
    <div class="topbar">
      <span class="brand-pill"><img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111"></span>
      <span class="eyebrow" data-copy="tn_eyebrow"></span>
    </div>
    <p class="loc"><svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c-3.9 0-7 3-7 6.9 0 5 7 12.1 7 12.1s7-7.1 7-12.1c0-3.9-3.1-6.9-7-6.9zm0 9.4a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z" fill="currentColor"/></svg><span data-copy="tn_loc"></span></p>
    <h1 class="hero-type" id="hero-type"><img class="type-img" src="assets/miri/type_skin_forecast.webp" alt="SKIN FORECAST"><img class="deco spark sp-a" src="assets/miri/sparkle.webp" data-fb="assets/icons/sparkle.svg" alt=""></h1>
    <p class="hero-title"><span data-copy="tn_title"></span> <strong data-copy="tn_title_strong"></strong></p>
    <div class="pills" data-optional-group>
      <span class="pill" data-copy="tn_period" data-optional data-placeholder="기간 입력 (예: 12.1 – 12.31)"></span>
      <span class="pill pill-target" data-copy="tn_target" data-optional data-placeholder="대상·조건 입력"></span>
    </div>

    <div class="stage">
      <figure class="hero-photo"><img src="assets/hero.jpg" data-alt="tn_alt_hero" alt="" width="1000" height="1250"></figure>
      <img class="deco sun hero-sun" src="assets/miri/sun.webp" data-fb="assets/icons/sun.svg" alt="">
      <img class="deco cloud cl-c" src="assets/miri/cloud_small.webp" data-fb="assets/icons/cloud_small.svg" alt="">
      <div class="widget glass">
        <div class="w-head"><span class="w-label" data-copy="tn_widget_label"></span><img class="w-icon" src="assets/miri/sun.webp" data-fb="assets/icons/sun.svg" alt=""></div>
        <p class="w-price fit"><b data-copy="tn_offer1_price"></b><span class="unit" data-copy="tn_money_unit"></span></p>
        <p class="w-name"><span data-copy="tn_offer1_name"></span><span class="chip" data-copy="tn_offer1_count"></span></p>
        <p class="w-note" data-copy="tn_widget_note"></p>
        <p class="w-tax" data-copy="tn_tax"></p>
      </div>
    </div>
  </section>

  <!-- 2. HOW TO READ -->
  <section class="guide" aria-labelledby="guide-title">
    <p class="kicker">FORECAST GUIDE</p>
    <h2 class="sec-title" id="guide-title" data-copy="tn_intro_title"></h2>
    <p class="sec-body" data-copy="tn_intro_body"></p>
    <ol class="g-cards">
      <li class="g-card">
        <span class="g-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".7"/><path d="M12 12 L18.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></span>
        <b class="g-num" aria-hidden="true">01</b>
        <h3 data-copy="tn_step1_title"></h3>
        <p data-copy="tn_step1_desc"></p>
      </li>
      <li class="g-card">
        <span class="g-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 18 L11 11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M14.5 4.5v3M14.5 14.5v3M10 9.5h-1M21 9.5h-3M17.7 6.3l2-2M17.7 12.7l2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="14.5" cy="9.5" r="2.4" fill="currentColor"/></svg></span>
        <b class="g-num" aria-hidden="true">02</b>
        <h3 data-copy="tn_step2_title"></h3>
        <p data-copy="tn_step2_desc"></p>
      </li>
      <li class="g-card">
        <span class="g-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.2c-2.6 3.6-6 7.2-6 10.6a6 6 0 0 0 12 0c0-3.4-3.4-7-6-10.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.2 14.4a3 3 0 0 0 2.6 2.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <b class="g-num" aria-hidden="true">03</b>
        <h3 data-copy="tn_step3_title"></h3>
        <p data-copy="tn_step3_desc"></p>
      </li>
    </ol>
  </section>

  <!-- 3. STAY FORECAST · menu board -->
  <section class="stay" aria-labelledby="stay-title">
    <div class="stay-head">
      <p class="kicker">STAY FORECAST</p>
      <h2 class="sec-title" id="stay-title" data-copy="tn_stay_title"></h2>
      <p class="sec-body" data-copy="tn_stay_desc"></p>
    </div>
    <div class="stay-grid">
      <img class="deco cloud cl-d" src="assets/miri/cloud_big.webp" data-fb="assets/icons/cloud_big.svg" alt="">
      <figure class="stay-photo">
        <img src="assets/stay.jpg" data-alt="tn_alt_stay" alt="" width="900" height="1125">
        <img class="deco case" src="assets/miri/suitcase.webp" data-fb="assets/icons/suitcase.svg" alt="">
      </figure>
      <div class="board">
        <div class="b-group">
          <p class="b-label"><span class="b-tag" data-copy="tn_group1_label"></span><span class="b-hint" data-copy="tn_group1_hint"></span></p>
          <ul class="rows">
            <li class="row">
              <img class="r-icon" src="assets/miri/sun.webp" data-fb="assets/icons/sun.svg" alt="">
              <div class="r-main"><p class="r-name"><span data-copy="tn_offer1_name"></span><span class="chip" data-copy="tn_offer1_count"></span></p><p class="r-detail" data-copy="tn_offer1_detail"></p></div>
              <p class="r-price fit"><b data-copy="tn_offer1_price"></b><span class="unit" data-copy="tn_money_unit"></span></p>
            </li>
            <li class="row">
              <img class="r-icon" src="assets/miri/sun_cloud.webp" data-fb="assets/icons/sun_cloud.svg" alt="">
              <div class="r-main"><p class="r-name"><span data-copy="tn_offer2_name"></span><span class="chip" data-copy="tn_offer2_count"></span></p><p class="r-detail" data-copy="tn_offer2_detail"></p></div>
              <p class="r-price fit"><b data-copy="tn_offer2_price"></b><span class="unit" data-copy="tn_money_unit"></span></p>
            </li>
            <li class="row">
              <img class="r-icon" src="assets/miri/rainbow.webp" data-fb="assets/icons/rainbow.svg" alt="">
              <div class="r-main"><p class="r-name"><span data-copy="tn_offer3_name"></span><span class="chip" data-copy="tn_offer3_count"></span></p><p class="r-detail" data-copy="tn_offer3_detail"></p></div>
              <p class="r-price fit"><b data-copy="tn_offer3_price"></b><span class="unit" data-copy="tn_money_unit"></span></p>
            </li>
          </ul>
        </div>
        <div class="b-group b-five">
          <p class="b-label"><span class="b-tag" data-copy="tn_group2_label"></span><span class="b-hint" data-copy="tn_group2_hint"></span></p>
          <ul class="rows">
            <li class="row">
              <span class="r-icon five" aria-hidden="true"><img src="assets/miri/sun.webp" data-fb="assets/icons/sun.svg" alt=""><img src="assets/miri/sun.webp" data-fb="assets/icons/sun.svg" alt=""><img src="assets/miri/sun.webp" data-fb="assets/icons/sun.svg" alt=""><img src="assets/miri/sun.webp" data-fb="assets/icons/sun.svg" alt=""><img src="assets/miri/sun.webp" data-fb="assets/icons/sun.svg" alt=""></span>
              <div class="r-main"><p class="r-name"><span data-copy="tn_offer4_name"></span><span class="chip" data-copy="tn_offer4_count"></span></p><p class="r-detail" data-copy="tn_offer4_detail"></p></div>
              <p class="r-price fit"><b data-copy="tn_offer4_price"></b><span class="unit" data-copy="tn_money_unit"></span></p>
            </li>
          </ul>
        </div>
        <p class="b-tax" data-copy="tn_tax"></p>
      </div>
    </div>
  </section>

  <!-- 4. DUAL PICO -->
  <section class="dual" aria-labelledby="dual-title">
    <div class="dual-card">
      <img class="deco cloud cl-e" src="assets/miri/cloud_small.webp" data-fb="assets/icons/cloud_small.svg" alt="">
      <img class="deco spark sp-b" src="assets/miri/sparkle.webp" data-fb="assets/icons/sparkle.svg" alt="">
      <p class="kicker">DUAL PICO</p>
      <h2 class="sec-title" id="dual-title" data-copy="tn_dual_title"></h2>
      <p class="sec-body" data-copy="tn_dual_desc"></p>
      <div class="devices">
        <figure class="dev"><img src="assets/prod-picosure.webp" data-fb="assets/icons/device.svg" data-alt="tn_alt_pico" alt="" width="1000" height="1000"><figcaption data-copy="tn_dev_pico"></figcaption></figure>
        <span class="plus" aria-hidden="true">+</span>
        <figure class="dev"><img src="assets/prod-vlaser.webp" data-fb="assets/icons/device.svg" data-alt="tn_alt_v" alt="" width="1000" height="1000"><figcaption data-copy="tn_dev_v"></figcaption></figure>
      </div>
      <p class="pp"><span class="pp-name"><span data-copy="tn_offer2_name"></span><span class="chip chip-w" data-copy="tn_offer2_count"></span></span><span class="pp-price fit"><b data-copy="tn_offer2_price"></b><span class="unit" data-copy="tn_money_unit"></span></span></p>
    </div>
  </section>

  <!-- 5. BEAUMA · doctor picks 2 of 6 -->
  <section class="custom" aria-labelledby="custom-title">
    <div class="custom-grid">
      <figure class="close-photo"><img src="assets/close.jpg" data-alt="tn_alt_close" alt="" width="900" height="1125"></figure>
      <div class="custom-body">
        <p class="kicker">DOCTOR'S PICK</p>
        <h2 class="sec-title" id="custom-title" data-copy="tn_custom_title"></h2>
        <p class="sec-body" data-copy="tn_custom_desc"></p>
        <div class="dial">
          <img class="deco rainbow" src="assets/miri/rainbow.webp" data-fb="assets/icons/rainbow.svg" alt="">
          <div class="dial-face" aria-hidden="true"></div>
          <ul class="modes">
            <li style="--i:0"><span data-copy="tn_mode1"></span></li>
            <li style="--i:1"><span data-copy="tn_mode2"></span></li>
            <li style="--i:2"><span data-copy="tn_mode3"></span></li>
            <li style="--i:3"><span data-copy="tn_mode4"></span></li>
            <li style="--i:4"><span data-copy="tn_mode5"></span></li>
            <li style="--i:5"><span data-copy="tn_mode6"></span></li>
          </ul>
          <p class="dial-center"><b data-copy="tn_dial_count"></b><span data-copy="tn_dial_unit"></span></p>
        </div>
        <p class="pp pp-light"><span class="pp-name"><span data-copy="tn_offer3_name"></span><span class="chip" data-copy="tn_offer3_count"></span></span><span class="pp-price fit"><b data-copy="tn_offer3_price"></b><span class="unit" data-copy="tn_money_unit"></span></span></p>
      </div>
    </div>
  </section>

  <!-- 6. HOURLY · the visit day -->
  <section class="flow" aria-labelledby="flow-title">
    <p class="kicker">VISIT DAY</p>
    <h2 class="sec-title" id="flow-title" data-copy="tn_flow_title"></h2>
    <ol class="hourly">
      <li><b class="h-num">01</b><span class="h-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".7"/><path d="M12 12l5.6-4.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="h-text" data-copy="tn_flow1"></span></li>
      <li><b class="h-num">02</b><span class="h-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg></span><span class="h-text" data-copy="tn_flow2"></span></li>
      <li><b class="h-num">03</b><span class="h-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.4c-2.6 3.6-6 7.1-6 10.5a6 6 0 0 0 12 0c0-3.4-3.4-6.9-6-10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span><span class="h-text" data-copy="tn_flow3"></span></li>
      <li><b class="h-num">04</b><span class="h-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 12.5a8.5 8.5 0 0 1 17 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 12.5v6.2a1.8 1.8 0 0 1-3.6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 4V2.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="h-text" data-copy="tn_flow4"></span></li>
    </ol>
  </section>

  <!-- 7. Q&A -->
  <section class="qa" aria-labelledby="qa-title">
    <p class="kicker">Q&amp;A</p>
    <h2 class="sec-title" id="qa-title" data-copy="tn_qa_title"></h2>
    <div class="qa-list">
      <article class="qa-item"><p class="q"><b aria-hidden="true">Q</b><span data-copy="tn_qa1_q"></span></p><p class="a" data-copy="tn_qa1_a"></p></article>
      <article class="qa-item"><p class="q"><b aria-hidden="true">Q</b><span data-copy="tn_qa2_q"></span></p><p class="a" data-copy="tn_qa2_a"></p></article>
      <article class="qa-item"><p class="q"><b aria-hidden="true">Q</b><span data-copy="tn_qa3_q"></span></p><p class="a" data-copy="tn_qa3_a"></p></article>
      <article class="qa-item"><p class="q"><b aria-hidden="true">Q</b><span data-copy="tn_qa4_q"></span></p><p class="a" data-copy="tn_qa4_a"></p></article>
    </div>
  </section>

  <!-- 8. BOOKING -->
  <section class="book" aria-labelledby="book-title">
    <img class="deco sun book-sun" src="assets/miri/sun.webp" data-fb="assets/icons/sun.svg" alt="">
    <img class="deco cloud cl-f" src="assets/miri/cloud_big.webp" data-fb="assets/icons/cloud_big.svg" alt="">
    <img class="deco cloud cl-g" src="assets/miri/cloud_small.webp" data-fb="assets/icons/cloud_small.svg" alt="">
    <p class="kicker kicker-w">SEE YOU SOON</p>
    <h2 class="book-title" id="book-title" data-copy="tn_cta_title"></h2>
    <div class="book-card">
      <figure class="book-photo"><img src="assets/book.jpg" data-alt="tn_alt_id" alt="" width="600" height="800"></figure>
      <dl class="bk-rows">
        <div class="bk-row"><dt data-copy="tn_label_booking"></dt><dd><a data-link="booking" data-copy="tn_link_naver"></a><span class="sep">/</span><a data-link="kakao" data-copy="tn_link_kakao"></a></dd></div>
        <div class="bk-row"><dt data-copy="tn_label_place"></dt><dd data-copy="tn_place"></dd></div>
        <div class="bk-row"><dt data-copy="tn_label_phone"></dt><dd><a class="tel" data-link="phone" data-copy="tn_phone"></a></dd></div>
      </dl>
      <div class="bk-qr"><img class="qr" src="assets/naver-booking-qr.png" alt="" width="424" height="424"><p class="qr-label" data-copy="tn_qr_label"></p></div>
    </div>
    <div class="cta">
      <a class="btn btn-naver" data-link="booking" data-copy="tn_cta_naver"></a>
      <a class="btn btn-kakao" data-link="kakao" data-copy="tn_cta_kakao"></a>
    </div>
  </section>

  <!-- 9. NOTICE + FOOTER -->
  <section class="notice">
    <h2 class="notice-title" data-copy="tn_notice_title"></h2>
    <ul>
      <li data-copy="tn_cond1"></li>
      <li data-copy="tn_cond2"></li>
      <li data-copy="tn_cond3"></li>
      <li data-copy="tn_cond4" data-optional data-placeholder="추가 안내 입력"></li>
    </ul>
  </section>
  <footer class="foot">
    <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
    <p><span data-copy="tn_place"></span><span class="sep">·</span><a data-link="phone" data-copy="tn_phone"></a></p>
  </footer>

</div>
</main>
</body>
</html>
