<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>해피아워 · BEAUTY BLOSSOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link id="locale-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&amp;family=Sacramento&amp;display=swap">
  <link rel="stylesheet" href="happyhour12.css?v=20261102-hh12a">
  <script src="copy-data.js?v=20261102-hh12a" defer></script>
  <script src="../inline-edit.js?v=20261102-hh12a" defer></script>
  <script src="happyhour12.js?v=20261102-hh12a" defer></script>
</head>
<body>
<main>
  <div class="pg">

    <!-- 1장 · 히어로: 모델 + Happy Hour / 해피아워 + 화·수·목 10:00–17:00 + 1회 한정가 + 기간 -->
    <section class="panel p1" aria-labelledby="hh-title">
      <img class="p1-photo" src="assets/hero.jpg" data-alt="hh_alt_hero" alt="" width="1000" height="1250">
      <span class="spark sp1" aria-hidden="true"></span><span class="spark sp2" aria-hidden="true"></span><span class="spark sp3" aria-hidden="true"></span>
      <header class="p1-top"><img class="wordmark" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111"></header>
      <div class="p1-copy">
        <p class="eyebrow" data-copy="hh_eyebrow"></p>
        <h1 class="title" id="hh-title" data-copy="hh_title"></h1>
        <div class="when">
          <p class="when-days" data-copy="hh_days"></p>
          <p class="when-hours" data-copy="hh_hours"></p>
        </div>
        <p class="period-pill"><span data-copy="hh_period"></span></p>
        <p class="sticker"><span data-copy="hh_limit"></span></p>
        <p class="contact"><span data-copy="hh_contact_label"></span> <a data-link="phone"><span data-copy="hh_phone"></span></a></p>
      </div>
    </section>

    <!-- 2장 · 메뉴와 가격: 10개(이름·정가·이벤트가는 input/ITEMS.json에서 빌드가 넣음) + VAT 10% 별도 -->
    <section class="panel p2" aria-labelledby="hh-c2">
      <div class="confetti" aria-hidden="true"></div>
      <img class="deco toast" src="assets/miri/toast_glasses.webp" alt="" data-fb="hide">
      <span class="balloons b-right" aria-hidden="true"><i class="bl bl-t"></i><i class="bl bl-o"></i><i class="bl bl-s"></i></span>
      <header class="topbar"><img class="wordmark" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111"><span class="period" data-copy="hh_period"></span></header>
      <div class="p2-head">
        <p class="eyebrow" data-copy="hh_eyebrow"></p>
        <h2 class="p2-title" id="hh-c2"><span data-copy="hh_title"></span> <span class="p2-limit" data-copy="hh_limit"></span></h2>
        <p class="p2-when"><span data-copy="hh_days"></span><span class="dot" aria-hidden="true"></span><span data-copy="hh_hours"></span></p>
      </div>
      <div class="menu-card">
        <p class="menu-label" data-copy="hh_c2_label"></p>
        <ol class="menu">
          <li class="mi"><p class="mi-name" data-copy="hh_i01_name"></p><p class="mi-price"><s class="mi-old" data-copy="hh_i01_old"></s><span class="mi-arrow" aria-hidden="true">→</span><b class="mi-sale" data-copy="hh_i01_sale"></b></p></li>
          <li class="mi"><p class="mi-name" data-copy="hh_i02_name"></p><p class="mi-price"><s class="mi-old" data-copy="hh_i02_old"></s><span class="mi-arrow" aria-hidden="true">→</span><b class="mi-sale" data-copy="hh_i02_sale"></b></p></li>
          <li class="mi"><p class="mi-name" data-copy="hh_i03_name"></p><p class="mi-price"><s class="mi-old" data-copy="hh_i03_old"></s><span class="mi-arrow" aria-hidden="true">→</span><b class="mi-sale" data-copy="hh_i03_sale"></b></p></li>
          <li class="mi"><p class="mi-name" data-copy="hh_i04_name"></p><p class="mi-price"><s class="mi-old" data-copy="hh_i04_old"></s><span class="mi-arrow" aria-hidden="true">→</span><b class="mi-sale" data-copy="hh_i04_sale"></b></p></li>
          <li class="mi"><p class="mi-name" data-copy="hh_i05_name"></p><p class="mi-price"><s class="mi-old" data-copy="hh_i05_old"></s><span class="mi-arrow" aria-hidden="true">→</span><b class="mi-sale" data-copy="hh_i05_sale"></b></p></li>
          <li class="mi"><p class="mi-name" data-copy="hh_i06_name"></p><p class="mi-price"><s class="mi-old" data-copy="hh_i06_old"></s><span class="mi-arrow" aria-hidden="true">→</span><b class="mi-sale" data-copy="hh_i06_sale"></b></p></li>
          <li class="mi"><p class="mi-name" data-copy="hh_i07_name"></p><p class="mi-price"><s class="mi-old" data-copy="hh_i07_old"></s><span class="mi-arrow" aria-hidden="true">→</span><b class="mi-sale" data-copy="hh_i07_sale"></b></p></li>
          <li class="mi"><p class="mi-name" data-copy="hh_i08_name"></p><p class="mi-price"><s class="mi-old" data-copy="hh_i08_old"></s><span class="mi-arrow" aria-hidden="true">→</span><b class="mi-sale" data-copy="hh_i08_sale"></b></p></li>
          <li class="mi"><p class="mi-name" data-copy="hh_i09_name"></p><p class="mi-price"><s class="mi-old" data-copy="hh_i09_old"></s><span class="mi-arrow" aria-hidden="true">→</span><b class="mi-sale" data-copy="hh_i09_sale"></b></p></li>
          <li class="mi"><p class="mi-name" data-copy="hh_i10_name"></p><p class="mi-price"><s class="mi-old" data-copy="hh_i10_old"></s><span class="mi-arrow" aria-hidden="true">→</span><b class="mi-sale" data-copy="hh_i10_sale"></b></p></li>
        </ol>
      </div>
      <p class="vat" data-copy="hh_vat"></p>
      <img class="deco cake" src="assets/miri/cake_candles.webp" alt="" data-fb="hide">
    </section>

    <!-- 3장 · 이용 시간·조건: 요일 띠(화·수·목) · 10:00–17:00 시간 막대 · 1회 한정가 · VAT 10% 별도 · 예약 안내 (시트에 없는 조건은 쓰지 않음) -->
    <section class="panel p3" aria-labelledby="hh-c3">
      <div class="confetti" aria-hidden="true"></div>
      <span class="balloons b-left" aria-hidden="true"><i class="bl bl-s"></i><i class="bl bl-o"></i><i class="bl bl-t"></i></span>
      <div class="c-head">
        <p class="label" data-copy="hh_c3_label"></p>
        <h2 class="c-title" id="hh-c3" data-copy="hh_c3_title"></h2>
        <p class="c-lead" data-copy="hh_c3_lead"></p>
      </div>
      <div class="tt">
        <div class="tt-row">
          <p class="tt-k" data-copy="hh_c3_days_t"></p>
          <ol class="days">
            <li><span data-copy="hh_c3_d1"></span></li>
            <li class="on"><span data-copy="hh_c3_d2"></span></li>
            <li class="on"><span data-copy="hh_c3_d3"></span></li>
            <li class="on"><span data-copy="hh_c3_d4"></span></li>
            <li><span data-copy="hh_c3_d5"></span></li>
            <li><span data-copy="hh_c3_d6"></span></li>
            <li><span data-copy="hh_c3_d7"></span></li>
          </ol>
        </div>
        <div class="tt-row">
          <p class="tt-k" data-copy="hh_c3_time_t"></p>
          <div class="bar">
            <div class="bar-track"><span class="bar-fill"><span class="bar-label" data-copy="hh_c3_bar"></span></span><span class="ticks" aria-hidden="true"></span></div>
            <p class="bar-ends"><span data-copy="hh_c3_t_start"></span><span data-copy="hh_c3_t_end"></span></p>
          </div>
        </div>
        <div class="tt-row">
          <p class="tt-k" data-copy="hh_c3_cond_t"></p>
          <p class="chips"><span class="chip-c" data-copy="hh_limit"></span><span class="chip-c chip-line" data-copy="hh_vat"></span></p>
        </div>
        <div class="tt-row">
          <p class="tt-k" data-copy="hh_c3_period_t"></p>
          <p class="tt-period" data-copy="hh_period"></p>
        </div>
        <p class="holiday" data-copy="hh_c3_holiday"></p>
      </div>
      <div class="booking">
        <img class="qr" src="assets/naver-booking-qr.png" data-qr data-alt="hh_alt_qr" alt="" width="424" height="424">
        <div class="bk-main">
          <span class="pill" data-copy="hh_bk_pill"></span>
          <p class="bk-text"><a data-link="booking"><span data-copy="hh_bk_naver"></span></a><span class="bk-alt" data-bk-alt> / <a data-link="kakao"><span data-copy="hh_bk_kakao"></span></a></span></p>
          <p class="bk-phone"><span data-copy="hh_contact_label"></span> <a data-link="phone"><span data-copy="hh_phone"></span></a></p>
        </div>
      </div>
    </section>

    <!-- 4장 · 시술 안내: 10개를 네 갈래로, 무엇을 조합했는지 사실만 (출처 REFERENCE_AND_PLAN.md) -->
    <section class="panel p4" aria-labelledby="hh-c4">
      <div class="confetti" aria-hidden="true"></div>
      <div class="c-head">
        <p class="label" data-copy="hh_c4_label"></p>
        <h2 class="c-title" id="hh-c4" data-copy="hh_c4_title"></h2>
        <p class="c-lead" data-copy="hh_c4_lead"></p>
      </div>
      <div class="guide">
        <section class="g g1">
          <h3 class="g-t"><span class="g-no" aria-hidden="true">01</span><span data-copy="hh_c4_g1_t"></span></h3>
          <ul class="g-list">
            <li><p class="gi-name" data-copy="hh_i01_name"></p><p class="gi-fact" data-copy="hh_c4_f01"></p></li>
            <li><p class="gi-name" data-copy="hh_i02_name"></p><p class="gi-fact" data-copy="hh_c4_f02"></p></li>
          </ul>
        </section>
        <section class="g g2">
          <h3 class="g-t"><span class="g-no" aria-hidden="true">02</span><span data-copy="hh_c4_g2_t"></span></h3>
          <ul class="g-list">
            <li><p class="gi-name" data-copy="hh_i03_name"></p><p class="gi-fact" data-copy="hh_c4_f03"></p></li>
            <li><p class="gi-name" data-copy="hh_i04_name"></p><p class="gi-fact" data-copy="hh_c4_f04"></p></li>
          </ul>
        </section>
        <section class="g g3">
          <h3 class="g-t"><span class="g-no" aria-hidden="true">03</span><span data-copy="hh_c4_g3_t"></span></h3>
          <ul class="g-list">
            <li><p class="gi-name" data-copy="hh_i05_name"></p><p class="gi-fact" data-copy="hh_c4_f05"></p></li>
            <li><p class="gi-name" data-copy="hh_i06_name"></p><p class="gi-fact" data-copy="hh_c4_f06"></p></li>
            <li><p class="gi-name" data-copy="hh_i07_name"></p><p class="gi-fact" data-copy="hh_c4_f07"></p></li>
          </ul>
        </section>
        <section class="g g4">
          <h3 class="g-t"><span class="g-no" aria-hidden="true">04</span><span data-copy="hh_c4_g4_t"></span></h3>
          <ul class="g-list">
            <li><p class="gi-name" data-copy="hh_i08_name"></p><p class="gi-fact" data-copy="hh_c4_f08"></p></li>
            <li><p class="gi-name" data-copy="hh_i09_name"></p><p class="gi-fact" data-copy="hh_c4_f09"></p></li>
            <li><p class="gi-name" data-copy="hh_i10_name"></p><p class="gi-fact" data-copy="hh_c4_f10"></p></li>
          </ul>
        </section>
      </div>
      <p class="ribbon"><span data-copy="hh_days"></span><span class="dot" aria-hidden="true"></span><span data-copy="hh_hours"></span><span class="dot" aria-hidden="true"></span><span data-copy="hh_limit"></span></p>
    </section>

    <!-- 5장 · 병원 소개 (V4 벤토 그리드 재사용, 이 페이지 톤): A 위 큰 판 · B 찾아오시는 길(구글 지도 원본) · C 진료시간 · D 예약 안내 -->
    <section class="panel p5" aria-labelledby="hh-c5-title">
      <div class="confetti" aria-hidden="true"></div>
      <div class="b5-top">
        <div class="b5-head">
          <div class="b5-lead">
            <p class="b5-about" data-copy="hh_c5_about"></p>
            <h2 class="c5-title" id="hh-c5-title" data-copy="hh_c5_title"></h2>
            <p class="b5-intro"><span data-copy="hh_c5_intro1"></span><span data-copy="hh_c5_intro2"></span></p>
          </div>
          <p class="b5-dr-cap"><span class="b5-dr-name" data-copy="hh_c5_dr_name"></span><span class="b5-dr-quote" data-copy="hh_c5_dr_quote"></span></p>
          <img class="b5-dr" src="assets/director-lee.webp" data-alt="hh_alt_director" alt="" width="640" height="640">
        </div>
        <ul class="b5-photos">
          <li class="wide"><figure><img src="assets/clinic-reception-6f.jpg" data-alt="hh_alt_clinic1" alt="" width="960" height="450"><figcaption data-copy="hh_c5_cap1"></figcaption></figure></li>
          <li class="narrow"><figure><img src="assets/clinic-care-room.jpg" data-alt="hh_alt_clinic2" alt="" width="600" height="280"><figcaption data-copy="hh_c5_cap2"></figcaption></figure></li>
          <li class="wide"><figure><img src="assets/clinic-treatment-6f.jpg" data-alt="hh_alt_clinic3" alt="" width="960" height="450"><figcaption data-copy="hh_c5_cap3"></figcaption></figure></li>
        </ul>
        <ul class="b5-str">
          <li><span class="b5-ico" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><path d="M24 5.5 38.5 10.8V22.6c0 9.3-6.2 16.6-14.5 20-8.3-3.4-14.5-10.7-14.5-20V10.8Z"/><path d="m17 24.4 5 5 9.2-10"/></svg></span><p class="c5-t" data-copy="hh_c5_s1_t"></p><p class="c5-d" data-copy="hh_c5_s1_d"></p></li>
          <li><span class="b5-ico" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><path d="M7.5 12.8c0-2.6 2.1-4.8 4.8-4.8h16.6c2.6 0 4.8 2.1 4.8 4.8v9.6c0 2.6-2.1 4.8-4.8 4.8H18.6l-6.6 5.6v-5.7c-2.6-.2-4.5-2.3-4.5-4.7Z"/><path d="M38.2 17.6h1c2.2 0 4 1.8 4 4v8.6c0 2.2-1.8 4-4 4h-.6v5.1l-5.7-5.1h-6.6c-2.2 0-4-1.8-4-4v-.8"/><path d="M14.6 17.6h.01M20.6 17.6h.01M26.6 17.6h.01"/></svg></span><p class="c5-t" data-copy="hh_c5_s2_t"></p><p class="c5-d" data-copy="hh_c5_s2_d"></p></li>
          <li><span class="b5-ico" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><circle cx="22" cy="26" r="15"/><path d="M22 17.5V26l6 3.8"/><path d="M38.6 5.8a6.2 6.2 0 1 0 4.6 10.1 5.1 5.1 0 0 1-4.6-10.1Z"/></svg></span><p class="c5-t" data-copy="hh_c5_s3_t"></p><p class="c5-d" data-copy="hh_c5_s3_d"></p></li>
          <li><span class="b5-ico" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><circle cx="24" cy="24" r="17"/><path d="M7 24h34M10.2 15.5h27.6M10.2 32.5h27.6"/><path d="M24 7c5.2 4.7 7.6 10.6 7.6 17S29.2 36.3 24 41c-5.2-4.7-7.6-10.6-7.6-17S18.8 11.7 24 7Z"/></svg></span><p class="c5-t" data-copy="hh_c5_s4_t"></p><p class="c5-d" data-copy="hh_c5_s4_d"></p></li>
        </ul>
      </div>
      <div class="b5-grid">
        <div class="b5-box b5-loc">
          <h3 class="b5-h" data-copy="hh_c5_loc_title"></h3>
          <!-- Google Maps capture with its original colours, nothing on top (the Google marker, name, logo and attribution are in the image). -->
          <div class="b5-map">
            <picture>
              <source data-map-tier="desk" media="(min-width: 1024px)" width="880" height="514">
              <source data-map-tier="tab" media="(min-width: 768px)" width="732" height="428">
              <img class="b5-map-img" data-map-tier="mob" data-alt="hh_alt_map" alt="" width="1002" height="588">
            </picture>
          </div>
          <p class="b5-station"><svg class="b5-st-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.2c-4.3 0-7.8 3.4-7.8 7.7 0 5.6 7.8 12 7.8 12s7.8-6.4 7.8-12c0-4.3-3.5-7.7-7.8-7.7Z"/><circle cx="12" cy="9.9" r="2.9"/></svg><span class="b5-st-name" data-copy="hh_c5_station"></span><span class="b5-pill" data-copy="hh_c5_lines"></span></p>
          <p class="b5-addr" data-copy="hh_c5_addr"></p>
          <p class="b5-recep" data-copy="hh_c5_reception"></p>
        </div>
        <div class="b5-box b5-hours">
          <h3 class="b5-h" data-copy="hh_c5_hours_lbl"></h3>
          <div class="b5-hrs">
            <p class="b5-hr" data-copy="hh_c5_hours1"></p>
            <p class="b5-hr" data-copy="hh_c5_hours2"></p>
            <p class="b5-note" data-copy="hh_c5_hours3"></p>
          </div>
        </div>
        <div class="b5-box b5-book">
          <h3 class="b5-h" data-copy="hh_bk_pill"></h3>
          <div class="b5-bk">
            <img class="qr" src="assets/naver-booking-qr.png" data-qr data-alt="hh_alt_qr" alt="" width="424" height="424">
            <div class="bk-main">
              <p class="bk-text"><a data-link="booking"><span data-copy="hh_bk_naver"></span></a><span class="bk-alt" data-bk-alt> / <a data-link="kakao"><span data-copy="hh_bk_kakao"></span></a></span></p>
              <p class="bk-phone"><span data-copy="hh_contact_label"></span> <a data-link="phone"><span data-copy="hh_phone"></span></a></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="notes" aria-labelledby="hh-notes">
      <h2 id="hh-notes"><span data-copy="hh_note_title"></span></h2>
      <ul>
        <li><span class="fb-dot" aria-hidden="true"></span><span data-copy="hh_cond1"></span></li>
        <li><span class="fb-dot" aria-hidden="true"></span><span data-copy="hh_cond2"></span></li>
        <li><span class="fb-dot" aria-hidden="true"></span><span data-copy="hh_cond3"></span></li>
        <li data-optional-group><span class="fb-dot" aria-hidden="true"></span><span data-copy="hh_cond4" data-optional data-placeholder="추가 안내 (예: 기간·대상 조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
