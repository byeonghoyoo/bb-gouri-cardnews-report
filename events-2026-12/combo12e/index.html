            <ul class="ab-strengths">
              <li><span class="sh"><img class="si" src="assets/icons/genuine.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="c5_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="c5_ab_s1_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/consult.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="c5_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="c5_ab_s2_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/hours.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="c5_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="c5_ab_s3_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/language.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="c5_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="c5_ab_s4_d"></span></li>

            <div class="loc-head"><p class="bt-k" data-copy="c5_ab_loc"></p><h3 class="bt-t" data-copy="c5_ab_loc_title"></h3></div>

                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">

              <div class="way">

                  <p class="way-top"><span class="way-st" data-copy="c5_ab_way_station"></span><span class="way-line" data-copy="c5_ab_way_line"></span></p>

          <div class="bt bt-book">

              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="c5_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="c5_ab_bk_kakao"></span></a></span></p>

            <img class="wordmark" src="assets/logo-wordmark-22344a.png" alt="BEAUTY BLOSSOM" width="975" height="111">
