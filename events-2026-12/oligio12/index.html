              <figure class="ph-w"><img src="assets/hp-reception.jpg?v=b" data-alt="ox_alt_ph1" alt="" width="960" height="450"><figcaption data-copy="ox_ab_ph1"></figcaption></figure>
              <figure class="ph-n"><img src="assets/hp-care.jpg?v=a" data-alt="ox_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="ox_ab_ph2"></figcaption></figure>
              <figure class="ph-w"><img src="assets/hp-treatment.jpg?v=b" data-alt="ox_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="ox_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><svg class="si" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle class="si-bg" cx="31" cy="31" r="13"/><path d="M24 5.5l14.5 5.2v10.6c0 9.4-6.2 17.2-14.5 20.7C15.7 38.5 9.5 30.7 9.5 21.3V10.7z"/><path d="M17.5 23.5l4.6 4.6 8.6-9"/></svg><span class="at" data-copy="ox_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ox_ab_s1_d"></span></li>
              <li><span class="sh"><svg class="si" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle class="si-bg" cx="31" cy="31" r="13"/><path d="M9 9.5h21a3.5 3.5 0 0 1 3.5 3.5v11a3.5 3.5 0 0 1-3.5 3.5H18l-6.5 5.5v-5.5H9A3.5 3.5 0 0 1 5.5 24V13A3.5 3.5 0 0 1 9 9.5z"/><path d="M37.5 19.5H39a3.5 3.5 0 0 1 3.5 3.5v10a3.5 3.5 0 0 1-3.5 3.5h-1.5V41l-5.5-4.5h-8a3.5 3.5 0 0 1-3.5-3.5v-1.5"/><path class="si-dot" d="M13.5 18.5h.01M19.5 18.5h.01M25.5 18.5h.01"/></svg><span class="at" data-copy="ox_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ox_ab_s2_d"></span></li>
              <li><span class="sh"><svg class="si" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle class="si-bg" cx="31" cy="31" r="13"/><circle cx="21" cy="26" r="15"/><path d="M21 17v9l6 4"/><path d="M39.5 4.5a6.5 6.5 0 1 0 5 11.2 7.5 7.5 0 0 1-5-11.2z"/></svg><span class="at" data-copy="ox_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ox_ab_s3_d"></span></li>
              <li><span class="sh"><svg class="si" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><circle class="si-bg" cx="31" cy="31" r="13"/><circle cx="23" cy="24" r="17"/><ellipse cx="23" cy="24" rx="7.5" ry="17"/><path d="M6 24h34M9 15h28M9 33h28"/></svg><span class="at" data-copy="ox_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ox_ab_s4_d"></span></li>
            </ul>
          </div>
          <!-- B: directions (map: OpenStreetMap, credit must stay visible) -->
          <div class="bt bt-loc">
            <p class="bt-k" data-copy="ox_ab_loc"></p>
            <h3 class="bt-t" data-copy="ox_ab_loc_title"></h3>
            <figure class="map">
              <img class="map-img" src="assets/map-osm-light.webp?v=a" data-alt="ox_alt_map" alt="" width="820" height="480">
              <span class="map-pin"><svg class="pin" viewBox="0 0 34 44" aria-hidden="true" focusable="false"><path d="M17 1.5C8.4 1.5 1.5 8.3 1.5 16.8 1.5 28.2 17 42.5 17 42.5S32.5 28.2 32.5 16.8C32.5 8.3 25.6 1.5 17 1.5z" fill="#1769c2" stroke="#ffffff" stroke-width="2"/><circle cx="17" cy="16.5" r="7.5" fill="#ffffff"/><path d="M17 12.6v7.8M13.1 16.5h7.8" stroke="#1769c2" stroke-width="2.6" stroke-linecap="round"/></svg><span class="map-lbl" data-copy="ox_ab_map_pin"></span></span>
              <figcaption class="map-credit"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer"><span data-copy="ox_ab_map_credit"></span></a></figcaption>
            </figure>
            <div class="way">
              <svg class="way-pin" viewBox="0 0 40 50" aria-hidden="true" focusable="false"><path d="M20 2C10.1 2 2 9.9 2 19.6 2 32.8 20 48 20 48S38 32.8 38 19.6C38 9.9 29.9 2 20 2z" fill="#dcebfb" stroke="#1769c2" stroke-width="2.4"/><circle cx="20" cy="19.5" r="6.5" fill="#ffffff" stroke="#1769c2" stroke-width="2.4"/></svg>
              <div class="way-tx">
                <p class="way-top"><span class="way-st" data-copy="ox_ab_way_station"></span><span class="way-line" data-copy="ox_ab_way_line"></span></p>
                <p class="way-addr" data-copy="ox_ab_way_addr"></p>
                <p class="way-desk"><span data-copy="ox_ab_way_desk"></span></p>
              </div>
            </div>
          </div>
          <!-- C: hours (confirmed values) -->
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="ox_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="ox_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="ox_ab_h1"></li><li data-copy="ox_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="ox_ab_h3"></p>
          </div>
          <!-- D: booking (QR and channels per language, phone) -->
          <div class="bt bt-book">
            <p class="bt-k" data-copy="ox_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="ox_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="ox_alt_qr" alt="" width="424" height="424"><figcaption data-copy="ox_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="ox_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="ox_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><svg class="ph-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 3.5l3 3.1-1.8 2.6a13.5 13.5 0 0 0 7 7l2.6-1.8 3.1 3-1.7 3.1c-.4.7-1.2 1-2 .9C10 20.7 3.3 14 2.6 7.2c-.1-.8.2-1.6.9-2z" fill="currentColor"/></svg><a data-link="phone"><span data-copy="ox_ab_phone"></span></a></p>
              </div>
            </div>
            <span class="bk-mark" data-copy="ox_brand"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- notes under both panels (same structure as aptos12) -->
    <section class="notes" aria-labelledby="ox-notes">
      <h2 id="ox-notes"><span data-copy="ox_note_title"></span></h2>
      <ul>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="ox_cond1"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="ox_cond2"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="ox_cond3"></span></li>
        <li data-optional-group><span class="dot" aria-hidden="true"></span><span data-copy="ox_cond4" data-optional data-placeholder="추가 안내 (예: 기간·대상 조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
