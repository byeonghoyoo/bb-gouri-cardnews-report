<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>oligio xm · BEAUTY BLOSSOM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Outfit:wght@500;600;700;800&amp;family=Quicksand:wght@600;700&amp;display=swap">
  <link rel="stylesheet" href="oligio12.css?v=20261029-oligio12b">
  <script src="copy-data.js?v=20261029-oligio12b" defer></script>
  <script src="../inline-edit.js?v=20261029-oligio12b" defer></script>
  <script src="oligio12.js?v=20261029-oligio12b" defer></script>
</head>
<body>
<main class="ox">
  <div class="sheet">

    <!-- 1 / 2 : poster -->
    <section class="p1" aria-labelledby="ox-t1">
      <img class="p1-photo" src="assets/hero.jpg?v=a" data-alt="ox_alt_hero" alt="" width="1080" height="1350">
      <div class="p1-light" aria-hidden="true"></div>
      <i class="beam b1" aria-hidden="true"></i>
      <i class="beam b2" aria-hidden="true"></i>
      <span class="mw m-light" data-kind="light" aria-hidden="true"><img class="miri" src="assets/miri/ice_light.webp" alt=""></span>
      <div class="snow" aria-hidden="true"></div>
      <span class="mw m-bokeh" data-kind="bokeh" aria-hidden="true"><img class="miri" src="assets/miri/snow_bokeh.webp" alt=""></span>
      <div class="p1-shade" aria-hidden="true"></div>
      <div class="p1-glow" aria-hidden="true"></div>
      <img class="p1-device" src="assets/device.webp?v=a" data-alt="ox_alt_device" alt="" width="291" height="718">
      <i class="mw flake fl1" aria-hidden="true"><img class="miri" src="assets/miri/snowflake_crystal.webp" alt=""></i>
      <i class="mw flake fl2" aria-hidden="true"><img class="miri" src="assets/miri/snowflake_crystal.webp" alt=""></i>
      <i class="mw flake fl3" aria-hidden="true"><img class="miri" src="assets/miri/snowflake_crystal.webp" alt=""></i>
      <span class="mw ornament" data-kind="ornament" aria-hidden="true"><img class="miri" src="assets/miri/ornament_ice.webp" alt=""></span>

      <header class="top">
        <span class="period" data-copy="ox_period" data-optional data-placeholder="12월 기간"></span>
        <span class="brand" data-copy="ox_brand"></span>
      </header>
      <div class="p1-copy">
        <p class="season" data-copy="ox_season" data-optional data-placeholder="December" data-type-src="assets/miri/type_december.webp" data-type-text="December" data-type-locales="*"></p>
        <p class="hook" data-type-src="assets/miri/type_hook_ko.webp" data-type-keys="ox_hook1|ox_hook2" data-type-text="고주파와 초음파를 하나로,|한 번에 받는 리프팅" data-type-locales="KO"><span data-copy="ox_hook1"></span><span data-copy="ox_hook2"></span></p>
      </div>
      <h1 class="p1-title" id="ox-t1">
        <span class="t-pre" data-copy="ox_title_pre" data-type-src="assets/miri/type_title_pre_ko.webp" data-type-text="올리지오의 진화," data-type-locales="KO"></span>
        <span class="t-wrap"><span class="t-main" data-copy="ox_title_main" data-type-src="assets/miri/type_oligio_xm.webp" data-type-text="oligio xm" data-type-locales="*"></span><i class="mw spark sp1" aria-hidden="true"><img class="miri" src="assets/miri/sparkle_silver.webp" alt=""></i></span>
      </h1>
      <p class="p1-contact"><i class="mw cicon" aria-hidden="true"><img class="miri" src="assets/miri/icon_phone.webp" alt=""></i><span class="contact" data-copy="ox_contact"></span></p>
    </section>

    <!-- 2 / 2 : price list -->
    <section class="p2" aria-labelledby="ox-t2">
      <div class="snow" aria-hidden="true"></div>
      <span class="mw m-light2" data-kind="light" aria-hidden="true"><img class="miri" src="assets/miri/ice_light.webp" alt=""></span>
      <div class="p2-in">
        <header class="top2">
          <span class="brand" data-copy="ox_brand"></span>
          <span class="period" data-copy="ox_period" data-optional data-placeholder="12월 기간"></span>
        </header>
        <div class="p2-head">
          <figure class="p2-visual">
            <img class="p2-photo" src="assets/model2.jpg?v=a" data-alt="ox_alt_model2" alt="" width="760" height="950">
            <span class="p2-glow" aria-hidden="true"></span>
            <img class="p2-device" src="assets/device.webp?v=a" data-alt="ox_alt_device" alt="" width="291" height="718">
            <i class="mw flake fl4" aria-hidden="true"><img class="miri" src="assets/miri/snowflake_crystal.webp" alt=""></i>
          </figure>
          <h2 class="p2-title" id="ox-t2">
            <span class="t-pre" data-copy="ox_title_pre" data-type-src="assets/miri/type_title_pre_ko.webp" data-type-text="올리지오의 진화," data-type-locales="KO"></span>
            <span class="t-wrap"><span class="t-main" data-copy="ox_title_main" data-type-src="assets/miri/type_oligio_xm.webp" data-type-text="oligio xm" data-type-locales="*"></span><i class="mw spark sp2" aria-hidden="true"><img class="miri" src="assets/miri/sparkle_silver.webp" alt=""></i></span>
          </h2>
        </div>

        <div class="card">
          <i class="mw corner c-tl" aria-hidden="true"><img class="miri" src="assets/miri/frost_corner.webp" alt=""></i>
          <i class="mw corner c-tr" aria-hidden="true"><img class="miri" src="assets/miri/frost_corner.webp" alt=""></i>
          <i class="mw corner c-bl" aria-hidden="true"><img class="miri" src="assets/miri/frost_corner.webp" alt=""></i>
          <i class="mw corner c-br" aria-hidden="true"><img class="miri" src="assets/miri/frost_corner.webp" alt=""></i>
          <span class="mw ribbon" aria-hidden="true"><img class="miri" src="assets/miri/ribbon_silver.webp" alt=""></span>

          <section class="grp">
            <div class="grp-head"><i class="mw gicon" aria-hidden="true"><img class="miri" src="assets/miri/icon_rf.webp" alt=""></i><h3 class="grp-title" data-copy="ox_g1_title" data-type-src="assets/miri/type_g1_ko.webp" data-type-text="홍대·합정 올리지오 XM 런칭" data-type-locales="KO"></h3></div>
            <ul class="rows">
              <li class="row"><span class="name"><span data-copy="ox_r1_name"></span></span><span class="old money" data-copy="ox_r1_old"></span><span class="price money" data-copy="ox_r1_price"></span></li>
              <li class="row"><span class="name"><span class="badge hot" data-copy="ox_r2_badge" data-optional data-placeholder="배지" data-type-src="assets/miri/type_badge_hot.webp" data-type-text="HOT" data-type-locales="*"></span><span data-copy="ox_r2_name"></span></span><span class="old money" data-copy="ox_r2_old"></span><span class="price money" data-copy="ox_r2_price"></span></li>
              <li class="row"><span class="name"><span data-copy="ox_r3_name"></span></span><span class="old money" data-copy="ox_r3_old"></span><span class="price money" data-copy="ox_r3_price"></span></li>
              <li class="row"><span class="name"><span data-copy="ox_r4_name"></span></span><span class="old money" data-copy="ox_r4_old"></span><span class="price money" data-copy="ox_r4_price"></span></li>
            </ul>
          </section>

          <section class="grp">
            <div class="grp-head"><i class="mw gicon" aria-hidden="true"><img class="miri" src="assets/miri/icon_dual.webp" alt=""></i><h3 class="grp-title" data-copy="ox_g2_title" data-type-src="assets/miri/type_g2_ko.webp" data-type-text="올리지오 XM 듀얼 에너지, RF와 HIFU를 함께" data-type-locales="KO"></h3></div>
            <ul class="rows">
              <li class="row"><span class="name"><span data-copy="ox_r5_name"></span></span><span class="old money" data-copy="ox_r5_old"></span><span class="price money" data-copy="ox_r5_price"></span></li>
              <li class="row"><span class="name"><span class="badge best" data-copy="ox_r6_badge" data-optional data-placeholder="배지" data-type-src="assets/miri/type_badge_best.webp" data-type-text="BEST" data-type-locales="*"></span><span data-copy="ox_r6_name"></span></span><span class="old money" data-copy="ox_r6_old"></span><span class="price money" data-copy="ox_r6_price"></span></li>
              <li class="row"><span class="name"><span data-copy="ox_r7_name"></span></span><span class="old money" data-copy="ox_r7_old"></span><span class="price money" data-copy="ox_r7_price"></span></li>
              <li class="row"><span class="name"><span class="badge hot" data-copy="ox_r8_badge" data-optional data-placeholder="배지" data-type-src="assets/miri/type_badge_hot.webp" data-type-text="HOT" data-type-locales="*"></span><span data-copy="ox_r8_name"></span></span><span class="old money" data-copy="ox_r8_old"></span><span class="price money" data-copy="ox_r8_price"></span></li>
              <li class="row"><span class="name"><span data-copy="ox_r9_name"></span></span><span class="old money" data-copy="ox_r9_old"></span><span class="price money" data-copy="ox_r9_price"></span></li>
            </ul>
          </section>

          <section class="grp">
            <div class="grp-head"><i class="mw gicon" aria-hidden="true"><img class="miri" src="assets/miri/icon_eye.webp" alt=""></i><h3 class="grp-title" data-copy="ox_g3_title" data-type-src="assets/miri/type_g3_ko.webp" data-type-text="눈가 라인까지 섬세하게, 아이 XM" data-type-locales="KO"></h3></div>
            <ul class="rows">
              <li class="row"><span class="name"><span class="pre" data-copy="ox_eye_prefix"></span><span data-copy="ox_r10_name"></span></span><span class="old money" data-copy="ox_r10_old"></span><span class="price money" data-copy="ox_r10_price"></span></li>
              <li class="row"><span class="name"><span class="pre" data-copy="ox_eye_prefix"></span><span data-copy="ox_r11_name"></span></span><span class="old money" data-copy="ox_r11_old"></span><span class="price money" data-copy="ox_r11_price"></span></li>
              <li class="row"><span class="name"><span class="pre" data-copy="ox_eye_prefix"></span><span data-copy="ox_r12_name"></span></span><span class="old money" data-copy="ox_r12_old"></span><span class="price money" data-copy="ox_r12_price"></span></li>
            </ul>
          </section>
        </div>

        <footer class="p2-foot">
          <span class="contact-line"><i class="mw cicon" aria-hidden="true"><img class="miri" src="assets/miri/icon_phone.webp" alt=""></i><span class="contact" data-copy="ox_contact"></span></span>
          <span class="vat" data-copy="ox_vat"></span>
        </footer>
      </div>
    </section>

    <!-- notes under both panels (same structure as aptos12) -->
    <section class="notes" aria-labelledby="ox-notes">
      <h2 id="ox-notes"><span data-copy="ox_note_title"></span></h2>
      <ul>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="ox_cond1"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="ox_cond2"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="ox_cond3"></span></li>
        <li data-optional-group><span class="dot" aria-hidden="true"></span><span data-copy="ox_cond4" data-optional data-placeholder="추가 안내 (예: 기간·대상 조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
