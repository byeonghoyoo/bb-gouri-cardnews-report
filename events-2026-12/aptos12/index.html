<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>NAMICA 리프팅 런칭 · BEAUTY BLOSSOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<body>
<main>
  <div class="pg">

    <!-- 1장 · 포스터 (현재 버전과 같은 구성: 상단 띠 → 모델·제품 → 제목 → 문의) -->
    <section class="panel p1" aria-labelledby="ap-title">
      <div class="p1-photo">
        <img class="ph" src="assets/poster.jpg" data-alt="ap_alt_poster" alt="" width="1080" height="1350">
        <span class="chip chip1" data-copy="ap_chip1"></span>
        <span class="chip chip2" data-copy="ap_chip2"></span>
      </div>
      <div class="snow" aria-hidden="true"></div>
      <img class="deco snowdust" src="assets/miri/snow_dust.webp" alt="" data-fb="hide">
      <div class="frost-frame" aria-hidden="true"></div>
      <img class="deco corner c-tl" src="assets/miri/corner_filigree.webp" alt="" data-fb="hide">
      <img class="deco corner c-tr" src="assets/miri/corner_filigree.webp" alt="" data-fb="hide">
      <img class="deco corner c-bl" src="assets/miri/corner_filigree.webp" alt="" data-fb="hide">
      <img class="deco corner c-br" src="assets/miri/corner_filigree.webp" alt="" data-fb="hide">
      <img class="deco garland" src="assets/miri/garland_lights.webp" alt="" data-fb="hide">
      <header class="topbar">
        <img class="type-img ed" src="assets/miri/type_winter_edition.webp" alt="Winter Edition">
        <img class="wordmark" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
        <span class="period" data-copy="ap_period" data-optional data-placeholder="12월 이벤트 기간"></span>
      </header>
      <img class="box box-a" src="assets/prod-namica-visage.webp" data-alt="ap_alt_box1" alt="" width="913" height="270">
      <img class="box box-b" src="assets/prod-namica-nano.webp" data-alt="ap_alt_box3" alt="" width="915" height="268">
      <img class="deco flake f1" src="assets/miri/snowflake_crystal.webp" alt="" data-fb="flake">
      <div class="p1-copy">
        <img class="type-img dec" src="assets/miri/type_december.webp" alt="December">
        <p class="kicker" data-copy="ap_kicker"></p>
        <h1 class="title" id="ap-title"><span data-copy="ap_title"></span><img class="deco spark sp1" src="assets/miri/sparkle_star.webp" alt="" data-fb="spark"></h1>
        <p class="sub" data-copy="ap_sub"></p>
      </div>
      <p class="contact"><img class="ico ico-phone" src="assets/miri/icon_phone.webp" alt="" data-fb="hide"><span data-copy="ap_contact_label"></span> <a data-link="phone"><span data-copy="ap_phone"></span></a></p>
    </section>

    <!-- 2장 · 가격표 + 예약 안내 (현재 버전과 같은 구성) -->
    <section class="panel p2" aria-labelledby="ap-list">
      <div class="snow" aria-hidden="true"></div>
      <img class="deco snowdust" src="assets/miri/snow_dust.webp" alt="" data-fb="hide">
      <div class="p2-head">
        <img class="p2-photo" src="assets/top.jpg" data-alt="ap_alt_top" alt="" width="1200" height="675">
        <img class="deco namica-wm" src="assets/miri/type_namica.webp" alt="" data-fb="hide">
        <header class="topbar">
          <img class="wordmark" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
          <span class="period" data-copy="ap_period" data-optional data-placeholder="12월 이벤트 기간"></span>
        </header>
        <img class="box box-c" src="assets/prod-namica-visage-s.webp" data-alt="ap_alt_box2" alt="" width="924" height="273">
        <div class="p2-title">
          <img class="type-img pl" src="assets/miri/type_price_list.webp" alt="Price List">
          <p class="kicker" data-copy="ap_kicker"></p>
          <p class="title t2" data-copy="ap_title"></p>
        </div>
      </div>

      <div class="card">
        <img class="deco branch" src="assets/miri/frost_branch.webp" alt="" data-fb="hide">
        <img class="deco bauble" src="assets/miri/ornament_bauble.webp" alt="" data-fb="bauble">
        <img class="deco bow" src="assets/miri/ribbon_bow.webp" alt="" data-fb="hide">
        <h2 class="list-title" id="ap-list" data-copy="ap_list_title"></h2>
        <ol class="rows">
          <li class="row">
            <div class="r-main"><p class="r-name" data-copy="ap_r1_name"></p><p class="r-desc" data-copy="ap_r1_desc"></p></div>
            <p class="qty" data-copy="ap_r1_qty"></p>
            <div class="prices"><s class="old"><span data-copy="ap_r1_old"></span><span data-copy="ap_unit"></span></s><span class="arrow" aria-hidden="true">→</span><p class="sale fit"><b data-copy="ap_r1_sale"></b><span class="unit" data-copy="ap_unit"></span></p></div>
          </li>
          <li class="row">
            <div class="r-main"><p class="r-name" data-copy="ap_r2_name"></p><p class="r-desc" data-copy="ap_r2_desc"></p></div>
            <p class="qty" data-copy="ap_r2_qty"></p>
            <div class="prices"><s class="old"><span data-copy="ap_r2_old"></span><span data-copy="ap_unit"></span></s><span class="arrow" aria-hidden="true">→</span><p class="sale fit"><b data-copy="ap_r2_sale"></b><span class="unit" data-copy="ap_unit"></span></p></div>
          </li>
          <li class="row">
            <div class="r-main"><p class="r-name" data-copy="ap_r3_name"></p><p class="r-desc" data-copy="ap_r3_desc"></p></div>
            <p class="qty" data-copy="ap_r3_qty"></p>
            <div class="prices"><s class="old"><span data-copy="ap_r3_old"></span><span data-copy="ap_unit"></span></s><span class="arrow" aria-hidden="true">→</span><p class="sale fit"><b data-copy="ap_r3_sale"></b><span class="unit" data-copy="ap_unit"></span></p></div>
          </li>
          <li class="row">
            <div class="r-main"><p class="r-name" data-copy="ap_r4_name"></p><p class="r-desc" data-copy="ap_r4_desc"></p></div>
            <p class="qty" data-copy="ap_r4_qty"></p>
            <div class="prices"><s class="old"><span data-copy="ap_r4_old"></span><span data-copy="ap_unit"></span></s><span class="arrow" aria-hidden="true">→</span><p class="sale fit"><b data-copy="ap_r4_sale"></b><span class="unit" data-copy="ap_unit"></span></p></div>
          </li>
          <li class="row">
            <div class="r-main"><p class="r-name" data-copy="ap_r5_name"></p><p class="r-desc" data-copy="ap_r5_desc"></p></div>
            <p class="qty" data-copy="ap_r5_qty"></p>
            <div class="prices"><s class="old"><span data-copy="ap_r5_old"></span><span data-copy="ap_unit"></span></s><span class="arrow" aria-hidden="true">→</span><p class="sale fit"><b data-copy="ap_r5_sale"></b><span class="unit" data-copy="ap_unit"></span></p></div>
          </li>
          <li class="row wide">
            <div class="r-main"><p class="r-name-line"><span class="r-name" data-copy="ap_r6_name"></span><img class="badge" src="assets/miri/badge_dual.webp" alt="" data-fb="badge-dual"></p><p class="r-desc" data-copy="ap_r6_desc"></p>
              <p class="qty-lines"><span data-copy="ap_r6_q1"></span> <span data-copy="ap_r6_q2"></span></p></div>
            <div class="prices"><s class="old"><span data-copy="ap_r6_old"></span><span data-copy="ap_unit"></span></s><span class="arrow" aria-hidden="true">→</span><p class="sale fit"><b data-copy="ap_r6_sale"></b><span class="unit" data-copy="ap_unit"></span></p></div>
          </li>
          <li class="row wide sig">
            <div class="r-main"><p class="r-name-line"><span class="r-name" data-copy="ap_r7_name"></span><img class="badge" src="assets/miri/badge_signature.webp" alt="" data-fb="badge-sig"></p><p class="r-desc" data-copy="ap_r7_desc"></p>
              <p class="qty-lines stack"><span data-copy="ap_r7_q1"></span><span data-copy="ap_r7_q2"></span><span data-copy="ap_r7_q3"></span></p></div>
            <div class="prices"><s class="old"><span data-copy="ap_r7_old"></span><span data-copy="ap_unit"></span></s><span class="arrow" aria-hidden="true">→</span><p class="sale fit"><b data-copy="ap_r7_sale"></b><span class="unit" data-copy="ap_unit"></span></p></div>
          </li>
        </ol>
      </div>
      <div class="p2-foot">
        <img class="aptos-logo" src="assets/aptos-logo.png" alt="APTOS" width="231" height="56">
        <p class="vat" data-copy="ap_vat"></p>
      </div>
      <p class="contact"><img class="ico ico-phone" src="assets/miri/icon_phone.webp" alt="" data-fb="hide"><span data-copy="ap_contact_label"></span> <a data-link="phone"><span data-copy="ap_phone"></span></a></p>
    </section>


    <!-- 3장 · 시술 설명 A: 어떤 실인가요? / 19·S·nano 차이 -->
    <section class="panel p3" aria-labelledby="ap-c3-title">
      <div class="snow" aria-hidden="true"></div>
      <img class="deco snowdust" src="assets/miri/snow_dust.webp" alt="" data-fb="hide">
      <div class="c-head">
        <img class="type-img lbl" src="assets/miri/type_about_namica.webp" alt="About NAMICA">
        <h2 class="c-title" id="ap-c3-title" data-copy="ap_c3_title"></h2>
        <p class="c-lead" data-copy="ap_c3_lead"></p>
      </div>
      <ul class="c3-points">
        <li><img class="pt-ico" src="assets/miri/icon_thread.webp" alt="" data-fb="num1"><p class="pt-t" data-copy="ap_c3_p1_t"></p><p class="pt-d" data-copy="ap_c3_p1_d"></p></li>
        <li><img class="pt-ico" src="assets/miri/icon_capsule.webp" alt="" data-fb="num2"><p class="pt-t" data-copy="ap_c3_p2_t"></p><p class="pt-d" data-copy="ap_c3_p2_d"></p><p class="pt-n" data-copy="ap_c3_p2_n"></p></li>
        <li><img class="pt-ico" src="assets/miri/icon_barb.webp" alt="" data-fb="num3"><p class="pt-t" data-copy="ap_c3_p3_t"></p><p class="pt-d" data-copy="ap_c3_p3_d"></p></li>
      </ul>
      <div class="c3-lineup">
        <h3 class="c-sub" data-copy="ap_c3_lu_title"></h3>
        <p class="c-sublead" data-copy="ap_c3_lu_lead"></p>
        <ol class="lines">
          <li class="ln">
            <div class="ln-box"><img src="assets/prod-namica-visage.webp" data-alt="ap_alt_box1" alt="" width="913" height="270"></div>
            <p class="ln-name" data-copy="ap_c3_l1_name"></p>
            <p class="ln-len"><span class="ln-lbl" data-copy="ap_c3_len_label"></span><b data-copy="ap_c3_l1_len"></b></p>
            <p class="ln-focus"><span class="ln-lbl" data-copy="ap_c3_focus_label"></span><span data-copy="ap_c3_l1_focus"></span></p>
          </li>
          <li class="ln">
            <div class="ln-box"><img src="assets/prod-namica-visage-s.webp" data-alt="ap_alt_box2" alt="" width="924" height="273"></div>
            <p class="ln-name" data-copy="ap_c3_l2_name"></p>
            <p class="ln-len"><span class="ln-lbl" data-copy="ap_c3_len_label"></span><b data-copy="ap_c3_l2_len"></b></p>
            <p class="ln-focus"><span class="ln-lbl" data-copy="ap_c3_focus_label"></span><span data-copy="ap_c3_l2_focus"></span></p>
          </li>
          <li class="ln">
            <div class="ln-box"><img src="assets/prod-namica-nano.webp" data-alt="ap_alt_box3" alt="" width="915" height="268"></div>
            <p class="ln-name" data-copy="ap_c3_l3_name"></p>
            <p class="ln-len"><span class="ln-lbl" data-copy="ap_c3_len_label"></span><b data-copy="ap_c3_l3_len"></b></p>
            <p class="ln-focus"><span class="ln-lbl" data-copy="ap_c3_focus_label"></span><span data-copy="ap_c3_l3_focus"></span></p>
          </li>
        </ol>
        <p class="c-note" data-copy="ap_c3_note"></p>
      </div>
    </section>

    <!-- 4장 · 시술 설명 B: 어떻게 진행되나요? / 시술 정보 -->
    <section class="panel p4" aria-labelledby="ap-c4-title">
      <div class="snow" aria-hidden="true"></div>
      <img class="deco snowdust" src="assets/miri/snow_dust.webp" alt="" data-fb="hide">
      <div class="c-head">
        <img class="type-img lbl" src="assets/miri/type_how_it_goes.webp" alt="How it goes">
        <h2 class="c-title" id="ap-c4-title" data-copy="ap_c4_title"></h2>
        <p class="c-lead" data-copy="ap_c4_lead"></p>
      </div>
      <div class="c4-mid">
        <figure class="c4-photo"><img src="assets/card4.jpg" data-alt="ap_alt_card4" alt="" width="880" height="1100"></figure>
        <ol class="steps">
          <li><span class="st-no" aria-hidden="true">01</span><div><p class="st-t" data-copy="ap_c4_s1_t"></p><p class="st-d" data-copy="ap_c4_s1_d"></p></div></li>
          <li><span class="st-no" aria-hidden="true">02</span><div><p class="st-t" data-copy="ap_c4_s2_t"></p><p class="st-d" data-copy="ap_c4_s2_d"></p></div></li>
          <li><span class="st-no" aria-hidden="true">03</span><div><p class="st-t" data-copy="ap_c4_s3_t"></p><p class="st-d" data-copy="ap_c4_s3_d"></p></div></li>
          <li><span class="st-no" aria-hidden="true">04</span><div><p class="st-t" data-copy="ap_c4_s4_t"></p><p class="st-d" data-copy="ap_c4_s4_d"></p></div></li>
        </ol>
      </div>
      <div class="c4-info">
        <h3 class="info-title" data-copy="ap_c4_info_title"></h3>
        <ul class="info-grid">
          <li><span class="in-ico fb fb-dotc" aria-hidden="true"></span><div><p class="in-t" data-copy="ap_c4_i1_t"></p><p class="in-d" data-copy="ap_c4_i1_d"></p></div></li>
          <li><span class="in-ico fb fb-dotc" aria-hidden="true"></span><div><p class="in-t" data-copy="ap_c4_i2_t"></p><p class="in-d" data-copy="ap_c4_i2_d"></p></div></li>
          <li><span class="in-ico fb fb-dotc" aria-hidden="true"></span><div><p class="in-t" data-copy="ap_c4_i3_t"></p><p class="in-d" data-copy="ap_c4_i3_d"></p></div></li>
          <li><span class="in-ico fb fb-dotc" aria-hidden="true"></span><div><p class="in-t" data-copy="ap_c4_i4_t"></p><p class="in-d" data-copy="ap_c4_i4_d"></p></div></li>
          <li><span class="in-ico fb fb-dotc" aria-hidden="true"></span><div><p class="in-t" data-copy="ap_c4_i5_t"></p><p class="in-d" data-copy="ap_c4_i5_d"></p></div></li>
          <li><span class="in-ico fb fb-dotc" aria-hidden="true"></span><div><p class="in-t" data-copy="ap_c4_i6_t"></p><p class="in-d" data-copy="ap_c4_i6_d"></p></div></li>
        </ul>
      </div>
    </section>


    <!-- 5장 · 병원 소개 + 오시는 길 + 예약 (v4/_shared/HOSPITAL_INTRO.md 추천 구성, 사용 가능 사실·사진만) -->
    <section class="panel p5" aria-labelledby="ap-c5-title">
      <div class="snow" aria-hidden="true"></div>
      <img class="deco snowdust" src="assets/miri/snow_dust.webp" alt="" data-fb="hide">
      <div class="c-head">
        <img class="type-img lbl lbl-wide" src="assets/miri/type_about_bb.webp" alt="ABOUT BEAUTY BLOSSOM">
        <h2 class="c-title c5-title" id="ap-c5-title" data-copy="ap_c5_title"></h2>
        <p class="c5-slogan" data-copy="ap_c5_slogan"></p>
      </div>
      <ul class="c5-photos">
        <li><figure><img class="c5-ph" src="assets/clinic-reception.jpg" data-alt="ap_alt_clinic1" alt="" width="600" height="280"><img class="deco c5-frame" src="assets/miri/frame_photo_gold.webp" alt="" data-fb="hide"><figcaption data-copy="ap_c5_cap1"></figcaption></figure></li>
        <li><figure><img class="c5-ph" src="assets/clinic-care-room.jpg" data-alt="ap_alt_clinic2" alt="" width="600" height="280"><img class="deco c5-frame" src="assets/miri/frame_photo_gold.webp" alt="" data-fb="hide"><figcaption data-copy="ap_c5_cap2"></figcaption></figure></li>
        <li><figure><img class="c5-ph" src="assets/clinic-treatment-room.jpg" data-alt="ap_alt_clinic3" alt="" width="600" height="280"><img class="deco c5-frame" src="assets/miri/frame_photo_gold.webp" alt="" data-fb="hide"><figcaption data-copy="ap_c5_cap3"></figcaption></figure></li>
      </ul>
      <ul class="c5-strengths">
        <li><img class="c5-ico" src="assets/miri/icon_genuine.webp" alt="" data-fb="dotc"><p class="c5-t" data-copy="ap_c5_s1_t"></p><p class="c5-d" data-copy="ap_c5_s1_d"></p></li>
        <li><img class="c5-ico" src="assets/miri/icon_chat.webp" alt="" data-fb="dotc"><p class="c5-t" data-copy="ap_c5_s2_t"></p><p class="c5-d" data-copy="ap_c5_s2_d"></p></li>
        <li><img class="c5-ico" src="assets/miri/icon_calendar.webp" alt="" data-fb="dotc"><p class="c5-t" data-copy="ap_c5_s3_t"></p><p class="c5-d" data-copy="ap_c5_s3_d"></p></li>
        <li><img class="c5-ico" src="assets/miri/icon_globe.webp" alt="" data-fb="dotc"><p class="c5-t" data-copy="ap_c5_s4_t"></p><p class="c5-d" data-copy="ap_c5_s4_d"></p></li>
      </ul>
      <div class="c5-loc">
        <div class="loc-head"><img class="type-img loc-type" src="assets/miri/type_location.webp" alt="LOCATION"><p class="loc-sub" data-copy="ap_c5_loc_sub"></p></div>
        <ol class="way">
          <li><img class="way-ico" src="assets/miri/icon_subway.webp" alt="" data-fb="hide"><span data-copy="ap_c5_way1"></span></li>
          <li><span data-copy="ap_c5_way2"></span></li>
          <li><img class="way-ico" src="assets/miri/icon_pin.webp" alt="" data-fb="hide"><span data-copy="ap_c5_way3"></span></li>
        </ol>
        <dl class="vr">
          <div><dt data-copy="ap_c5_addr_lbl"></dt><dd class="vr-v" data-copy="ap_c5_addr"></dd></div>
          <div><dt data-copy="ap_c5_hours_lbl"></dt><dd class="vr-v vr-hours"><span data-copy="ap_c5_hours1"></span><span data-copy="ap_c5_hours2"></span><span data-copy="ap_c5_hours3"></span></dd></div>
        </dl>
      </div>
      <div class="booking c5-booking">
        <img class="qr" src="assets/naver-booking-qr.png" alt="네이버 예약 QR" width="424" height="424">
        <div class="bk-main">
          <span class="pill" data-copy="ap_bk_pill"></span>
          <p class="bk-text"><img class="ico" src="assets/miri/icon_calendar.webp" alt="" data-fb="hide"><a data-link="booking"><span data-copy="ap_bk_naver"></span></a> / <img class="ico" src="assets/miri/icon_chat.webp" alt="" data-fb="hide"><a data-link="kakao"><span data-copy="ap_bk_kakao"></span></a></p>
          <p class="bk-phone"><img class="ico ico-phone-dark" src="assets/miri/icon_phone.webp" alt="" data-fb="hide"><span data-copy="ap_contact_label"></span> <a data-link="phone"><span data-copy="ap_phone"></span></a></p>
        </div>
        <img class="bk-wordmark" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
      </div>
    </section>

    <section class="notes" aria-labelledby="ap-notes">
      <h2 id="ap-notes"><img class="ico" src="assets/miri/icon_info.webp" alt="" data-fb="hide"><span data-copy="ap_note_title"></span></h2>
      <ul>
        <li><img class="li-ico" src="assets/miri/icon_receipt.webp" alt="" data-fb="dot"><span data-copy="ap_cond1"></span></li>
        <li><span class="fb fb-dot" aria-hidden="true"></span><span data-copy="ap_cond2"></span></li>
        <li><img class="li-ico" src="assets/miri/icon_camera.webp" alt="" data-fb="dot"><span data-copy="ap_cond3"></span></li>
        <li data-optional-group><span class="fb fb-dot" aria-hidden="true"></span><span data-copy="ap_cond4" data-optional data-placeholder="추가 안내 (예: 기간·대상 조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
