          <li><span class="b5-ico" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><path d="M7.5 12.8c0-2.6 2.1-4.8 4.8-4.8h16.6c2.6 0 4.8 2.1 4.8 4.8v9.6c0 2.6-2.1 4.8-4.8 4.8H18.6l-6.6 5.6v-5.7c-2.6-.2-4.5-2.3-4.5-4.7Z"/><path d="M38.2 17.6h1c2.2 0 4 1.8 4 4v8.6c0 2.2-1.8 4-4 4h-.6v5.1l-5.7-5.1h-6.6c-2.2 0-4-1.8-4-4v-.8"/><path d="M14.6 17.6h.01M20.6 17.6h.01M26.6 17.6h.01"/></svg></span><p class="c5-t" data-copy="ap_c5_s2_t"></p><p class="c5-d" data-copy="ap_c5_s2_d"></p></li>
          <li><span class="b5-ico" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><circle cx="22" cy="26" r="15"/><path d="M22 17.5V26l6 3.8"/><path d="M38.6 5.8a6.2 6.2 0 1 0 4.6 10.1 5.1 5.1 0 0 1-4.6-10.1Z"/></svg></span><p class="c5-t" data-copy="ap_c5_s3_t"></p><p class="c5-d" data-copy="ap_c5_s3_d"></p></li>
          <li><span class="b5-ico" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><circle cx="24" cy="24" r="17"/><path d="M7 24h34M10.2 15.5h27.6M10.2 32.5h27.6"/><path d="M24 7c5.2 4.7 7.6 10.6 7.6 17S29.2 36.3 24 41c-5.2-4.7-7.6-10.6-7.6-17S18.8 11.7 24 7Z"/></svg></span><p class="c5-t" data-copy="ap_c5_s4_t"></p><p class="c5-d" data-copy="ap_c5_s4_d"></p></li>
        </ul>
      </div>
      <div class="b5-grid">
        <div class="b5-box b5-loc">
          <h3 class="b5-h" data-copy="ap_c5_loc_title"></h3>
          <!-- 2026-10-30 user: Google Maps capture with its original colours, nothing on top (Google marker, name, logo and attribution are in the image).
               aptos12.js sets the files for ?lang= from PAGE_COPY.maps; the media queries pick the width tier. -->
          <div class="b5-map">
            <picture>
              <source data-map-tier="desk" media="(min-width: 1024px)" width="880" height="514">
              <source data-map-tier="tab" media="(min-width: 768px)" width="732" height="428">
              <img class="b5-map-img" data-map-tier="mob" data-alt="ap_alt_map" alt="" width="1002" height="588">
            </picture>
          </div>
          <p class="b5-station"><svg class="b5-st-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.2c-4.3 0-7.8 3.4-7.8 7.7 0 5.6 7.8 12 7.8 12s7.8-6.4 7.8-12c0-4.3-3.5-7.7-7.8-7.7Z"/><circle cx="12" cy="9.9" r="2.9"/></svg><span class="b5-st-name" data-copy="ap_c5_station"></span><span class="b5-pill" data-copy="ap_c5_lines"></span></p>
          <p class="b5-addr" data-copy="ap_c5_addr"></p>
          <p class="b5-recep" data-copy="ap_c5_reception"></p>
        </div>
        <div class="b5-box b5-hours">
          <h3 class="b5-h" data-copy="ap_c5_hours_lbl"></h3>
          <div class="b5-hrs">
            <p class="b5-hr" data-copy="ap_c5_hours1"></p>
            <p class="b5-hr" data-copy="ap_c5_hours2"></p>
            <p class="b5-note" data-copy="ap_c5_hours3"></p>
          </div>
        </div>
        <div class="b5-box b5-book">
          <h3 class="b5-h" data-copy="ap_bk_pill"></h3>
          <div class="b5-bk">
            <img class="qr" src="assets/naver-booking-qr.png" data-qr data-alt="ap_alt_qr" alt="" width="424" height="424">
            <div class="bk-main">
              <p class="bk-text"><img class="ico" src="assets/miri/icon_calendar.webp" alt="" data-fb="hide"><a data-link="booking"><span data-copy="ap_bk_naver"></span></a><span class="bk-alt" data-bk-alt> / <img class="ico" src="assets/miri/icon_chat.webp" alt="" data-fb="hide"><a data-link="kakao"><span data-copy="ap_bk_kakao"></span></a></span></p>
              <p class="bk-phone"><img class="ico" src="assets/miri/icon_phone.webp" alt="" data-fb="hide"><span data-copy="ap_contact_label"></span> <a data-link="phone"><span data-copy="ap_phone"></span></a></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="notes" aria-labelledby="ap-notes">
      <h2 id="ap-notes"><img class="ico" src="assets/miri/icon_info.webp" alt="" data-fb="hide"><span data-copy="ap_note_title"></span></h2>
      <ul>
        <li><img class="li-ico" src="assets/miri/icon_receipt.webp" alt="" data-fb="dot"><span data-copy="ap_cond1"></span></li>
        <li><span class="fb fb-dot" aria-hidden="true"></span><span data-copy="ap_cond2"></span></li>
        <li><img class="li-ico" src="assets/miri/icon_camera.webp" alt="" data-fb="dot"><span data-copy="ap_cond3"></span></li>
        <li data-optional-group><span class="fb fb-dot" aria-hidden="true"></span><span data-copy="ap_cond4" data-optional data-placeholder="추가 안내 (예: 기간·대상 조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
