<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>울쎄라피 프라임 · BEAUTY BLOSSOM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400..800;1,400..600&amp;display=swap">
  <link rel="stylesheet" href="ulthera12.css?v=20261102-ulthera12c">
  <script src="copy-data.js?v=20261102-ulthera12c" defer></script>
  <script src="../inline-edit.js?v=20261102-ulthera12c" defer></script>
  <script src="ulthera12.js?v=20261102-ulthera12c" defer></script>
</head>
<body>
<!-- ULT12 울쎄라 · 겨울 시즌 (Korean first). Team palette (sheet I22 pin): Maize #F8E964, Gamboge #EEA233, Bistre #331A04.
     Six 1080x1350 cards (section[data-card="1..6"]); every word is editable copy (data-copy, ../inline-edit.js, aptos-* board messages).
     2026-11-03 user rule: pictures are generated images, never HTML/CSS/SVG drawings. Icons, seals, sparkles, the striped fabric and the skin
     cross-section are generated files (v4/ulthera12/gen, a/, cut by gen/cut-assets.cjs); devices, clinic photos, map and QR are real files;
     the B/A photos are the shared set v4/_shared/ba/winter-ba-9/ulthera (used as they are). Only text and screen structure stay HTML/CSS.
     Price rows: data-price-row="11_lifting:<sheet row>" with [data-price-list] / [data-price-sale]; strings from v4/events/_data/pages.json. -->
<main class="ut">
  <div class="sheet">

    <!-- 1 / 6 : hero (generated model photo, v4/ulthera12/gen/hero-v2.json) -->
    <section class="card c1" data-card="1" aria-labelledby="ut-t1">
      <img class="c1-photo" src="assets/hero.jpg?v=b" data-alt="ut_alt_hero" alt="" width="1080" height="1350">
      <img class="spark k1" src="assets/dec/spark-cream.webp" alt="" aria-hidden="true"><img class="spark k2" src="assets/dec/spark-cream.webp" alt="" aria-hidden="true"><img class="spark k3" src="assets/dec/spark-maize.webp" alt="" aria-hidden="true">
      <header class="c1-top"><span class="brand" data-copy="ut_brand"></span></header>
      <div class="c1-copy">
        <p class="kicker-serif" data-copy="ut_kicker"></p>
        <h1 class="title hero-title" id="ut-t1" data-copy="ut_title"></h1>
        <p class="hook" data-copy="ut_hook"></p>
        <p class="period"><span data-copy="ut_period"></span></p>
      </div>
      <div class="c1-teaser">
        <img class="tz-bow" src="assets/dec/bow.webp" alt="" aria-hidden="true">
        <p class="tz-top"><span class="tz-label" data-copy="ut_hero_label"></span><span class="tz-tag" data-copy="ut_hero_tag"></span></p>
        <p class="tz-main"><span class="tz-price money" data-copy="ut_hero_price"></span><span class="tz-vat" data-copy="ut_vat"></span></p>
      </div>
      <div class="seal dark s-hero"><img class="seal-art" src="assets/dec/seal-dark.webp" alt="" aria-hidden="true"><p class="seal-tx"><span class="sl s1" data-copy="ut_seal1"></span><span class="sl s2" data-copy="ut_seal2"></span><span class="sl s3" data-copy="ut_seal3"></span></p></div>
      <p class="c1-contact"><img class="ph-ico" src="assets/icons/ic-phone.webp" alt="" aria-hidden="true"><span class="contact" data-copy="ut_contact"></span></p>
    </section>

    <!-- 2 / 6 : prices, all eight rows of 11_lifting B5:K16 in sheet order (title -> card title, group rows -> sub heads) -->
    <section class="card c2" data-card="2" aria-labelledby="ut-t2">
      <img class="tex" src="assets/tex/tex-bistre.jpg" alt="" aria-hidden="true">
      <span class="p-mark" aria-hidden="true" data-copy="ut_p_mark"></span>
      <img class="spark k4" src="assets/dec/spark-cream.webp" alt="" aria-hidden="true"><img class="spark k5" src="assets/dec/snow-cream.webp" alt="" aria-hidden="true">
      <div class="c2-in">
        <header class="top"><span class="brand" data-copy="ut_brand"></span><span class="period"><span data-copy="ut_period"></span></span></header>
        <div class="c2-head">
          <h2 class="p-title" id="ut-t2" data-copy="ut_p_title"></h2>
          <p class="p-lead" data-copy="ut_p_lead"></p>
        </div>
        <div class="seal s-price"><img class="seal-art" src="assets/dec/seal-light.webp" alt="" aria-hidden="true"><p class="seal-tx"><span class="sl s1" data-copy="ut_seal1"></span><span class="sl s2" data-copy="ut_seal2"></span><span class="sl s3" data-copy="ut_seal3"></span></p></div>
        <div class="pboard">
          <section class="pcard pc-solo" aria-label="울쎄라피 프라임">
            <ul class="prows">
              <li class="prow" data-price-row="11_lifting:6"><span class="pname" data-copy="ut_r6_name"></span><span class="plist money" data-price-list data-copy="ut_r6_list"></span><span class="psale money" data-price-sale data-copy="ut_r6_sale"></span></li>
              <li class="prow has-gift" data-price-row="11_lifting:7"><img class="gift-mark" src="assets/icons/ic-gift.webp" alt="" aria-hidden="true"><span class="pname" data-copy="ut_r7_name"></span><span class="plist money" data-price-list data-copy="ut_r7_list"></span><span class="psale money" data-price-sale data-copy="ut_r7_sale"></span></li>
              <li class="prow has-gift" data-price-row="11_lifting:8"><img class="gift-mark" src="assets/icons/ic-gift.webp" alt="" aria-hidden="true"><span class="pname" data-copy="ut_r8_name"></span><span class="plist money" data-price-list data-copy="ut_r8_list"></span><span class="psale money" data-price-sale data-copy="ut_r8_sale"></span></li>
            </ul>
            <p class="gift-band"><img class="gift-ico" src="assets/icons/ic-gift.webp" alt="" aria-hidden="true"><span data-copy="ut_gift"></span></p>
          </section>
          <section class="pcard pc-eye">
            <div class="phead"><div class="pg-tx"><h3 class="pg-name" data-copy="ut_g9_name"></h3></div></div>
            <ul class="prows">
              <li class="prow" data-price-row="11_lifting:10"><span class="pname" data-copy="ut_r10_name"></span><span class="plist money" data-price-list data-copy="ut_r10_list"></span><span class="psale money" data-price-sale data-copy="ut_r10_sale"></span></li>
            </ul>
          </section>
          <section class="pcard pc-combo">
            <div class="phead">
              <div class="pg-tx"><h3 class="pg-name" data-copy="ut_g11_name"></h3><p class="pg-sub" data-copy="ut_g11_sub"></p></div>
              <div class="pg-dev"><figure class="dev"><img src="assets/ultherapy-prime.webp" data-alt="ut_alt_dev_ulthera" alt="" width="1000" height="1000"></figure><img class="plus" src="assets/icons/ic-plus.webp" alt="" aria-hidden="true"><figure class="dev"><img src="assets/onda.webp" data-alt="ut_alt_dev_onda" alt="" width="1000" height="1000"></figure></div>
            </div>
            <ul class="prows">
              <li class="prow combo" data-price-row="11_lifting:12"><span class="pname" data-copy="ut_r12_name"></span><span class="plist money" data-price-list data-copy="ut_r12_list"></span><span class="psale money" data-price-sale data-copy="ut_r12_sale"></span></li>
              <li class="prow combo has-gift" data-price-row="11_lifting:13"><img class="gift-mark" src="assets/icons/ic-gift.webp" alt="" aria-hidden="true"><span class="pname" data-copy="ut_r13_name"></span><span class="plist money" data-price-list data-copy="ut_r13_list"></span><span class="psale money" data-price-sale data-copy="ut_r13_sale"></span></li>
            </ul>
          </section>
          <section class="pcard pc-combo">
            <div class="phead">
              <div class="pg-tx"><h3 class="pg-name" data-copy="ut_g14_name"></h3><p class="pg-sub" data-copy="ut_g14_sub"></p></div>
              <div class="pg-dev"><figure class="dev"><img src="assets/ultherapy-prime.webp" data-alt="ut_alt_dev_ulthera" alt="" width="1000" height="1000"></figure><img class="plus" src="assets/icons/ic-plus.webp" alt="" aria-hidden="true"><figure class="dev"><img src="assets/thermage-flx.webp" data-alt="ut_alt_dev_thermage" alt="" width="1000" height="1000"></figure></div>
            </div>
            <ul class="prows">
              <li class="prow combo" data-price-row="11_lifting:15"><span class="pname" data-copy="ut_r15_name"></span><span class="plist money" data-price-list data-copy="ut_r15_list"></span><span class="psale money" data-price-sale data-copy="ut_r15_sale"></span></li>
              <li class="prow combo has-gift" data-price-row="11_lifting:16"><img class="gift-mark" src="assets/icons/ic-gift.webp" alt="" aria-hidden="true"><span class="pname" data-copy="ut_r16_name"></span><span class="plist money" data-price-list data-copy="ut_r16_list"></span><span class="psale money" data-price-sale data-copy="ut_r16_sale"></span></li>
            </ul>
          </section>
        </div>
        <p class="vat"><span data-copy="ut_vat"></span></p>
      </div>
    </section>

    <!-- 3 / 6 : Before & After (v4/_shared/ba/BA_SECTION.md; photos v4/_shared/ba/winter-ba-9/ulthera used as they are; colours via --ba-*) -->
    <section class="card cba bb-ba" data-card="3" aria-labelledby="ut-tba">
      <img class="tex" src="assets/tex/tex-bistre.jpg" alt="" aria-hidden="true">
      <img class="spark k8" src="assets/dec/spark-trio.webp" alt="" aria-hidden="true"><img class="spark k9" src="assets/dec/snow-cream.webp" alt="" aria-hidden="true">
      <div class="ba-in">
        <header class="top"><span class="brand" data-copy="ut_brand"></span></header>
        <div class="ba-head">
          <p class="ba-eyebrow" data-copy="ut_ba_eyebrow"></p>
          <h2 class="ba-title" id="ut-tba" data-copy="ut_ba_title"></h2>
        </div>
        <div class="ba-rows">
          <div class="ba-pair">
            <figure class="ba-shot"><img src="assets/ba/ulthera-front-before.jpg" data-alt="ut_alt_ba_before" alt="" width="1024" height="1024"><figcaption class="ba-tag" data-copy="ut_ba_before"></figcaption></figure>
            <img class="ba-arrow" src="assets/icons/ic-next.webp" alt="" aria-hidden="true">
            <figure class="ba-shot"><img src="assets/ba/ulthera-front-after.jpg" data-alt="ut_alt_ba_after" alt="" width="1024" height="1024"><figcaption class="ba-tag ba-tag--after" data-copy="ut_ba_after"></figcaption></figure>
          </div>
          <div class="ba-pair">
            <figure class="ba-shot"><img src="assets/ba/ulthera-45-before.jpg" data-alt="ut_alt_ba_before" alt="" width="1024" height="1024"><figcaption class="ba-tag" data-copy="ut_ba_before"></figcaption></figure>
            <img class="ba-arrow" src="assets/icons/ic-next.webp" alt="" aria-hidden="true">
            <figure class="ba-shot"><img src="assets/ba/ulthera-45-after.jpg" data-alt="ut_alt_ba_after" alt="" width="1024" height="1024"><figcaption class="ba-tag ba-tag--after" data-copy="ut_ba_after"></figcaption></figure>
          </div>
        </div>
        <p class="ba-note" data-copy="ut_ba_note"></p>
      </div>
    </section>

    <!-- 4 / 6 : what the device is (facts: v4/ulthera12/REFERENCE_AND_PLAN.md). The skin cross-section is a generated picture without text;
         the layer names and depths are HTML text placed on the measured bands and focal points (gen/cut-assets.json). -->
    <section class="card c3" data-card="4" aria-labelledby="ut-t3">
      <img class="tex" src="assets/tex/tex-maize.jpg" alt="" aria-hidden="true">
      <img class="spark k10" src="assets/dec/spark-gamboge.webp" alt="" aria-hidden="true">
      <div class="c3-in">
        <header class="top solo"><span class="brand" data-copy="ut_brand"></span></header>
        <div class="q-head">
          <p class="kicker" data-copy="ut_c3_kicker"></p>
          <h2 class="q-title" id="ut-t3" data-copy="ut_c3_q"></h2>
          <p class="q-ans" data-copy="ut_c3_a"></p>
        </div>
        <div class="c3-mid">
          <figure class="depth">
            <img class="depth-art" src="assets/c3/layers.webp" alt="" aria-hidden="true" width="1000" height="1000">
            <span class="dl l-epi" data-copy="ut_c3_d_epi"></span>
            <span class="dl l-dermis" data-copy="ut_c3_d_dermis"></span>
            <span class="dl l-fat" data-copy="ut_c3_d_fat"></span>
            <span class="dl l-smas" data-copy="ut_c3_d_smas"></span>
            <span class="dl l-muscle" data-copy="ut_c3_d_muscle"></span>
            <span class="dm dm1" data-copy="ut_c3_d1"></span>
            <span class="dm dm2" data-copy="ut_c3_d2"></span>
            <span class="dm dm3" data-copy="ut_c3_d3"></span>
          </figure>
          <ol class="points">
            <li class="pt"><h3 class="pt-t" data-copy="ut_c3_p1_t"></h3><p class="pt-d" data-copy="ut_c3_p1_d"></p></li>
            <li class="pt"><h3 class="pt-t" data-copy="ut_c3_p2_t"></h3><p class="pt-d" data-copy="ut_c3_p2_d"></p></li>
            <li class="pt"><h3 class="pt-t" data-copy="ut_c3_p3_t"></h3><p class="pt-d" data-copy="ut_c3_p3_d"></p></li>
          </ol>
        </div>
        <div class="cmp">
          <h3 class="cmp-title" data-copy="ut_c3_cmp_title"></h3>
          <ul class="cmp-row">
            <li class="cmp-it"><figure class="dev-l"><img src="assets/ultherapy-prime.webp" data-alt="ut_alt_dev_ulthera" alt="" width="1000" height="1000"></figure><span class="cmp-n" data-copy="ut_c3_e1_name"></span><span class="cmp-t" data-copy="ut_c3_e1_type"></span></li>
            <li class="cmp-it"><figure class="dev-l"><img src="assets/onda.webp" data-alt="ut_alt_dev_onda" alt="" width="1000" height="1000"></figure><span class="cmp-n" data-copy="ut_c3_e2_name"></span><span class="cmp-t" data-copy="ut_c3_e2_type"></span></li>
            <li class="cmp-it"><figure class="dev-l"><img src="assets/thermage-flx.webp" data-alt="ut_alt_dev_thermage" alt="" width="1000" height="1000"></figure><span class="cmp-n" data-copy="ut_c3_e3_name"></span><span class="cmp-t" data-copy="ut_c3_e3_type"></span></li>
          </ul>
        </div>
        <p class="src" data-copy="ut_c3_src"></p>
      </div>
    </section>

    <!-- 5 / 6 : the treatment day, step by step (genuine check = Merz 'Touch Prime': device NFC + tip QR). The round photo is its own generated cut
         (gen/day-v1.json: head turned, hands out of frame), never a crop of the hero photo (2026-11-03 user rule). -->
    <section class="card c4" data-card="5" aria-labelledby="ut-t4">
      <img class="tex" src="assets/tex/tex-gamboge.jpg" alt="" aria-hidden="true">
      <img class="spark k6" src="assets/dec/spark-cream.webp" alt="" aria-hidden="true"><img class="spark k7" src="assets/dec/spark-maize.webp" alt="" aria-hidden="true">
      <div class="c4-in">
        <header class="top solo"><span class="brand" data-copy="ut_brand"></span></header>
        <div class="c4-headrow">
          <div class="q-head">
            <p class="kicker" data-copy="ut_c4_kicker"></p>
            <h2 class="q-title" id="ut-t4" data-copy="ut_c4_q"></h2>
            <p class="q-ans" data-copy="ut_c4_a"></p>
          </div>
          <figure class="c4-photo"><img src="assets/model-day.jpg?v=a" data-alt="ut_alt_c4" alt="" width="640" height="640"></figure>
        </div>
        <ol class="steps">
          <li class="st"><img class="st-ico" src="assets/icons/ic-consult.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="ut_c4_s1_t"></h3><p class="st-d" data-copy="ut_c4_s1_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/ic-nfc.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="ut_c4_s2_t"></h3><p class="st-d" data-copy="ut_c4_s2_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/ic-cream.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="ut_c4_s3_t"></h3><p class="st-d" data-copy="ut_c4_s3_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/ic-monitor.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="ut_c4_s4_t"></h3><p class="st-d" data-copy="ut_c4_s4_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/ic-care.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="ut_c4_s5_t"></h3><p class="st-d" data-copy="ut_c4_s5_d"></p></div></li>
        </ol>
        <ul class="infos">
          <li class="inf"><span class="inf-top"><img class="inf-ico" src="assets/icons/ic-clock.webp" alt="" aria-hidden="true"><span class="inf-k" data-copy="ut_c4_i1_k"></span></span><span class="inf-v" data-copy="ut_c4_i1_v"></span><span class="inf-n" data-copy="ut_c4_i1_n"></span></li>
          <li class="inf"><span class="inf-top"><img class="inf-ico" src="assets/icons/ic-cream.webp" alt="" aria-hidden="true"><span class="inf-k" data-copy="ut_c4_i2_k"></span></span><span class="inf-v" data-copy="ut_c4_i2_v"></span><span class="inf-n" data-copy="ut_c4_i2_n"></span></li>
          <li class="inf"><span class="inf-top"><img class="inf-ico" src="assets/icons/ic-sun.webp" alt="" aria-hidden="true"><span class="inf-k" data-copy="ut_c4_i3_k"></span></span><span class="inf-v" data-copy="ut_c4_i3_v"></span><span class="inf-n" data-copy="ut_c4_i3_n"></span></li>
        </ul>
        <p class="c4-tip"><img class="tip-ico" src="assets/dec/spark-bistre.webp" alt="" aria-hidden="true"><span data-copy="ut_c4_tip"></span></p>
        <p class="src" data-copy="ut_c4_src"></p>
      </div>
    </section>

    <!-- 6 / 6 : clinic intro, the V4 bento grid (same content and order as oligio12 / aptos12 / FV12) on Bistre with cream panels and a Maize booking panel -->
    <section class="card c5" data-card="6" aria-labelledby="ut-t5">
      <img class="tex" src="assets/tex/tex-bistre.jpg" alt="" aria-hidden="true">
      <div class="cx-in">
        <header class="top solo"><span class="brand" data-copy="ut_brand"></span></header>
        <div class="bento">
          <div class="bt bt-about">
            <div class="ab-top">
              <div class="ab-intro">
                <p class="bt-k" data-copy="ut_ab_kicker"></p>
                <h2 class="ab-title" id="ut-t5" data-copy="ut_ab_title"></h2>
                <p class="ab-lead"><span data-copy="ut_ab_intro1"></span><span data-copy="ut_ab_intro2"></span></p>
              </div>
              <figure class="dr">
                <figcaption class="dr-tx"><span class="dr-name" data-copy="ut_ab_dr_name"></span><span class="dr-quote" data-copy="ut_ab_dr_quote"></span></figcaption>
                <img class="dr-img" src="assets/director-lee.webp?v=a" data-alt="ut_alt_director" alt="" width="640" height="640">
              </figure>
            </div>
            <div class="ab-photos">
              <figure class="ph-w"><img src="assets/hp-reception.jpg?v=a" data-alt="ut_alt_ph1" alt="" width="960" height="450"><figcaption data-copy="ut_ab_ph1"></figcaption></figure>
              <figure class="ph-n"><img src="assets/hp-care.png?v=a" data-alt="ut_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="ut_ab_ph2"></figcaption></figure>
              <figure class="ph-w"><img src="assets/hp-treatment.jpg?v=a" data-alt="ut_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="ut_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><img class="si" src="assets/icons/ic-genuine.webp" alt="" aria-hidden="true"><span class="at" data-copy="ut_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ut_ab_s1_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-consult.webp" alt="" aria-hidden="true"><span class="at" data-copy="ut_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ut_ab_s2_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-evening.webp" alt="" aria-hidden="true"><span class="at" data-copy="ut_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ut_ab_s3_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-globe.webp" alt="" aria-hidden="true"><span class="at" data-copy="ut_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ut_ab_s4_d"></span></li>
            </ul>
          </div>
          <!-- B: directions. The Google Maps capture is shown untouched (Google marker, logo and attribution inside the image); one file per width tier. -->
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="ut_ab_loc"></p><h3 class="bt-t" data-copy="ut_ab_loc_title"></h3></div>
            <div class="loc-body">
              <figure class="map">
                <picture>
                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="ut_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <img class="way-pin" src="assets/icons/ic-pin.webp" alt="" aria-hidden="true">
                <div class="way-tx">
                  <p class="way-top"><span class="way-st" data-copy="ut_ab_way_station"></span><span class="way-line" data-copy="ut_ab_way_line"></span></p>
                  <p class="way-addr"><span data-copy="ut_ab_way_addr"></span><span class="way-desk"><span data-copy="ut_ab_way_desk"></span></span></p>
                </div>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="ut_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="ut_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="ut_ab_h1"></li><li data-copy="ut_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="ut_ab_h3"></p>
          </div>
          <div class="bt bt-book">
            <p class="bt-k" data-copy="ut_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="ut_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="ut_alt_qr" alt="" width="424" height="424"><figcaption data-copy="ut_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="ut_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="ut_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><img class="ph-ico" src="assets/icons/ic-phone.webp" alt="" aria-hidden="true"><a data-link="phone"><span data-copy="ut_ab_phone"></span></a></p>
              </div>
            </div>
            <span class="bk-mark" data-copy="ut_brand"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- notes under the cards (not a card) -->
    <section class="notes" aria-labelledby="ut-notes">
      <h2 id="ut-notes"><img class="nt-ico" src="assets/dec/spark-maize.webp" alt="" aria-hidden="true"><span data-copy="ut_note_title"></span></h2>
      <ul>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="ut_cond1"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="ut_cond2"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="ut_cond3"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="ut_cond_ba"></span></li>
        <li data-optional-group><span class="dot" aria-hidden="true"></span><span data-copy="ut_cond4" data-optional data-placeholder="추가 안내 (예: 대상·조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
