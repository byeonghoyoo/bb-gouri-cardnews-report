          <li class="st"><span class="st-ico" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3l7 3v5.5c0 4.3-2.9 7.7-7 9.5-4.1-1.8-7-5.2-7-9.5V6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.6 12.2l2.4 2.4 4.6-4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="st-tx"><h3 class="st-t" data-copy="ut_c4_s2_t"></h3><p class="st-d" data-copy="ut_c4_s2_d"></p></div></li>
          <li class="st"><span class="st-ico" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M9 3.5h6v3H9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 6.5h8l1 13.5a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 12.5h5M9.5 15.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><div class="st-tx"><h3 class="st-t" data-copy="ut_c4_s3_t"></h3><p class="st-d" data-copy="ut_c4_s3_d"></p></div></li>

    <section class="card c5" data-card="5" aria-labelledby="ut-t5">
      <div class="tex" aria-hidden="true"></div>
      <div class="cx-in">
        <header class="top solo"><span class="brand" data-copy="ut_brand"></span></header>
        <div class="bento">
          <div class="bt bt-about">
            <div class="ab-top">
              <div class="ab-intro">
                <p class="bt-k" data-copy="ut_ab_kicker"></p>
                <h2 class="ab-title" id="ut-t5" data-copy="ut_ab_title"></h2>
                <p class="ab-lead"><span data-copy="ut_ab_intro1"></span><span data-copy="ut_ab_intro2"></span></p>
              </div>
              <figure class="dr">
                <figcaption class="dr-tx"><span class="dr-name" data-copy="ut_ab_dr_name"></span><span class="dr-quote" data-copy="ut_ab_dr_quote"></span></figcaption>
                <span class="dr-glow" aria-hidden="true"></span>
                <img class="dr-img" src="assets/director-lee.webp?v=a" data-alt="ut_alt_director" alt="" width="640" height="640">
              </figure>
            </div>
            <div class="ab-photos">
              <figure class="ph-w"><img src="assets/hp-reception.jpg?v=a" data-alt="ut_alt_ph1" alt="" width="960" height="450"><figcaption data-copy="ut_ab_ph1"></figcaption></figure>
              <figure class="ph-n"><img src="assets/hp-care.png?v=a" data-alt="ut_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="ut_ab_ph2"></figcaption></figure>
              <figure class="ph-w"><img src="assets/hp-treatment.jpg?v=a" data-alt="ut_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="ut_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><span class="si" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3l7 3v5.5c0 4.3-2.9 7.7-7 9.5-4.1-1.8-7-5.2-7-9.5V6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.6 12.2l2.4 2.4 4.6-4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="at" data-copy="ut_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ut_ab_s1_d"></span></li>
              <li><span class="sh"><span class="si" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 5.5h16v10H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span class="at" data-copy="ut_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ut_ab_s2_d"></span></li>
              <li><span class="sh"><span class="si" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="at" data-copy="ut_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ut_ab_s3_d"></span></li>
              <li><span class="sh"><span class="si" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5S9.4 5.9 12 3.5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="at" data-copy="ut_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="ut_ab_s4_d"></span></li>
            </ul>
          </div>
          <!-- B: directions. The Google Maps capture is shown untouched (Google marker, logo and attribution inside the image); one file per width tier. -->
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="ut_ab_loc"></p><h3 class="bt-t" data-copy="ut_ab_loc_title"></h3></div>
            <div class="loc-body">
              <figure class="map">
                <picture>
                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="ut_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <svg class="way-pin" viewBox="0 0 40 50" aria-hidden="true" focusable="false"><path d="M20 2C10.1 2 2 9.9 2 19.6 2 32.8 20 48 20 48S38 32.8 38 19.6C38 9.9 29.9 2 20 2z" stroke-width="2.4"/><circle cx="20" cy="19.5" r="6.5"/></svg>
                <div class="way-tx">
                  <p class="way-top"><span class="way-st" data-copy="ut_ab_way_station"></span><span class="way-line" data-copy="ut_ab_way_line"></span></p>
                  <p class="way-addr"><span data-copy="ut_ab_way_addr"></span><span class="way-desk"><span data-copy="ut_ab_way_desk"></span></span></p>
                </div>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="ut_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="ut_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="ut_ab_h1"></li><li data-copy="ut_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="ut_ab_h3"></p>
          </div>
          <div class="bt bt-book">
            <p class="bt-k" data-copy="ut_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="ut_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="ut_alt_qr" alt="" width="424" height="424"><figcaption data-copy="ut_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="ut_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="ut_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><svg class="ph-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 3.5l3 3.1-1.8 2.6a13.5 13.5 0 0 0 7 7l2.6-1.8 3.1 3-1.7 3.1c-.4.7-1.2 1-2 .9C10 20.7 3.3 14 2.6 7.2c-.1-.8.2-1.6.9-2z" fill="currentColor"/></svg><a data-link="phone"><span data-copy="ut_ab_phone"></span></a></p>
              </div>
            </div>
            <span class="bk-mark" data-copy="ut_brand"></span>
          </div>
        </div>
      </div>

    <!-- notes under the cards (not a card) -->
    <section class="notes" aria-labelledby="ut-notes">
