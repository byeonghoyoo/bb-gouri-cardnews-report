          <li class="st"><img class="st-ico" src="assets/icons/point.webp?v=1104a" alt="" aria-hidden="true" width="192" height="192"><div class="st-tx"><h3 class="st-t" data-copy="lg_c5_s3_t"></h3><p class="st-d" data-copy="lg_c5_s3_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/care.webp?v=1104a" alt="" aria-hidden="true" width="192" height="192"><div class="st-tx"><h3 class="st-t" data-copy="lg_c5_s4_t"></h3><p class="st-d" data-copy="lg_c5_s4_d"></p></div></li>
        </ol>
        <ul class="infos">
          <li class="inf"><span class="inf-k" data-copy="lg_c5_i1_k"></span><span class="inf-v" data-copy="lg_c5_i1_v"></span><span class="inf-n" data-copy="lg_c5_i1_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="lg_c5_i2_k"></span><span class="inf-v" data-copy="lg_c5_i2_v"></span><span class="inf-n" data-copy="lg_c5_i2_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="lg_c5_i3_k"></span><span class="inf-v" data-copy="lg_c5_i3_v"></span><span class="inf-n" data-copy="lg_c5_i3_n"></span></li>

        <p class="c5-time" data-copy="lg_c5_time"></p>
        <ul class="care">

          <li><span class="cdot" aria-hidden="true"></span><span data-copy="lg_c5_care3"></span></li>

        <header class="top solo"><img class="brand wordmark" src="assets/logo-wordmark-282828.png" alt="BEAUTY BLOSSOM" width="975" height="111"></header>

          <div class="bt bt-about">
            <div class="ab-top">
              <div class="ab-intro">

              <figure class="dr">

            <div class="ab-photos">

            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><img class="si" src="assets/icons/genuine.webp?v=1104a" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="lg_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="lg_ab_s1_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/consult.webp?v=1104a" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="lg_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="lg_ab_s2_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/hours.webp?v=1104a" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="lg_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="lg_ab_s3_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/language.webp?v=1104a" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="lg_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="lg_ab_s4_d"></span></li>
            </ul>
          </div>
          <!-- B: directions. The Google Maps capture is shown untouched (Google marker, logo and attribution inside the image); one file per width tier. -->
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="lg_ab_loc"></p><h3 class="bt-t" data-copy="lg_ab_loc_title"></h3></div>
            <div class="loc-body">
              <figure class="map">
                <picture>
                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="lg_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <img class="way-pin" src="assets/icons/pin.webp?v=1104a" alt="" aria-hidden="true" width="192" height="192">
                <div class="way-tx">
                  <p class="way-top"><span class="way-st" data-copy="lg_ab_way_station"></span><span class="way-line" data-copy="lg_ab_way_line"></span></p>
                  <p class="way-addr"><span data-copy="lg_ab_way_addr"></span><span class="way-desk"><span data-copy="lg_ab_way_desk"></span></span></p>
                </div>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="lg_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="lg_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="lg_ab_h1"></li><li data-copy="lg_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="lg_ab_h3"></p>
          </div>
          <div class="bt bt-book">
            <p class="bt-k" data-copy="lg_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="lg_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="lg_alt_qr" alt="" width="424" height="424"><figcaption data-copy="lg_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="lg_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="lg_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><img class="ico ico-phone" src="assets/icons/phone.webp?v=1104a" alt="" aria-hidden="true" width="192" height="192"><a data-link="phone"><span data-copy="lg_ab_phone"></span></a></p>
              </div>
            </div>
            <img class="bk-mark wordmark" src="assets/logo-wordmark-282828.png" alt="BEAUTY BLOSSOM" width="975" height="111">
          </div>
        </div>
      </div>
