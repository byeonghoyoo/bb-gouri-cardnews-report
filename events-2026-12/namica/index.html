<!doctype html>
<html lang="ko" data-locale="KO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>NAMICA 런칭 · BEAUTY BLOSSOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&amp;family=Pinyon+Script&amp;display=swap">
<link id="locale-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="namica.css?v=20261029-namica1">
<script src="copy-data.js?v=20261029-namica1" defer></script>
<script src="../inline-edit.js?v=20261029-namica1" defer></script>
<script src="namica.js?v=20261029-namica1" defer></script>
</head>
<body>
<main class="nm" id="nm">
<div class="sheet">

  <!-- 1. HERO · invitation out of an envelope -->
  <section class="hero" aria-labelledby="nm-title">
    <div class="hero-top">
      <img class="logo-bb" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
      <img class="logo-aptos" src="assets/aptos-logo.png" alt="APTOS" width="231" height="56">
    </div>
    <div class="hero-stage">
      <div class="arch-wrap">
        <figure class="arch"><img class="hero-photo" src="assets/hero.jpg?v=nm1" data-alt="nm_alt_hero" alt="" width="1024" height="1280"></figure>
        <img class="deco hero-ribbon" src="assets/miri/ribbon_bow.webp" alt="" data-fb="hide">
      </div>
      <div class="envelope" aria-hidden="true"><span class="env-back"></span><span class="env-flap"></span></div>
      <div class="invite">
        <img class="deco seal" src="assets/miri/wax_seal.webp" alt="" data-fb="seal">
        <p class="inv-label" data-copy="nm_inv_label"></p>
        <p class="inv-type"><img class="type-img" src="assets/miri/type_youre_invited.webp" alt="You're invited"></p>
        <h1 class="inv-head" id="nm-title"><span class="inv-kicker" data-copy="nm_hero_kicker"></span><span class="inv-title" data-copy="nm_hero_title"></span></h1>
        <img class="flourish" src="assets/miri/gold_flourish.webp" alt="" data-fb="flourish">
        <p class="inv-sub" data-copy="nm_hero_sub"></p>
        <p class="inv-date" data-optional-group><span data-copy="nm_period" data-optional data-placeholder="기간 입력 (예: 12.1 – 12.31)"></span></p>
        <a class="inv-cta" href="#lineup" data-jump="lineup"><span data-copy="nm_hero_cta"></span></a>
      </div>
      <div class="env-pocket" aria-hidden="true"></div>
    </div>
  </section>

  <!-- 2. LETTER · what NAMICA is -->
  <section class="letter" aria-labelledby="nm-letter-title">
    <img class="deco peony" src="assets/miri/peony_corner.webp" alt="" data-fb="hide">
    <div class="letter-grid">
      <figure class="cameo"><img src="assets/profile.jpg?v=nm1" data-alt="nm_alt_profile" alt="" width="880" height="1100"></figure>
      <div class="letter-paper">
        <p class="letter-to" data-copy="nm_letter_to"></p>
        <h2 class="letter-title" id="nm-letter-title" data-copy="nm_letter_title"></h2>
        <p class="letter-body" data-copy="nm_letter_body"></p>
        <ul class="chips">
          <li data-copy="nm_chip1"></li>
          <li data-copy="nm_chip2"></li>
        </ul>
        <p class="letter-from" data-copy="nm_letter_from"></p>
      </div>
    </div>
  </section>

  <!-- 3. LINE-UP · three thread lengths with their prices -->
  <section class="lineup" id="lineup" aria-labelledby="nm-lu-title">
    <header class="sec-head">
      <p class="eyebrow" data-copy="nm_lu_label"></p>
      <h2 class="sec-title" id="nm-lu-title" data-copy="nm_lu_title"></h2>
      <p class="sec-body" data-copy="nm_lu_body"></p>
    </header>
    <div class="lines">
      <article class="line l1">
        <div class="line-visual"><img class="box" src="assets/prod-namica-visage.webp" data-alt="nm_alt_box1" alt="" width="1000" height="1000" data-fb="box"></div>
        <h3 class="line-name" data-copy="nm_l1_name"></h3>
        <p class="line-len" data-copy="nm_l1_len"></p>
        <p class="line-desc" data-copy="nm_l1_desc"></p>
        <ul class="rows">
          <li class="row">
            <p class="row-head"><span class="row-name" data-copy="nm_r1_name"></span><span class="row-qty" data-copy="nm_r1_qty"></span></p>
            <p class="old fit"><s><span data-copy="nm_r1_old"></span><span data-copy="nm_unit"></span></s></p>
            <p class="sale fit"><b data-copy="nm_r1_sale"></b><span class="unit" data-copy="nm_unit"></span></p>
          </li>
        </ul>
        <p class="vat" data-copy="nm_vat"></p>
      </article>
      <article class="line l2">
        <div class="line-visual"><img class="box" src="assets/prod-namica-visage-s.webp" data-alt="nm_alt_box2" alt="" width="1000" height="1000" data-fb="box"></div>
        <h3 class="line-name" data-copy="nm_l2_name"></h3>
        <p class="line-len" data-copy="nm_l2_len"></p>
        <p class="line-desc" data-copy="nm_l2_desc"></p>
        <ul class="rows">
          <li class="row">
            <p class="row-head"><span class="row-name" data-copy="nm_r2_name"></span><span class="row-qty" data-copy="nm_r2_qty"></span></p>
            <p class="old fit"><s><span data-copy="nm_r2_old"></span><span data-copy="nm_unit"></span></s></p>
            <p class="sale fit"><b data-copy="nm_r2_sale"></b><span class="unit" data-copy="nm_unit"></span></p>
          </li>
          <li class="row">
            <p class="row-head"><span class="row-name" data-copy="nm_r3_name"></span><span class="row-qty" data-copy="nm_r3_qty"></span></p>
            <p class="old fit"><s><span data-copy="nm_r3_old"></span><span data-copy="nm_unit"></span></s></p>
            <p class="sale fit"><b data-copy="nm_r3_sale"></b><span class="unit" data-copy="nm_unit"></span></p>
          </li>
        </ul>
        <p class="vat" data-copy="nm_vat"></p>
      </article>
      <article class="line l3">
        <div class="line-visual"><img class="box" src="assets/prod-namica-nano.webp" data-alt="nm_alt_box3" alt="" width="1000" height="1000" data-fb="box"></div>
        <h3 class="line-name" data-copy="nm_l3_name"></h3>
        <p class="line-len" data-copy="nm_l3_len"></p>
        <p class="line-desc" data-copy="nm_l3_desc"></p>
        <ul class="rows">
          <li class="row">
            <p class="row-head"><span class="row-name" data-copy="nm_r4_name"></span><span class="row-qty" data-copy="nm_r4_qty"></span></p>
            <p class="old fit"><s><span data-copy="nm_r4_old"></span><span data-copy="nm_unit"></span></s></p>
            <p class="sale fit"><b data-copy="nm_r4_sale"></b><span class="unit" data-copy="nm_unit"></span></p>
          </li>
          <li class="row">
            <p class="row-head"><span class="row-name" data-copy="nm_r5_name"></span><span class="row-qty" data-copy="nm_r5_qty"></span></p>
            <p class="old fit"><s><span data-copy="nm_r5_old"></span><span data-copy="nm_unit"></span></s></p>
            <p class="sale fit"><b data-copy="nm_r5_sale"></b><span class="unit" data-copy="nm_unit"></span></p>
          </li>
        </ul>
        <p class="vat" data-copy="nm_vat"></p>
      </article>
    </div>
    <img class="deco pearls" src="assets/miri/pearls.webp" alt="" data-fb="hide">
  </section>

  <!-- 4. SIGNATURE PAIRING · two combination programs -->
  <section class="pairing" aria-labelledby="nm-pr-title">
    <header class="sec-head light">
      <p class="eyebrow" data-copy="nm_pr_label"></p>
      <h2 class="sec-title" id="nm-pr-title" data-copy="nm_pr_title"></h2>
    </header>
    <div class="pair-grid">
      <figure class="pair-photo">
        <img src="assets/signature.jpg?v=nm1" data-alt="nm_alt_signature" alt="" width="880" height="1100">
        <img class="deco pair-ribbon" src="assets/miri/ribbon_bow.webp" alt="" data-fb="hide">
      </figure>
      <div class="pair-cards">
        <article class="combo c1">
          <h3 class="combo-name" data-copy="nm_c1_name"></h3>
          <p class="combo-desc" data-copy="nm_c1_desc"></p>
          <ul class="items">
            <li data-copy="nm_c1_i1"></li>
            <li data-copy="nm_c1_i2"></li>
          </ul>
          <div class="combo-price">
            <p class="old fit"><s><span data-copy="nm_c1_old"></span><span data-copy="nm_unit"></span></s></p>
            <p class="sale fit"><b data-copy="nm_c1_sale"></b><span class="unit" data-copy="nm_unit"></span></p>
          </div>
          <p class="vat" data-copy="nm_vat"></p>
        </article>
        <article class="combo c2">
          <img class="deco c2-seal" src="assets/miri/wax_seal.webp" alt="" data-fb="seal">
          <p class="combo-badge" data-copy="nm_c2_badge"></p>
          <h3 class="combo-name" data-copy="nm_c2_name"></h3>
          <p class="combo-desc" data-copy="nm_c2_desc"></p>
          <ul class="items">
            <li data-copy="nm_c2_i1"></li>
            <li data-copy="nm_c2_i2"></li>
            <li data-copy="nm_c2_i3"></li>
            <li data-copy="nm_c2_i4"></li>
            <li data-copy="nm_c2_i5"></li>
          </ul>
          <div class="combo-price">
            <p class="old fit"><s><span data-copy="nm_c2_old"></span><span data-copy="nm_unit"></span></s></p>
            <p class="sale fit"><b data-copy="nm_c2_sale"></b><span class="unit" data-copy="nm_unit"></span></p>
          </div>
          <p class="vat" data-copy="nm_vat"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- 5. Q&A -->
  <section class="qa" aria-labelledby="nm-qa-title">
    <header class="sec-head">
      <p class="eyebrow" data-copy="nm_qa_label"></p>
      <h2 class="sec-title" id="nm-qa-title" data-copy="nm_qa_title"></h2>
    </header>
    <div class="qa-grid">
      <article class="qa-card"><p class="q"><b>Q.</b><span data-copy="nm_q1"></span></p><p class="a" data-copy="nm_a1"></p></article>
      <article class="qa-card"><p class="q"><b>Q.</b><span data-copy="nm_q2"></span></p><p class="a" data-copy="nm_a2"></p></article>
      <article class="qa-card"><p class="q"><b>Q.</b><span data-copy="nm_q3"></span></p><p class="a" data-copy="nm_a3"></p></article>
      <article class="qa-card"><p class="q"><b>Q.</b><span data-copy="nm_q4"></span></p><p class="a" data-copy="nm_a4"></p></article>
    </div>
  </section>

  <!-- 6. R.S.V.P. · booking -->
  <section class="rsvp-sec" aria-labelledby="nm-rsvp-title">
    <div class="rsvp">
      <img class="deco rsvp-peony" src="assets/miri/peony_corner.webp" alt="" data-fb="hide">
      <figure class="rsvp-photo"><img src="assets/invite.jpg?v=nm1" data-alt="nm_alt_invite" alt="" width="880" height="1100"></figure>
      <div class="rsvp-main">
        <p class="rsvp-type"><img class="type-img" src="assets/miri/type_rsvp.webp" alt="R.S.V.P."></p>
        <h2 class="rsvp-title" id="nm-rsvp-title" data-copy="nm_rsvp_title"></h2>
        <dl class="rsvp-rows">
          <div class="rr"><dt data-copy="nm_lbl_booking"></dt><dd><a data-link="booking" data-copy="nm_link_naver"></a><span class="sep">/</span><a data-link="kakao" data-copy="nm_link_kakao"></a></dd></div>
          <div class="rr"><dt data-copy="nm_lbl_place"></dt><dd data-copy="nm_place"></dd></div>
          <div class="rr"><dt data-copy="nm_lbl_phone"></dt><dd><a class="tel" data-link="phone" data-copy="nm_phone"></a></dd></div>
        </dl>
        <div class="rsvp-qr">
          <img class="qr" src="assets/naver-booking-qr.png" alt="" width="424" height="424">
          <p class="qr-label" data-copy="nm_qr_label"></p>
          <img class="deco rsvp-seal" src="assets/miri/wax_seal.webp" alt="" data-fb="seal">
        </div>
      </div>
    </div>
    <div class="cta">
      <a class="btn btn-naver" data-link="booking" data-copy="nm_cta_naver"></a>
      <a class="btn btn-kakao" data-link="kakao" data-copy="nm_cta_kakao"></a>
    </div>
  </section>

  <!-- 7. NOTICE + FOOTER -->
  <section class="notice">
    <h2 class="notice-title" data-copy="nm_notice_title"></h2>
    <ul>
      <li data-copy="nm_cond1"></li>
      <li data-copy="nm_cond2"></li>
      <li data-copy="nm_cond3"></li>
      <li data-copy="nm_cond4" data-optional data-placeholder="추가 안내 입력 (예: 이벤트 대상·조건)"></li>
    </ul>
  </section>
  <footer class="foot">
    <img class="logo-bb" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
    <p><span data-copy="nm_place"></span><span class="sep">·</span><a data-link="phone" data-copy="nm_phone"></a></p>
  </footer>

</div>
</main>
</body>
</html>
