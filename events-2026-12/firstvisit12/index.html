          <div class="bt bt-hours">
            <p class="bt-k" data-copy="fv_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="fv_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="fv_ab_h1"></li><li data-copy="fv_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="fv_ab_h3"></p>
          </div>
          <!-- D: booking (QR and channels per language, phone) -->
          <div class="bt bt-book">
            <p class="bt-k" data-copy="fv_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="fv_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="fv_alt_qr" alt="" width="424" height="424"><figcaption data-copy="fv_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="fv_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="fv_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><svg class="ph-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 3.5l3 3.1-1.8 2.6a13.5 13.5 0 0 0 7 7l2.6-1.8 3.1 3-1.7 3.1c-.4.7-1.2 1-2 .9C10 20.7 3.3 14 2.6 7.2c-.1-.8.2-1.6.9-2z" fill="currentColor"/></svg><a data-link="phone"><span data-copy="fv_ab_phone"></span></a></p>
              </div>
            </div>
            <img class="wordmark" src="assets/logo-wordmark-c8175f.png" alt="BEAUTY BLOSSOM" width="975" height="111">
          </div>
        </div>
      </div>
    </section>

    <!-- notes under the cards -->
    <section class="notes" aria-labelledby="fv-notes">
      <h2 id="fv-notes"><span data-copy="fv_note_title"></span></h2>
      <ul>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="fv_cond1"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="fv_cond2"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="fv_cond3"></span></li>
        <li data-optional-group><span class="dot" aria-hidden="true"></span><span data-copy="fv_cond4" data-optional data-placeholder="추가 안내 (예: 대상·조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
