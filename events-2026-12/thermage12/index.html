<!-- THM12 써마지 · 겨울 시즌 (Korean first). Team palette (sheet I26 pin 702209766938269601): Rosarian #FAEADD, Wet Charcoal #222023, Purple Seduction #522A6F,

     Every picture is a generated image (v4/thermage12/gen/*.json -> a/*.png -> gen/cut-assets.cjs) or a real photo cut-out; no inline SVG, no CSS-drawn picture.
     Six 1080x1350 cards (section[data-card="1..6"]); every word is editable copy (data-copy, ../inline-edit.js, aptos-* board messages).
     Price rows: data-price-row="11_lifting:<sheet row>" with [data-price-list] / [data-price-sale]; the strings come from v4/events/_data/pages.json via v4/thermage12/build-thermage12.cjs. -->

  <div class="sheet">

    <!-- 1 / 6 : hero (generated model photo, v4/thermage12/gen/hero-v1.json) -->

        <p class="tz-main"><span class="tz-price money" data-copy="tm_hero_price"></span><span class="tz-vat" data-copy="tm_vat"></span></p>
      </div>
      <div class="seal s-hero"><img class="seal-art" src="assets/dec/seal.webp" alt="" aria-hidden="true"><p class="seal-tx"><span class="sl s1" data-copy="tm_seal1"></span><span class="sl s2" data-copy="tm_seal2"></span><span class="sl s3" data-copy="tm_seal3"></span></p></div>
      <p class="c1-contact"><img class="ph-ico" src="assets/icons/ic-phone.webp" alt="" aria-hidden="true"><span class="contact" data-copy="tm_contact"></span></p>
    </section>

    <!-- 3 / 6 : Before & After (approved bb-ba component of v4/_shared/ba/winter-ba-9/thermage; the four photos are copied unchanged into assets/ba).
         Colours come from the page palette through the --ba-* variables; the arrow is the text '›' (no inline SVG). -->

              <figure class="ph-w"><img src="assets/hp-reception.jpg?v=a" data-alt="tm_alt_ph1" alt="" width="960" height="450"><figcaption data-copy="tm_ab_ph1"></figcaption></figure>
              <figure class="ph-n"><img src="assets/hp-care.png?v=a" data-alt="tm_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="tm_ab_ph2"></figcaption></figure>
              <figure class="ph-w"><img src="assets/hp-treatment.jpg?v=a" data-alt="tm_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="tm_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><img class="si" src="assets/icons/ic-genuine.webp" alt="" aria-hidden="true"><span class="at" data-copy="tm_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="tm_ab_s1_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-consult.webp" alt="" aria-hidden="true"><span class="at" data-copy="tm_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="tm_ab_s2_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-clock.webp" alt="" aria-hidden="true"><span class="at" data-copy="tm_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="tm_ab_s3_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-globe.webp" alt="" aria-hidden="true"><span class="at" data-copy="tm_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="tm_ab_s4_d"></span></li>
            </ul>
          </div>
          <!-- B: directions. The Google Maps capture is shown untouched (Google marker, logo and attribution inside the image); one file per width tier. -->
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="tm_ab_loc"></p><h3 class="bt-t" data-copy="tm_ab_loc_title"></h3></div>
            <div class="loc-body">
              <figure class="map">
                <picture>
                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="tm_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <img class="way-pin" src="assets/icons/ic-pin.webp" alt="" aria-hidden="true">
                <div class="way-tx">
                  <p class="way-top"><span class="way-st" data-copy="tm_ab_way_station"></span><span class="way-line" data-copy="tm_ab_way_line"></span></p>
                  <p class="way-addr"><span data-copy="tm_ab_way_addr"></span><span class="way-desk"><span data-copy="tm_ab_way_desk"></span></span></p>
                </div>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="tm_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="tm_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="tm_ab_h1"></li><li data-copy="tm_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="tm_ab_h3"></p>
          </div>
          <div class="bt bt-book">
            <p class="bt-k" data-copy="tm_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="tm_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="tm_alt_qr" alt="" width="424" height="424"><figcaption data-copy="tm_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="tm_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="tm_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><img class="ph-ico" src="assets/icons/ic-phone.webp" alt="" aria-hidden="true"><a data-link="phone"><span data-copy="tm_ab_phone"></span></a></p>
              </div>
            </div>
            <span class="bk-mark" data-copy="tm_brand"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- notes under the cards (not a card) -->
    <section class="notes" aria-labelledby="tm-notes">
      <h2 id="tm-notes"><img class="nt-ico" src="assets/dec/spark-sun.webp" alt="" aria-hidden="true"><span data-copy="tm_note_title"></span></h2>
      <ul>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="tm_cond1"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="tm_cond2"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="tm_cond3"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="tm_cond_ba"></span></li>
        <li data-optional-group><span class="dot" aria-hidden="true"></span><span data-copy="tm_cond4" data-optional data-placeholder="추가 안내 (예: 대상·조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
