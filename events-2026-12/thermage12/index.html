          <li class="st"><span class="st-ico" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 9c2.7-2.6 5.3-2.6 8 0s5.3 2.6 8 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4 14c2.7-2.6 5.3-2.6 8 0s5.3 2.6 8 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 3.5v2.2M12 18.3v2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><div class="st-tx"><h3 class="st-t" data-copy="tm_c4_s3_t"></h3><p class="st-d" data-copy="tm_c4_s3_d"></p>
            <ol class="shot">
              <li class="sh-it cool"><span data-copy="tm_c4_h1"></span></li>
              <li class="sh-it heat"><span data-copy="tm_c4_h2"></span></li>
              <li class="sh-it cool"><span data-copy="tm_c4_h3"></span></li>
            </ol></div></li>
          <li class="st"><span class="st-ico" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span><div class="st-tx"><h3 class="st-t" data-copy="tm_c4_s4_t"></h3><p class="st-d" data-copy="tm_c4_s4_d"></p>
            <ul class="chips soft">
              <li class="chip"><span data-copy="tm_c4_a1"></span></li>
              <li class="chip"><span data-copy="tm_c4_a2"></span></li>
            </ul></div></li>
        </ol>
        <ul class="infos">
          <li class="inf"><span class="inf-k" data-copy="tm_c4_i1_k"></span><span class="inf-v" data-copy="tm_c4_i1_v"></span><span class="inf-n" data-copy="tm_c4_i1_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="tm_c4_i2_k"></span><span class="inf-v" data-copy="tm_c4_i2_v"></span><span class="inf-n" data-copy="tm_c4_i2_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="tm_c4_i3_k"></span><span class="inf-v" data-copy="tm_c4_i3_v"></span><span class="inf-n" data-copy="tm_c4_i3_n"></span></li>
        </ul>
        <p class="c4-tip" data-copy="tm_c4_tip"></p>
        <p class="src" data-copy="tm_c4_src"></p>
      </div>
    </section>

    <!-- 5 / 5 : clinic intro, the V4 bento grid (same content and order as onda12 / ulthera12 / FV12) on the night sky with Rosarian panels and a Solarized booking panel -->
    <section class="card c5" data-card="5" aria-labelledby="tm-t5">
      <div class="stars st-night" aria-hidden="true"></div>
      <div class="cx-in">
        <header class="top solo"><span class="brand" data-copy="tm_brand"></span></header>
        <div class="bento">
          <div class="bt bt-about">
            <div class="ab-top">
              <div class="ab-intro">
                <p class="bt-k" data-copy="tm_ab_kicker"></p>
                <h2 class="ab-title" id="tm-t5" data-copy="tm_ab_title"></h2>
                <p class="ab-lead"><span data-copy="tm_ab_intro1"></span><span data-copy="tm_ab_intro2"></span></p>
              </div>
              <figure class="dr">
                <figcaption class="dr-tx"><span class="dr-name" data-copy="tm_ab_dr_name"></span><span class="dr-quote" data-copy="tm_ab_dr_quote"></span></figcaption>
                <span class="dr-glow" aria-hidden="true"></span>
                <img class="dr-img" src="assets/director-lee.webp?v=a" data-alt="tm_alt_director" alt="" width="640" height="640">
              </figure>
            </div>
            <div class="ab-photos">
              <figure class="ph-w"><img src="assets/hp-reception.jpg?v=a" data-alt="tm_alt_ph1" alt="" width="960" height="450"><figcaption data-copy="tm_ab_ph1"></figcaption></figure>
              <figure class="ph-n"><img src="assets/hp-care.png?v=a" data-alt="tm_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="tm_ab_ph2"></figcaption></figure>
              <figure class="ph-w"><img src="assets/hp-treatment.jpg?v=a" data-alt="tm_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="tm_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><span class="si" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3l7 3v5.5c0 4.3-2.9 7.7-7 9.5-4.1-1.8-7-5.2-7-9.5V6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.6 12.2l2.4 2.4 4.6-4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="at" data-copy="tm_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="tm_ab_s1_d"></span></li>
              <li><span class="sh"><span class="si" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 5.5h16v10H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span class="at" data-copy="tm_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="tm_ab_s2_d"></span></li>
              <li><span class="sh"><span class="si" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="at" data-copy="tm_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="tm_ab_s3_d"></span></li>
              <li><span class="sh"><span class="si" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5S9.4 5.9 12 3.5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="at" data-copy="tm_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="tm_ab_s4_d"></span></li>
            </ul>
          </div>
          <!-- B: directions. The Google Maps capture is shown untouched (Google marker, logo and attribution inside the image); one file per width tier. -->
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="tm_ab_loc"></p><h3 class="bt-t" data-copy="tm_ab_loc_title"></h3></div>
            <div class="loc-body">
              <figure class="map">
                <picture>
                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="tm_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <svg class="way-pin" viewBox="0 0 40 50" aria-hidden="true" focusable="false"><path d="M20 2C10.1 2 2 9.9 2 19.6 2 32.8 20 48 20 48S38 32.8 38 19.6C38 9.9 29.9 2 20 2z" stroke-width="2.4"/><circle cx="20" cy="19.5" r="6.5"/></svg>
                <div class="way-tx">
                  <p class="way-top"><span class="way-st" data-copy="tm_ab_way_station"></span><span class="way-line" data-copy="tm_ab_way_line"></span></p>
                  <p class="way-addr"><span data-copy="tm_ab_way_addr"></span><span class="way-desk"><span data-copy="tm_ab_way_desk"></span></span></p>
                </div>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="tm_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="tm_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="tm_ab_h1"></li><li data-copy="tm_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="tm_ab_h3"></p>
          </div>
          <div class="bt bt-book">
            <p class="bt-k" data-copy="tm_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="tm_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="tm_alt_qr" alt="" width="424" height="424"><figcaption data-copy="tm_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="tm_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="tm_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><svg class="ph-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 3.5l3 3.1-1.8 2.6a13.5 13.5 0 0 0 7 7l2.6-1.8 3.1 3-1.7 3.1c-.4.7-1.2 1-2 .9C10 20.7 3.3 14 2.6 7.2c-.1-.8.2-1.6.9-2z" fill="currentColor"/></svg><a data-link="phone"><span data-copy="tm_ab_phone"></span></a></p>
              </div>
            </div>
            <span class="bk-mark" data-copy="tm_brand"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- notes under the cards (not a card) -->
    <section class="notes" aria-labelledby="tm-notes">
      <h2 id="tm-notes"><span data-copy="tm_note_title"></span></h2>
      <ul>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="tm_cond1"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="tm_cond2"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="tm_cond3"></span></li>
        <li data-optional-group><span class="dot" aria-hidden="true"></span><span data-copy="tm_cond4" data-optional data-placeholder="추가 안내 (예: 대상·조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
