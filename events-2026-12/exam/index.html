<!doctype html>
<html lang="ko" data-locale="KO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>시험은 끝! 이제 내 피부 차례 · BEAUTY BLOSSOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link id="locale-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gaegu:wght@400;700&amp;family=Nanum+Pen+Script&amp;display=swap">
<link rel="stylesheet" href="exam.css?v=20261029-exam3">
<script src="copy-data.js?v=20261029-exam3" defer></script>
<script src="exam.js?v=20261029-exam3" defer></script>
</head>
<body>
<main class="exam" id="exam">
<div class="sheet">

  <!-- 1. HERO -->
  <section class="hero" aria-labelledby="hero-type">
    <div class="hero-band">
      <div class="hero-top">
        <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
        <span class="hero-eyebrow" data-copy="heroEyebrow"></span>
      </div>
      <p class="hero-title"><span data-copy="title"></span> <strong data-copy="title_strong"></strong></p>
      <h1 class="hero-type" id="hero-type"><img class="type-img" src="assets/miri/type_you_did_it.webp" alt="YOU DID IT!"></h1>
      <div class="hero-pills" data-optional-group>
        <span class="pill" data-copy="period" data-optional data-placeholder="기간 입력 (예: 11.19 – 12.31)"></span>
        <span class="pill pill-target" data-copy="target" data-optional data-placeholder="대상·조건 입력 (예: 2027 수능 수험생)"></span>
      </div>
    </div>

    <div class="hero-stage">
      <div class="prints">
        <span class="print-back b1" aria-hidden="true"></span>
        <span class="print-back b2" aria-hidden="true"></span>
        <figure class="print-main">
          <img class="print-photo" src="assets/hero.jpg?v=m2" data-alt="alt_hero" alt="" width="1024" height="1536">
        </figure>
        <img class="deco clip" src="assets/miri/paperclip.webp" alt="">
        <img class="deco hero-star" src="assets/miri/sticker_star_blue.webp" alt="">
        <img class="deco hero-heart" src="assets/miri/sticker_heart_coral.webp" alt="">
      </div>

      <div class="hero-notes">
        <div class="notebook">
          <img class="deco nb-tape" src="assets/miri/tape_gingham_blue.webp" alt="">
          <img class="nb-stamp" src="assets/miri/stamp_after_exam.webp" alt="AFTER EXAM">
          <h2 class="nb-title" data-copy="todo_title"></h2>
          <ul class="todo">
            <li><i class="box is-done" aria-hidden="true"></i><span data-copy="todo1"></span></li>
            <li><i class="box is-done" aria-hidden="true"></i><span data-copy="todo2"></span></li>
            <li><i class="box is-done" aria-hidden="true"></i><span data-copy="todo3"></span></li>
            <li class="todo-key"><i class="box" aria-hidden="true"></i><span class="key-text"><span data-copy="todo4"></span><img class="deco key-circle" src="assets/miri/doodle_circle.webp" alt=""></span></li>
          </ul>
          <img class="deco nb-arrow" src="assets/miri/doodle_arrow_loop.webp" alt="">
        </div>

        <div class="hero-price postit">
          <img class="deco pi-smiley" src="assets/miri/sticker_smiley.webp" alt="">
          <p class="hp-label fit" data-copy="hero_price_label"></p>
          <div class="pi-in">
            <p class="hp-name"><span data-copy="offer1_title"></span> <span class="hp-count" data-copy="offer1_count"></span></p>
            <p class="price fit"><b data-copy="offer1_price"></b><span class="unit" data-copy="money_unit"></span></p>
          </div>
          <p class="tax" data-copy="tax_label"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 2. INTRO -->
  <section class="intro">
    <h2 class="intro-title"><span class="mark-wrap"><span data-copy="subtitle"></span><img class="deco mark" src="assets/miri/marker_underline.webp" alt=""><img class="deco intro-sparkle" src="assets/miri/doodle_sparkle.webp" alt=""></span></h2>
    <p class="intro-body" data-copy="body"></p>
  </section>

  <!-- 3. DIARY PAGES -->
  <section class="diary d1" id="page-1" aria-labelledby="d1-title">
    <div class="tabs" aria-hidden="true">
      <span class="tab on"><b>01</b><span data-copy="tab1"></span></span>
      <span class="tab"><b>02</b><span data-copy="tab2"></span></span>
      <span class="tab"><b>03</b><span data-copy="tab3"></span></span>
    </div>
    <div class="binder">
      <div class="rings" aria-hidden="true"></div>
      <div class="page">
        <p class="hook"><img class="deco hook-arrow" src="assets/miri/doodle_arrow_curve.webp" alt=""><span data-copy="p1_hook"></span></p>
        <h2 class="d-title" id="d1-title"><span class="mark-wrap"><span data-copy="offer1_title"></span><img class="deco mark" src="assets/miri/marker_underline.webp" alt=""></span></h2>
        <div class="d-grid">
          <div class="postit">
            <img class="deco pi-smiley" src="assets/miri/sticker_smiley.webp" alt="">
            <p class="pi-band fit"><span class="r-title" data-copy="offer1_title"></span><span class="r-count" data-copy="offer1_count"></span></p>
            <div class="pi-in">
              <p class="r-detail" data-copy="offer1_detail"></p>
              <p class="r-price fit"><i class="lead"></i><b data-copy="offer1_price"></b><span class="unit" data-copy="money_unit"></span></p>
            </div>
            <p class="tax" data-copy="tax_label"></p>
          </div>
          <figure class="polaroid tilt-r">
            <img class="deco tape" src="assets/miri/tape_washi_cream.webp" alt="">
            <img class="ph" src="assets/p1.jpg?v=m2" data-alt="alt_p1" alt="" width="880" height="1100">
            <figcaption data-copy="p1_caption"></figcaption>
          </figure>
        </div>
        <div class="planner">
          <p class="pl-label"><img class="deco pl-check" src="assets/miri/doodle_check.webp" alt=""><span data-copy="steps_label"></span></p>
          <ol class="steps">
            <li><b>01</b><span data-copy="offer1_step1"></span></li>
            <li><b>02</b><span data-copy="offer1_step2"></span></li>
            <li><b>03</b><span data-copy="offer1_step3"></span></li>
            <li><b>04</b><span data-copy="offer1_step4"></span></li>
          </ol>
        </div>
        <img class="deco page-star" src="assets/miri/sticker_star_blue.webp" alt="">
        <img class="deco page-sparkle" src="assets/miri/doodle_sparkle.webp" alt="">
      </div>
    </div>
  </section>

  <section class="diary d2" id="page-2" aria-labelledby="d2-title">
    <div class="tabs" aria-hidden="true">
      <span class="tab"><b>01</b><span data-copy="tab1"></span></span>
      <span class="tab on"><b>02</b><span data-copy="tab2"></span></span>
      <span class="tab"><b>03</b><span data-copy="tab3"></span></span>
    </div>
    <div class="binder">
      <div class="rings" aria-hidden="true"></div>
      <div class="page">
        <p class="hook"><img class="deco hook-arrow" src="assets/miri/doodle_arrow_curve.webp" alt=""><span data-copy="p2_hook"></span></p>
        <h2 class="d-title" id="d2-title"><span class="mark-wrap"><span data-copy="p2_title"></span><img class="deco mark" src="assets/miri/marker_underline.webp" alt=""></span></h2>
        <div class="d-grid flip">
          <figure class="polaroid tilt-l">
            <img class="deco tape" src="assets/miri/tape_gingham_blue.webp" alt="">
            <img class="ph" src="assets/p2.jpg?v=m2" data-alt="alt_p2" alt="" width="880" height="1100">
            <figcaption data-copy="p2_caption"></figcaption>
          </figure>
          <div class="postits">
            <div class="postit">
              <img class="deco pi-heart" src="assets/miri/sticker_heart_coral.webp" alt="">
              <p class="pi-band fit"><span class="r-title" data-copy="offer2_title"></span><span class="r-count" data-copy="offer2_count"></span></p>
              <div class="pi-in">
                <p class="r-price fit"><i class="lead"></i><b data-copy="offer2_price"></b><span class="unit" data-copy="money_unit"></span></p>
              </div>
              <p class="tax" data-copy="tax_label"></p>
            </div>
            <div class="postit">
              <p class="pi-band fit"><span class="r-title" data-copy="offer3_title"></span><span class="r-count" data-copy="offer3_count"></span></p>
              <div class="pi-in">
                <p class="r-price fit"><i class="lead"></i><b data-copy="offer3_price"></b><span class="unit" data-copy="money_unit"></span></p>
              </div>
              <p class="tax" data-copy="tax_label"></p>
            </div>
            <p class="pi-note"><img class="deco note-check" src="assets/miri/doodle_check.webp" alt=""><span data-copy="p2_note"></span></p>
          </div>
        </div>
        <div class="prods two">
          <figure class="prod tilt-l">
            <img class="deco tape" src="assets/miri/tape_washi_cream.webp" alt="">
            <img class="ph" src="assets/prod-black.jpg" data-alt="alt_prod_black" alt="" width="800" height="785">
            <figcaption data-copy="prod_black_name"></figcaption>
          </figure>
          <figure class="prod tilt-r">
            <img class="deco tape" src="assets/miri/tape_washi_cream.webp" alt="">
            <img class="ph" src="assets/prod-lhala.jpg" data-alt="alt_prod_lhala" alt="" width="800" height="800">
            <figcaption data-copy="prod_lhala_name"></figcaption>
          </figure>
        </div>
        <img class="deco page-heart" src="assets/miri/doodle_heart.webp" alt="">
        <img class="deco page-sparkle" src="assets/miri/doodle_sparkle.webp" alt="">
      </div>
    </div>
  </section>

  <section class="diary d3" id="page-3" aria-labelledby="d3-title">
    <div class="tabs" aria-hidden="true">
      <span class="tab"><b>01</b><span data-copy="tab1"></span></span>
      <span class="tab"><b>02</b><span data-copy="tab2"></span></span>
      <span class="tab on"><b>03</b><span data-copy="tab3"></span></span>
    </div>
    <div class="binder">
      <div class="rings" aria-hidden="true"></div>
      <div class="page">
        <p class="hook"><img class="deco hook-arrow" src="assets/miri/doodle_arrow_curve.webp" alt=""><span data-copy="p3_hook"></span></p>
        <h2 class="d-title" id="d3-title"><span class="mark-wrap"><span data-copy="offer4_title"></span><img class="deco mark" src="assets/miri/marker_underline.webp" alt=""></span></h2>
        <div class="d-grid">
          <div class="postit">
            <img class="deco pi-smiley" src="assets/miri/sticker_smiley.webp" alt="">
            <p class="pi-band fit"><span class="r-title" data-copy="offer4_title"></span><span class="r-count" data-copy="offer4_count"></span></p>
            <div class="pi-in">
              <p class="r-price fit"><i class="lead"></i><b data-copy="offer4_price"></b><span class="unit" data-copy="money_unit"></span></p>
            </div>
            <p class="tax" data-copy="tax_label"></p>
          </div>
          <figure class="polaroid tilt-r">
            <img class="deco tape" src="assets/miri/tape_washi_cream.webp" alt="">
            <img class="ph" src="assets/p3.jpg?v=m2" data-alt="alt_p3" alt="" width="880" height="1100">
            <figcaption data-copy="p3_caption"></figcaption>
          </figure>
        </div>
        <div class="d-row2">
        <figure class="prod tilt-l">
          <img class="deco tape" src="assets/miri/tape_gingham_blue.webp" alt="">
          <img class="ph" src="assets/prod-yes.jpg" data-alt="alt_prod_yes" alt="" width="800" height="799">
          <figcaption data-copy="prod_yes_name"></figcaption>
        </figure>
        <div class="planner">
          <p class="pl-label"><img class="deco pl-check" src="assets/miri/doodle_check.webp" alt=""><span data-copy="steps_label"></span></p>
          <ol class="steps">
            <li><b>01</b><span data-copy="offer4_step1"></span></li>
            <li><b>02</b><span data-copy="offer4_step2"></span></li>
            <li><b>03</b><span data-copy="offer4_step3"></span></li>
            <li><b>04</b><span data-copy="offer4_step4"></span></li>
          </ol>
        </div>
        </div>
        <img class="deco page-star" src="assets/miri/sticker_star_blue.webp" alt="">
        <img class="deco page-sparkle" src="assets/miri/doodle_sparkle.webp" alt="">
      </div>
    </div>
  </section>

  <!-- 4. Q&A NOTES -->
  <section class="qa" aria-labelledby="qa-title">
    <h2 class="qa-title" id="qa-title"><span class="mark-wrap"><span data-copy="qa_title"></span><img class="deco mark" src="assets/miri/marker_underline.webp" alt=""></span></h2>
    <div class="notes">
      <article class="note n1"><img class="deco tape" src="assets/miri/tape_gingham_blue.webp" alt=""><p class="q"><b>Q.</b><span data-copy="qa1_q"></span></p><p class="a" data-copy="qa1_a"></p></article>
      <article class="note n2"><img class="deco tape" src="assets/miri/tape_washi_cream.webp" alt=""><p class="q"><b>Q.</b><span data-copy="qa2_q"></span></p><p class="a" data-copy="qa2_a"></p></article>
      <article class="note n3"><img class="deco tape" src="assets/miri/tape_washi_cream.webp" alt=""><p class="q"><b>Q.</b><span data-copy="qa3_q"></span></p><p class="a" data-copy="qa3_a"></p></article>
      <article class="note n4"><img class="deco tape" src="assets/miri/tape_gingham_blue.webp" alt=""><p class="q"><b>Q.</b><span data-copy="qa4_q"></span></p><p class="a" data-copy="qa4_a"></p></article>
    </div>
  </section>

  <!-- 5. TICKET CTA -->
  <section class="ticket-sec" aria-labelledby="tk-title">
    <div class="ticket">
      <div class="tk-main">
        <div class="tk-head"><span class="tk-en">ADMISSION TICKET</span><h2 class="tk-title" id="tk-title" data-copy="ticket_title"></h2></div>
        <div class="tk-body">
          <figure class="tk-photo"><img src="assets/id.jpg?v=m2" data-alt="alt_id" alt="" width="720" height="900"></figure>
          <dl class="tk-rows">
            <div class="tk-row"><dt data-copy="label_booking"></dt><dd><a data-link="booking" data-copy="link_naver"></a><span class="sep">/</span><a data-link="kakao" data-copy="link_kakao"></a></dd></div>
            <div class="tk-row"><dt data-copy="label_place"></dt><dd data-copy="place"></dd></div>
            <div class="tk-row"><dt data-copy="label_phone"></dt><dd><a class="tk-tel" data-link="phone" data-copy="phone"></a></dd></div>
          </dl>
        </div>
      </div>
      <div class="tk-stub">
        <img class="qr" src="assets/naver-booking-qr.png" alt="" width="424" height="424">
        <p class="qr-label" data-copy="qr_label"></p>
        <img class="tk-stamp" src="assets/logo-square.png" alt="" width="360" height="360">
      </div>
    </div>
    <div class="cta">
      <a class="btn btn-naver" data-link="booking" data-copy="cta_naver"></a>
      <a class="btn btn-kakao" data-link="kakao" data-copy="cta_kakao"></a>
    </div>
  </section>

  <!-- 6. NOTICE + FOOTER -->
  <section class="notice">
    <h2 class="notice-title" data-copy="notice_title"></h2>
    <ul>
      <li data-copy="condition1"></li>
      <li data-copy="condition2"></li>
      <li data-copy="condition3" data-optional data-placeholder="추가 안내 입력 (예: 미성년자 안내)"></li>
    </ul>
  </section>
  <footer class="foot">
    <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
    <p><span data-copy="place"></span><span class="sep">·</span><a data-link="phone" data-copy="phone"></a></p>
  </footer>

</div>
</main>
</body>
</html>
