<body>
<!-- DIE12B 다이어트 · 슬림 바디 패키지 · 겨울 시즌 (Korean first). 다이어트 같은 주제 묶음(레퍼런스 시트 D50 '동일한 주제로 2페이지 구성')의 둘째 페이지.
     Same layout system, colours, type and decoration set as diet12a (diet12b.css = diet12a.css, diet12b.js = diet12a.js); this page weights peach / orange.
     Design language from sheet F (diet poster), palette from sheet H (#FFE1C6 · #FF7A00 · #1E3A8A · #6B8F5E · #9EC5E8). Model = the same team photo G as
     diet12a (row 51 G is empty), a different outfit and different frames.
     Six 1080x1350 cards (section[data-card="1..6"]); every word is editable copy (data-copy, ../inline-edit.js, aptos-* board messages).
     Pictures: generated model photos (layout references; the lead replaces them in the same paths), bundle-shared generated icons / decorations /
     texture (v4/diet12a/gen), real ONDA cut-out (v3/products), shared clinic files.
     Price rows: data-price-row="9_diet:<sheet row>" with [data-price-list] / [data-price-sale]; strings from v4/events/_data/pages.json via v4/diet12b/build-diet12b.cjs. -->
<main class="dt2 p-b">
  <div class="sheet">

    <!-- 1 / 6 : hero (same F composition as diet12a): full-bleed photo (slot M1, object-fit cover), arch outline, vertical date, badge on the arch line,
         title = the sheet event name in two lines with the hook pill between, price band (row 26, strings from the sheet) with VAT and phone -->
    <section class="card c1" data-card="1" aria-labelledby="db-t1">
      <img class="c1-photo" src="assets/hero.jpg?v=a" data-alt="db_alt_hero" alt="" width="1080" height="1350">
      <div class="c1-fade" aria-hidden="true"></div>
      <span class="arch-line" aria-hidden="true"></span>
      <img class="dec sp-h" src="assets/dec/sprig.png" alt="" aria-hidden="true" width="320" height="320">
      <img class="dec tw tw1" src="assets/dec/spark-1.png" alt="" aria-hidden="true" width="220" height="220">
      <img class="dec tw tw2" src="assets/dec/spark-2.png" alt="" aria-hidden="true" width="220" height="220">
      <img class="dec tw tw3" src="assets/dec/spark-3.png" alt="" aria-hidden="true" width="220" height="220">
      <header class="c1-top"><span class="brand" data-copy="db_brand"></span></header>
      <p class="h-period" data-copy="db_period"></p>
      <div class="seal s-hero"><img class="seal-img" src="assets/dec/seal.png" alt="" aria-hidden="true" width="560" height="560"><p class="seal-tx"><span class="sl s1" data-copy="db_seal1"></span><span class="sl s2" data-copy="db_seal2"></span><span class="sl s3" data-copy="db_seal3"></span></p></div>
      <div class="h-title">
        <h1 class="h-l1" id="db-t1" data-copy="db_title1"></h1>
        <p class="h-pill" data-copy="db_hook"></p>
        <p class="h-l2" data-copy="db_title2"></p>
      </div>
      <div class="h-band">
        <div class="hb">
          <p class="hb-top"><span class="hb-tag" data-copy="db_hb_tag"></span><span class="hb-name" data-copy="db_hb_name"></span><span class="hb-opt pplus" data-copy="db_hb_opt"></span></p>
          <p class="hb-main"><span class="hb-list money" data-copy="db_hb_list"></span><span class="hb-sale money" data-copy="db_hb_sale"></span></p>
        </div>
        <div class="hb-side">
          <p class="hb-vat" data-copy="db_vat"></p>
          <p class="hb-contact"><img class="ico ico-phone" src="assets/icons/phone.webp" alt="" aria-hidden="true" width="192" height="192"><span data-copy="db_contact"></span></p>
        </div>
      </div>
    </section>

    <!-- 2 / 6 : prices 2-1, sheet rows 24-30 of 9_diet B24:K38 in sheet order (rows 24-25 = the next options of '슬림바디 7주', whose name sits in
         row 23 of the diet12a range; row 26 = product with its first option, rows 27-30 = its other options) -->
    <section class="card cp c2" data-card="2" aria-labelledby="db-t2">
      <img class="tex" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <img class="dec cx-sn" src="assets/dec/snow-1.png" alt="" aria-hidden="true" width="220" height="220">
      <img class="dec cx-or" src="assets/dec/orange.png" alt="" aria-hidden="true" width="300" height="300">
      <div class="cp-in">
        <header class="top"><span class="brand" data-copy="db_brand"></span><span class="period" data-copy="db_period"></span></header>
        <div class="cp-head">
          <p class="kicker" data-copy="db_p_kicker"></p>
          <h2 class="p-title" id="db-t2"><span class="pt-main" data-copy="db_p_title"></span></h2>
          <p class="p-lead" data-copy="db_p_lead2"></p>
        </div>
        <div class="seal s-board"><img class="seal-img" src="assets/dec/seal.png" alt="" aria-hidden="true" width="560" height="560"><p class="seal-tx"><span class="sl s1" data-copy="db_seal1"></span><span class="sl s2" data-copy="db_seal2"></span><span class="sl s3" data-copy="db_seal3"></span></p></div>
        <div class="pboard mid">
          <div class="prod">
            <p class="prod-h"><span class="prod-n" data-copy="db_x23_head"></span><span class="prod-s" data-copy="db_x23_sub"></span></p>
            <ul class="prows opts">
              <li class="prow" data-price-row="9_diet:24"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r24_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r24_list"></span><span class="psale money" data-price-sale data-copy="db_r24_sale"></span></li>
              <li class="prow" data-price-row="9_diet:25"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r25_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r25_list"></span><span class="psale money" data-price-sale data-copy="db_r25_sale"></span></li>
            </ul>
            <p class="p-note pnote" data-copy="db_x23_note"></p>
          </div>
          <div class="prod">
            <p class="prod-h"><span class="prod-n" data-copy="db_r26_head"></span></p>
            <ul class="prows opts">
              <li class="prow" data-price-row="9_diet:26"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r26_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r26_list"></span><span class="psale money" data-price-sale data-copy="db_r26_sale"></span></li>
              <li class="prow" data-price-row="9_diet:27"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r27_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r27_list"></span><span class="psale money" data-price-sale data-copy="db_r27_sale"></span></li>
              <li class="prow" data-price-row="9_diet:28"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r28_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r28_list"></span><span class="psale money" data-price-sale data-copy="db_r28_sale"></span></li>
              <li class="prow" data-price-row="9_diet:29"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r29_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r29_list"></span><span class="psale money" data-price-sale data-copy="db_r29_sale"></span></li>
              <li class="prow" data-price-row="9_diet:30"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r30_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r30_list"></span><span class="psale money" data-price-sale data-copy="db_r30_sale"></span></li>
            </ul>
          </div>
        </div>
        <p class="vat"><span data-copy="db_vat"></span></p>
      </div>
    </section>

    <!-- 3 / 6 : prices 2-2 (continued), sheet rows 31-36 in sheet order (row 31 / 34 = products with their first option, rows 32-33 / 35-36 = options);
         row 37 (name-column work memo) = the footnote under the board -->
    <section class="card cp c3" data-card="3" aria-labelledby="db-t3">
      <img class="tex tex-flip" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <img class="dec cx-tw tw" src="assets/dec/spark-3.png" alt="" aria-hidden="true" width="220" height="220">
      <div class="cp-in">
        <header class="top"><span class="brand" data-copy="db_brand"></span><span class="period" data-copy="db_period"></span></header>
        <div class="cp-head">
          <p class="kicker" data-copy="db_p_kicker"></p>
          <h2 class="p-title" id="db-t3"><span class="pt-main" data-copy="db_p_title"></span><span class="pt-cont" data-copy="db_p_cont"></span></h2>
          <p class="p-lead" data-copy="db_p_lead3"></p>
        </div>
        <div class="seal s-board"><img class="seal-img" src="assets/dec/seal.png" alt="" aria-hidden="true" width="560" height="560"><p class="seal-tx"><span class="sl s1" data-copy="db_seal1"></span><span class="sl s2" data-copy="db_seal2"></span><span class="sl s3" data-copy="db_seal3"></span></p></div>
        <div class="pboard roomy">
          <div class="prod">
            <p class="prod-h"><span class="prod-n" data-copy="db_r31_head"></span></p>
            <ul class="prows opts">
              <li class="prow" data-price-row="9_diet:31"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r31_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r31_list"></span><span class="psale money" data-price-sale data-copy="db_r31_sale"></span></li>
              <li class="prow" data-price-row="9_diet:32"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r32_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r32_list"></span><span class="psale money" data-price-sale data-copy="db_r32_sale"></span></li>
              <li class="prow" data-price-row="9_diet:33"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r33_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r33_list"></span><span class="psale money" data-price-sale data-copy="db_r33_sale"></span></li>
            </ul>
          </div>
          <div class="prod">
            <p class="prod-h"><span class="prod-n" data-copy="db_r34_head"></span></p>
            <ul class="prows opts">
              <li class="prow" data-price-row="9_diet:34"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r34_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r34_list"></span><span class="psale money" data-price-sale data-copy="db_r34_sale"></span></li>
              <li class="prow" data-price-row="9_diet:35"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r35_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r35_list"></span><span class="psale money" data-price-sale data-copy="db_r35_sale"></span></li>
              <li class="prow" data-price-row="9_diet:36"><div class="pn"><p class="popt"><span class="pplus" data-copy="db_r36_opt"></span></p></div><span class="plist money" data-price-list data-copy="db_r36_list"></span><span class="psale money" data-price-sale data-copy="db_r36_sale"></span></li>
            </ul>
          </div>
        </div>
        <p class="fn" data-copy="db_fn37"></p>
        <p class="vat"><span data-copy="db_vat"></span></p>
      </div>
    </section>

    <!-- 4 / 6 : how to read the package lines (facts: v4/diet12b/REFERENCE_AND_PLAN.md). ONDA = real cut-out; units and energy kinds are HTML text boxes -->
    <section class="card cx c4" data-card="4" aria-labelledby="db-t4">
      <img class="tex" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <img class="dec cx-tw tw" src="assets/dec/spark-1.png" alt="" aria-hidden="true" width="220" height="220">
      <div class="cx-in">
        <header class="top solo"><span class="brand" data-copy="db_brand"></span></header>
        <div class="q-head">
          <p class="kicker" data-copy="db_c4_kicker"></p>
          <h2 class="q-title" id="db-t4" data-copy="db_c4_q"></h2>
          <p class="q-ans" data-copy="db_c4_a"></p>
        </div>
        <div class="dev">
          <figure class="dev-img"><img src="assets/products/onda.webp" data-alt="db_alt_onda" alt="" width="430" height="900"></figure>
          <div class="dev-tx">
            <p class="dev-k" data-copy="db_c4_dev_k"></p>
            <h3 class="dev-n"><span data-copy="db_c4_dev_n"></span><span class="dev-e" data-copy="db_c4_dev_e"></span></h3>
            <ul class="facts">
              <li><span class="fdot" aria-hidden="true"></span><span data-copy="db_c4_f1"></span></li>
              <li><span class="fdot" aria-hidden="true"></span><span data-copy="db_c4_f2"></span></li>
              <li><span class="fdot" aria-hidden="true"></span><span data-copy="db_c4_f3"></span></li>
            </ul>
          </div>
        </div>
        <ul class="units">
          <li class="un"><span class="un-k" data-copy="db_c4_u1_k"></span><span class="un-n" data-copy="db_c4_u1_n"></span><span class="un-d" data-copy="db_c4_u1_d"></span></li>
          <li class="un"><span class="un-k" data-copy="db_c4_u2_k"></span><span class="un-n" data-copy="db_c4_u2_n"></span><span class="un-d" data-copy="db_c4_u2_d"></span></li>
          <li class="un"><span class="un-k" data-copy="db_c4_u3_k"></span><span class="un-n" data-copy="db_c4_u3_n"></span><span class="un-d" data-copy="db_c4_u3_d"></span></li>
          <li class="un"><span class="un-k" data-copy="db_c4_u4_k"></span><span class="un-n" data-copy="db_c4_u4_n"></span><span class="un-d" data-copy="db_c4_u4_d"></span></li>
          <li class="un"><span class="un-k" data-copy="db_c4_u5_k"></span><span class="un-n" data-copy="db_c4_u5_n"></span><span class="un-d" data-copy="db_c4_u5_d"></span></li>
        </ul>
        <ul class="energy">
          <li class="en"><span class="en-k" data-copy="db_c4_e1_k"></span><span class="en-d" data-copy="db_c4_e1_d"></span></li>
          <li class="en"><span class="en-k" data-copy="db_c4_e2_k"></span><span class="en-d" data-copy="db_c4_e2_d"></span></li>
          <li class="en"><span class="en-k" data-copy="db_c4_e3_k"></span><span class="en-d" data-copy="db_c4_e3_d"></span></li>
        </ul>
        <div class="pick"><img class="pick-ico" src="assets/icons/plan.webp" alt="" aria-hidden="true" width="192" height="192"><div><p class="pick-t" data-copy="db_c4_pick_t"></p><p class="pick-d" data-copy="db_c4_pick_d"></p></div></div>
        <p class="src" data-copy="db_c4_src"></p>
      </div>
    </section>

    <!-- 5 / 6 : the treatment day (four steps with generated icons, treatment info, care; arch photo = slot M2, a different frame of the same session) -->
    <section class="card cx c5" data-card="5" aria-labelledby="db-t5">
      <img class="tex tex-flip" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <img class="dec c5-tw tw" src="assets/dec/spark-2.png" alt="" aria-hidden="true" width="220" height="220">
      <div class="cx-in">
        <header class="top solo"><span class="brand" data-copy="db_brand"></span></header>
        <div class="day-head">
          <div class="q-head">
            <p class="kicker" data-copy="db_c5_kicker"></p>
            <h2 class="q-title" id="db-t5" data-copy="db_c5_q"></h2>
            <p class="q-ans" data-copy="db_c5_a"></p>
          </div>
          <figure class="arch"><img src="assets/model-c5.jpg?v=a" data-alt="db_alt_c5" alt="" width="600" height="750"></figure>
        </div>
        <ol class="steps">
          <li class="st"><img class="st-ico" src="assets/icons/consult.webp" alt="" aria-hidden="true" width="192" height="192"><div><h3 class="st-t" data-copy="db_c5_s1_t"></h3><p class="st-d" data-copy="db_c5_s1_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/plan.webp" alt="" aria-hidden="true" width="192" height="192"><div><h3 class="st-t" data-copy="db_c5_s2_t"></h3><p class="st-d" data-copy="db_c5_s2_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/wave.webp" alt="" aria-hidden="true" width="192" height="192"><div><h3 class="st-t" data-copy="db_c5_s3_t"></h3><p class="st-d" data-copy="db_c5_s3_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/calendar.webp" alt="" aria-hidden="true" width="192" height="192"><div><h3 class="st-t" data-copy="db_c5_s4_t"></h3><p class="st-d" data-copy="db_c5_s4_d"></p></div></li>
        </ol>
        <ul class="infos">
          <li class="inf"><span class="inf-k" data-copy="db_c5_i1_k"></span><span class="inf-v" data-copy="db_c5_i1_v"></span><span class="inf-n" data-copy="db_c5_i1_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="db_c5_i2_k"></span><span class="inf-v" data-copy="db_c5_i2_v"></span><span class="inf-n" data-copy="db_c5_i2_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="db_c5_i3_k"></span><span class="inf-v" data-copy="db_c5_i3_v"></span><span class="inf-n" data-copy="db_c5_i3_n"></span></li>

        <ul class="care">
          <li class="care-t" data-copy="db_c5_care_t"></li>
          <li><span class="cdot" aria-hidden="true"></span><span data-copy="db_c5_care1"></span></li>

          <li><span class="cdot" aria-hidden="true"></span><span data-copy="db_c5_care3"></span></li>
          <li><span class="cdot" aria-hidden="true"></span><span data-copy="db_c5_care4"></span></li>
        </ul>
        <p class="src" data-copy="db_c5_src"></p>
      </div>
    </section>

    <!-- 6 / 6 : clinic intro, the V4 bento grid (same content and order as oligio12 / FV12 / ligament12 / oneday12 / combo12e) in this page's tone; icons = generated set (slot G1) -->
    <section class="card cx c6" data-card="6" aria-labelledby="db-t6">
      <img class="tex" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <div class="cx-in">
        <header class="top solo"><span class="brand" data-copy="db_brand"></span></header>
        <div class="bento">
          <div class="bt bt-about">
            <div class="ab-top">
              <div class="ab-intro">
                <p class="bt-k" data-copy="db_ab_kicker"></p>
                <h2 class="ab-title" id="db-t6" data-copy="db_ab_title"></h2>
                <p class="ab-lead"><span data-copy="db_ab_intro1"></span><span data-copy="db_ab_intro2"></span></p>
              </div>
              <figure class="dr">
                <figcaption class="dr-tx"><span class="dr-name" data-copy="db_ab_dr_name"></span><span class="dr-quote" data-copy="db_ab_dr_quote"></span></figcaption>
                <img class="dr-img" src="assets/director-lee.webp?v=a" data-alt="db_alt_director" alt="" width="640" height="640">

            </div>
            <div class="ab-photos">
              <figure><img src="assets/hp-reception.jpg?v=a" data-alt="db_alt_ph1" alt="" width="960" height="450"><figcaption data-copy="db_ab_ph1"></figcaption></figure>
              <figure><img src="assets/hp-care.png?v=a" data-alt="db_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="db_ab_ph2"></figcaption></figure>
              <figure><img src="assets/hp-treatment.jpg?v=a" data-alt="db_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="db_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><img class="si" src="assets/icons/genuine.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="db_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="db_ab_s1_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/consult.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="db_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="db_ab_s2_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/hours.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="db_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="db_ab_s3_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/language.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="db_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="db_ab_s4_d"></span></li>
            </ul>
          </div>
          <!-- B: directions. The Google Maps capture is shown untouched (Google marker, logo and attribution inside the image); one file per width tier. -->
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="db_ab_loc"></p><h3 class="bt-t" data-copy="db_ab_loc_title"></h3></div>
            <div class="loc-body">
              <figure class="map">
                <picture>
                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="db_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <img class="way-pin" src="assets/icons/pin.webp" alt="" aria-hidden="true" width="192" height="192">
                <div class="way-tx">
                  <p class="way-top"><span class="way-st" data-copy="db_ab_way_station"></span><span class="way-line" data-copy="db_ab_way_line"></span></p>
                  <p class="way-addr"><span data-copy="db_ab_way_addr"></span><span class="way-desk"><span data-copy="db_ab_way_desk"></span></span></p>
                </div>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="db_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="db_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="db_ab_h1"></li><li data-copy="db_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="db_ab_h3"></p>
          </div>
          <div class="bt bt-book">
            <p class="bt-k" data-copy="db_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="db_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="db_alt_qr" alt="" width="424" height="424"><figcaption data-copy="db_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="db_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="db_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><img class="ico ico-phone" src="assets/icons/phone.webp" alt="" aria-hidden="true" width="192" height="192"><a data-link="phone"><span data-copy="db_ab_phone"></span></a></p>
              </div>
            </div>
            <span class="bk-mark" data-copy="db_brand"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- notes under the cards (not a card) -->
    <section class="notes" aria-labelledby="db-notes">
      <h2 id="db-notes"><img class="notes-ico" src="assets/icons/genuine.webp" alt="" aria-hidden="true" width="192" height="192"><span data-copy="db_note_title"></span></h2>
      <ul>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="db_cond1"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="db_cond2"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="db_cond3"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="db_cond4"></span></li>
        <li data-optional-group><span class="dot" aria-hidden="true"></span><span data-copy="db_cond5" data-optional data-placeholder="추가 안내 (예: 대상·조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
