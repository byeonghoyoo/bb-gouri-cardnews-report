<!-- CRF12 세르프 · 겨울 시즌 (Korean first). Team colour pin (sheet I34): Stalactite Brown #D5C4A6, Gretchin Green #5C6532, Chrysanthemum #C75256, Mythical Wine #730A16, Darkest Dungeon #6A040F.
     Every picture is a generated image (v4/cerf12/gen/*.json -> v4/cerf12/a -> gen/cut-assets.cjs): linen textures, satin ribbon, gift tag, rosette seal, plate, sparks, icons, the skin cross-section.
     Devices are real cutouts (v3/products). The B/A photos come from v4/_shared/ba/winter-ba-9/serf as they are. No inline SVG.
     Seven 1080x1350 cards (section[data-card="1..7"]); every word is editable copy (data-copy, ../inline-edit.js, aptos-* board messages).
     Price rows: data-price-row="11_lifting:<sheet row>" with [data-price-list] / [data-price-sale]; the strings come from v4/events/_data/pages.json via v4/cerf12/build-cerf12.cjs.
     Team memo D34 (gift): one band per price card + a gift mark on every row with 600+ XERF shots, all outside the data-price-* elements. -->

      <img class="spark k10" src="assets/dec/spark-cream.webp" alt="" aria-hidden="true"><img class="spark k11" src="assets/dec/spark-coral.webp" alt="" aria-hidden="true">
      <div class="c5-in">
        <header class="top solo"><span class="brand" data-copy="cf_brand"></span></header>
        <div class="c5-headrow">
          <div class="q-head">
            <p class="kicker" data-copy="cf_c5_kicker"></p>
            <h2 class="q-title" id="cf-t5" data-copy="cf_c5_q"></h2>
            <p class="q-ans" data-copy="cf_c5_a"></p>
          </div>
          <figure class="c5-photo"><img src="assets/model-day.jpg?v=a" data-alt="cf_alt_day" alt="" width="640" height="640"></figure>
        </div>
        <div class="who">
          <p class="who-lbl" data-copy="cf_c5_who_lbl"></p>
          <ul class="who-row">
            <li class="who-it"><span class="who-k" data-copy="cf_c5_w1_k"></span><span class="who-v" data-copy="cf_c5_w1_v"></span></li>
            <li class="who-it"><span class="who-k" data-copy="cf_c5_w2_k"></span><span class="who-v" data-copy="cf_c5_w2_v"></span></li>
            <li class="who-it"><span class="who-k" data-copy="cf_c5_w3_k"></span><span class="who-v" data-copy="cf_c5_w3_v"></span></li>
          </ul>
        </div>
        <ol class="steps">
          <li class="st"><span class="st-num" aria-hidden="true"></span><img class="st-ico" src="assets/icons/ic-consult.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="cf_c5_s1_t"></h3><p class="st-d" data-copy="cf_c5_s1_d"></p></div></li>
          <li class="st"><span class="st-num" aria-hidden="true"></span><img class="st-ico" src="assets/icons/ic-check.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="cf_c5_s2_t"></h3><p class="st-d" data-copy="cf_c5_s2_d"></p></div></li>
          <li class="st"><span class="st-num" aria-hidden="true"></span><img class="st-ico" src="assets/icons/ic-snow.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="cf_c5_s3_t"></h3><p class="st-d" data-copy="cf_c5_s3_d"></p></div></li>
          <li class="st"><span class="st-num" aria-hidden="true"></span><img class="st-ico" src="assets/icons/ic-heart.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="cf_c5_s4_t"></h3><p class="st-d" data-copy="cf_c5_s4_d"></p></div></li>
        </ol>
        <ul class="infos">
          <li class="inf"><span class="inf-k" data-copy="cf_c5_i1_k"></span><span class="inf-v" data-copy="cf_c5_i1_v"></span><span class="inf-n" data-copy="cf_c5_i1_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="cf_c5_i2_k"></span><span class="inf-v" data-copy="cf_c5_i2_v"></span><span class="inf-n" data-copy="cf_c5_i2_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="cf_c5_i3_k"></span><span class="inf-v" data-copy="cf_c5_i3_v"></span><span class="inf-n" data-copy="cf_c5_i3_n"></span></li>
        </ul>
        <p class="c5-combo" data-copy="cf_c5_combo"></p>
        <div class="c5-foot">
          <p class="c5-tip"><img class="tip-ico" src="assets/icons/ic-consult.webp" alt="" aria-hidden="true"><span data-copy="cf_c5_tip"></span></p>
          <p class="c5-tip"><img class="tip-ico" src="assets/icons/ic-sun.webp" alt="" aria-hidden="true"><span data-copy="cf_c5_care"></span></p>
        </div>
        <p class="src" data-copy="cf_c5_src"></p>
      </div>
    </section>

    <!-- 7 / 7 : clinic intro, the V4 bento grid (same content and order as oligio12 / FV12 / onda12 / ulthera12 / sofwave12) in this page's wine / linen / olive tone -->
    <section class="card c6" data-card="7" aria-labelledby="cf-t6">
      <img class="tex" src="assets/tex/wine.jpg" alt="" aria-hidden="true">
      <div class="cx-in">
        <header class="top solo"><span class="brand" data-copy="cf_brand"></span></header>
        <div class="bento">
          <div class="bt bt-about">
            <div class="ab-top">
              <div class="ab-intro">
                <p class="bt-k" data-copy="cf_ab_kicker"></p>
                <h2 class="ab-title" id="cf-t6" data-copy="cf_ab_title"></h2>
                <p class="ab-lead"><span data-copy="cf_ab_intro1"></span><span data-copy="cf_ab_intro2"></span></p>
              </div>
              <figure class="dr">
                <figcaption class="dr-tx"><span class="dr-name" data-copy="cf_ab_dr_name"></span><span class="dr-quote" data-copy="cf_ab_dr_quote"></span></figcaption>
                <img class="dr-img" src="assets/director-lee.webp?v=a" data-alt="cf_alt_director" alt="" width="640" height="640">
              </figure>
            </div>
            <div class="ab-photos">
              <figure class="ph-w"><img src="assets/hp-reception.jpg?v=a" data-alt="cf_alt_ph1" alt="" width="960" height="450"><figcaption data-copy="cf_ab_ph1"></figcaption></figure>
              <figure class="ph-n"><img src="assets/hp-care.png?v=a" data-alt="cf_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="cf_ab_ph2"></figcaption></figure>
              <figure class="ph-w"><img src="assets/hp-treatment.jpg?v=a" data-alt="cf_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="cf_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><img class="si" src="assets/icons/ic-shield.webp" alt="" aria-hidden="true"><span class="at" data-copy="cf_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="cf_ab_s1_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-consult.webp" alt="" aria-hidden="true"><span class="at" data-copy="cf_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="cf_ab_s2_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-clock.webp" alt="" aria-hidden="true"><span class="at" data-copy="cf_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="cf_ab_s3_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-globe.webp" alt="" aria-hidden="true"><span class="at" data-copy="cf_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="cf_ab_s4_d"></span></li>
            </ul>
          </div>
          <!-- B: directions. The Google Maps capture is shown untouched (Google marker, logo and attribution inside the image); one file per width tier. -->
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="cf_ab_loc"></p><h3 class="bt-t" data-copy="cf_ab_loc_title"></h3></div>
            <div class="loc-body">
              <figure class="map">
                <picture>
                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="cf_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <img class="way-pin" src="assets/icons/ic-pin.webp" alt="" aria-hidden="true">
                <div class="way-tx">
                  <p class="way-top"><span class="way-st" data-copy="cf_ab_way_station"></span><span class="way-line" data-copy="cf_ab_way_line"></span></p>
                  <p class="way-addr"><span data-copy="cf_ab_way_addr"></span><span class="way-desk"><span data-copy="cf_ab_way_desk"></span></span></p>
                </div>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="cf_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="cf_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="cf_ab_h1"></li><li data-copy="cf_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="cf_ab_h3"></p>
          </div>
          <div class="bt bt-book">
            <p class="bt-k" data-copy="cf_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="cf_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="cf_alt_qr" alt="" width="424" height="424"><figcaption data-copy="cf_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="cf_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="cf_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><img class="ph-ico" src="assets/icons/ic-phone.webp" alt="" aria-hidden="true"><a data-link="phone"><span data-copy="cf_ab_phone"></span></a></p>
              </div>
            </div>
            <span class="bk-mark" data-copy="cf_brand"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- notes under the cards (not a card) -->
    <section class="notes" aria-labelledby="cf-notes">
