          <p class="kicker" data-copy="od_c4_kicker"></p>
          <h2 class="q-title" id="od-t4" data-copy="od_c4_q"></h2>
          <p class="q-ans" data-copy="od_c4_a"></p>
        </div>
        <div class="c4-mid">
          <figure class="layers">
            <img class="layers-art" src="assets/c4/layers.webp" data-alt="od_alt_layers" alt="" width="1000" height="1000">
            <img class="hp hp-l" src="assets/c4/hp-left-t.webp" data-alt="od_alt_hp" alt="" width="207" height="390">
            <img class="hp hp-r" src="assets/c4/hp-right-t.webp" alt="" aria-hidden="true" width="206" height="389">
            <span class="ll l-shallow" data-copy="od_c4_d_shallow"></span>
            <span class="ll l-deep" data-copy="od_c4_d_deep"></span>
            <span class="ll l-cool"><img class="ll-ico" src="assets/dec/snow-corn.webp" alt="" aria-hidden="true"><span data-copy="od_c4_d_cool"></span></span>
            <span class="ll l-surface" data-copy="od_c4_d_surface"></span>
            <span class="ll l-dermis" data-copy="od_c4_d_dermis"></span>
            <span class="ll l-fat" data-copy="od_c4_d_fat"></span>
          </figure>
          <ol class="points">
            <li class="pt"><span class="pt-n" aria-hidden="true">1</span><div class="pt-tx"><h3 class="pt-t" data-copy="od_c4_p1_t"></h3><p class="pt-d" data-copy="od_c4_p1_d"></p></div></li>
            <li class="pt"><span class="pt-n" aria-hidden="true">2</span><div class="pt-tx"><h3 class="pt-t" data-copy="od_c4_p2_t"></h3><p class="pt-d" data-copy="od_c4_p2_d"></p></div></li>
            <li class="pt"><span class="pt-n" aria-hidden="true">3</span><div class="pt-tx"><h3 class="pt-t" data-copy="od_c4_p3_t"></h3><p class="pt-d" data-copy="od_c4_p3_d"></p></div></li>
            <li class="pt"><span class="pt-n" aria-hidden="true">4</span><div class="pt-tx"><h3 class="pt-t" data-copy="od_c4_p4_t"></h3><p class="pt-d" data-copy="od_c4_p4_d"></p></div></li>
          </ol>
        </div>
        <div class="cmp">
          <h3 class="cmp-title" data-copy="od_c4_cmp_title"></h3>
          <ul class="cmp-row">
            <li class="cmp-it"><span class="cmp-t" data-copy="od_c4_e1_type"></span><span class="cmp-n" data-copy="od_c4_e1_name"></span></li>
            <li class="cmp-it"><span class="cmp-t" data-copy="od_c4_e2_type"></span><span class="cmp-n" data-copy="od_c4_e2_name"></span></li>
            <li class="cmp-it is-on"><span class="cmp-t" data-copy="od_c4_e3_type"></span><span class="cmp-n" data-copy="od_c4_e3_name"></span></li>
          </ul>
        </div>
        <p class="src" data-copy="od_c4_src"></p>
      </div>
    </section>

    <!-- 5 / 6 : the treatment day (a different cut of the same model: near-frontal, smiling, looking down; not the hero photo) -->
    <section class="card c5" data-card="5" aria-labelledby="od-t5">
      <div class="c5-in">
        <header class="top"><img class="wordmark" src="assets/logo-wordmark-112f55.png" alt="BEAUTY BLOSSOM" width="975" height="111"></header>
        <figure class="c5-photo"><img src="assets/day-g.jpg?v=a" data-alt="od_alt_c5" alt="" width="640" height="640"></figure>
        <div class="q-head">
          <p class="kicker" data-copy="od_c5_kicker"></p>
          <h2 class="q-title" id="od-t5" data-copy="od_c5_q"></h2>
          <p class="q-ans" data-copy="od_c5_a"></p>
        </div>
        <div class="who">
          <p class="who-lbl" data-copy="od_c5_who_lbl"></p>
          <ul class="who-row">
            <li class="who-it"><span class="who-k" data-copy="od_c5_w1_k"></span><span class="who-v" data-copy="od_c5_w1_v"></span></li>
            <li class="who-it"><span class="who-k" data-copy="od_c5_w2_k"></span><span class="who-v" data-copy="od_c5_w2_v"></span></li>
          </ul>
        </div>
        <ol class="steps">
          <li class="st"><span class="st-num" aria-hidden="true">01</span><img class="st-ico" src="assets/icons/ic-consult.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="od_c5_s1_t"></h3><p class="st-d" data-copy="od_c5_s1_d"></p></div></li>
          <li class="st"><span class="st-num" aria-hidden="true">02</span><img class="st-ico" src="assets/icons/ic-depth.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="od_c5_s2_t"></h3><p class="st-d" data-copy="od_c5_s2_d"></p></div></li>
          <li class="st"><span class="st-num" aria-hidden="true">03</span><img class="st-ico" src="assets/icons/ic-snow.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="od_c5_s3_t"></h3><p class="st-d" data-copy="od_c5_s3_d"></p></div></li>
          <li class="st"><span class="st-num" aria-hidden="true">04</span><img class="st-ico" src="assets/icons/ic-care.webp" alt="" aria-hidden="true"><div class="st-tx"><h3 class="st-t" data-copy="od_c5_s4_t"></h3><p class="st-d" data-copy="od_c5_s4_d"></p></div></li>
        </ol>
        <ul class="infos">
          <li class="inf"><img class="inf-ico" src="assets/icons/ic-clock.webp" alt="" aria-hidden="true"><span class="inf-k" data-copy="od_c5_i1_k"></span><span class="inf-v" data-copy="od_c5_i1_v"></span><span class="inf-n" data-copy="od_c5_i1_n"></span></li>
          <li class="inf"><img class="inf-ico" src="assets/icons/ic-heat.webp" alt="" aria-hidden="true"><span class="inf-k" data-copy="od_c5_i2_k"></span><span class="inf-v" data-copy="od_c5_i2_v"></span><span class="inf-n" data-copy="od_c5_i2_n"></span></li>
          <li class="inf"><img class="inf-ico" src="assets/icons/ic-calendar.webp" alt="" aria-hidden="true"><span class="inf-k" data-copy="od_c5_i3_k"></span><span class="inf-v" data-copy="od_c5_i3_v"></span><span class="inf-n" data-copy="od_c5_i3_n"></span></li>
        </ul>
        <p class="c5-tip"><img class="tip-spark" src="assets/dec/spark-red.webp" alt="" aria-hidden="true"><span data-copy="od_c5_tip"></span></p>
        <p class="src" data-copy="od_c5_src"></p>
      </div>
    </section>

    <!-- 6 / 6 : clinic intro, the V4 bento grid (same content and order as oligio12 / aptos12 / FV12) on the deep winter sky -->
    <section class="card c6" data-card="6" aria-labelledby="od-t6">
      <div class="cx-in">
        <header class="top"><img class="wordmark" src="assets/logo-wordmark-fff8e7.png" alt="BEAUTY BLOSSOM" width="975" height="111"></header>
        <div class="bento">
          <div class="bt bt-about">
            <div class="ab-top">
              <div class="ab-intro">
                <p class="bt-k" data-copy="od_ab_kicker"></p>
                <h2 class="ab-title" id="od-t6" data-copy="od_ab_title"></h2>
                <p class="ab-lead"><span data-copy="od_ab_intro1"></span><span data-copy="od_ab_intro2"></span></p>
              </div>
              <figure class="dr">
                <figcaption class="dr-tx"><span class="dr-name" data-copy="od_ab_dr_name"></span><span class="dr-quote" data-copy="od_ab_dr_quote"></span></figcaption>
                <img class="dr-img" src="assets/director-lee.webp?v=a" data-alt="od_alt_director" alt="" width="640" height="640">
              </figure>
            </div>
            <div class="ab-photos">
              <figure class="ph-w"><img src="assets/hp-reception.jpg?v=a" data-alt="od_alt_ph1" alt="" width="960" height="450"><figcaption data-copy="od_ab_ph1"></figcaption></figure>
              <figure class="ph-n"><img src="assets/hp-care.png?v=a" data-alt="od_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="od_ab_ph2"></figcaption></figure>
              <figure class="ph-w"><img src="assets/hp-treatment.jpg?v=a" data-alt="od_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="od_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><img class="si" src="assets/icons/ic-genuine.webp" alt="" aria-hidden="true"><span class="at" data-copy="od_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="od_ab_s1_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-consult.webp" alt="" aria-hidden="true"><span class="at" data-copy="od_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="od_ab_s2_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-evening.webp" alt="" aria-hidden="true"><span class="at" data-copy="od_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="od_ab_s3_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/ic-globe.webp" alt="" aria-hidden="true"><span class="at" data-copy="od_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="od_ab_s4_d"></span></li>
            </ul>
          </div>
          <!-- B: directions. The Google Maps capture is shown untouched (Google marker, logo and attribution inside the image); one file per width tier. -->
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="od_ab_loc"></p><h3 class="bt-t" data-copy="od_ab_loc_title"></h3></div>
            <div class="loc-body">
              <figure class="map">
                <picture>
                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="od_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <img class="way-pin" src="assets/icons/ic-pin.webp" alt="" aria-hidden="true">
                <div class="way-tx">
                  <p class="way-top"><span class="way-st" data-copy="od_ab_way_station"></span><span class="way-line" data-copy="od_ab_way_line"></span></p>
                  <p class="way-addr"><span data-copy="od_ab_way_addr"></span><span class="way-desk"><span data-copy="od_ab_way_desk"></span></span></p>
                </div>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="od_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="od_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="od_ab_h1"></li><li data-copy="od_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="od_ab_h3"></p>
          </div>
          <div class="bt bt-book">
            <p class="bt-k" data-copy="od_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="od_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="od_alt_qr" alt="" width="424" height="424"><figcaption data-copy="od_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="od_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="od_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><img class="ph-ico" src="assets/icons/ic-phone.webp" alt="" aria-hidden="true"><a data-link="phone"><span data-copy="od_ab_phone"></span></a></p>
              </div>
            </div>
            <img class="wordmark" src="assets/logo-wordmark-fff8e7.png" alt="BEAUTY BLOSSOM" width="975" height="111">
          </div>
        </div>
      </div>
    </section>

    <!-- notes under the cards (not a card) -->
    <section class="notes" aria-labelledby="od-notes">
      <h2 id="od-notes"><span data-copy="od_note_title"></span></h2>
      <ul>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="od_cond1"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="od_cond2"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="od_cond3"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="od_cond_ba"></span></li>
        <li data-optional-group><span class="dot" aria-hidden="true"></span><span data-copy="od_cond4" data-optional data-placeholder="추가 안내 (예: 대상·조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
