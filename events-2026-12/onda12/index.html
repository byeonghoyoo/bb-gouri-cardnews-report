            <li class="pt"><span class="pt-n" aria-hidden="true">3</span><div class="pt-tx"><h3 class="pt-t" data-copy="od_c4_p3_t"></h3><p class="pt-d" data-copy="od_c4_p3_d"></p></div></li>
            <li class="pt"><span class="pt-n" aria-hidden="true">4</span><div class="pt-tx"><h3 class="pt-t" data-copy="od_c4_p4_t"></h3><p class="pt-d" data-copy="od_c4_p4_d"></p></div></li>

      <div class="snow" aria-hidden="true"></div>
      <i class="spark sp-w k9" aria-hidden="true"></i><i class="spark sp-w k10" aria-hidden="true"></i>

        <header class="top solo"><span class="brand" data-copy="od_brand"></span></header>

            <p class="kicker" data-copy="od_c5_kicker"></p>
            <h2 class="q-title" id="od-t5" data-copy="od_c5_q"></h2>
            <p class="q-ans" data-copy="od_c5_a"></p>
          </div>
          <figure class="c5-photo"><img src="assets/model-c5.jpg?v=a" data-alt="od_alt_c5" alt="" width="640" height="640"></figure>

          <li class="inf"><span class="inf-k" data-copy="od_c5_i2_k"></span><span class="inf-v" data-copy="od_c5_i2_v"></span><span class="inf-n" data-copy="od_c5_i2_n"></span></li>

                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="od_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <svg class="way-pin" viewBox="0 0 40 50" aria-hidden="true" focusable="false"><path d="M20 2C10.1 2 2 9.9 2 19.6 2 32.8 20 48 20 48S38 32.8 38 19.6C38 9.9 29.9 2 20 2z" stroke-width="2.4"/><circle cx="20" cy="19.5" r="6.5"/></svg>

            <h3 class="bt-t" data-copy="od_ab_hours_lbl"></h3>

                <p class="bk-phone"><svg class="ph-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 3.5l3 3.1-1.8 2.6a13.5 13.5 0 0 0 7 7l2.6-1.8 3.1 3-1.7 3.1c-.4.7-1.2 1-2 .9C10 20.7 3.3 14 2.6 7.2c-.1-.8.2-1.6.9-2z" fill="currentColor"/></svg><a data-link="phone"><span data-copy="od_ab_phone"></span></a></p>

            </div>
            <span class="bk-mark" data-copy="od_brand"></span>
          </div>
        </div>
      </div>

  </div>
