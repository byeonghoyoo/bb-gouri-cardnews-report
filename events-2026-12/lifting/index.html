<!doctype html>
<html lang="ko" data-locale="KO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>연말엔 리프팅도 페어링으로 · BEAUTY BLOSSOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link id="locale-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&amp;family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,500&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;display=swap">
<link rel="stylesheet" href="lifting.css?v=20261029-lifting3">
<script src="copy-data.js?v=20261029-lifting3" defer></script>
<script src="../inline-edit.js?v=20261029-lifting3" defer></script>
<script src="lifting.js?v=20261029-lifting3" defer></script>
</head>
<body>
<main class="lf" id="lf">
<div class="sheet">

  <!-- 1. HERO -->
  <section class="hero" aria-labelledby="hero-type">
    <div class="hero-top">
      <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
      <span class="kicker" data-copy="lf_kicker"></span>
    </div>
    <p class="hero-dec"><img class="type-img t-dec" src="assets/miri/type_december.webp" alt="December"></p>
    <h1 class="hero-type" id="hero-type"><img class="type-img t-pair" src="assets/miri/type_pairing_course.webp" alt="Pairing Course"><img class="deco spark sp1" src="assets/miri/sparkle_gold.webp" alt=""></h1>
    <p class="hero-title"><span data-copy="lf_title"></span> <em data-copy="lf_title_em"></em></p>
    <div class="hero-pills" data-optional-group>
      <span class="pill" data-copy="lf_period" data-optional data-placeholder="기간 입력 (예: 12.1 – 12.31)"></span>
      <span class="pill" data-copy="lf_target" data-optional data-placeholder="대상·조건 입력"></span>
    </div>
    <div class="hero-stage">
      <figure class="arch">
        <img class="arch-photo" src="assets/hero.jpg" data-alt="lf_alt_hero" alt="" width="1000" height="1250">
      </figure>
      <div class="plate">
        <p class="plate-label" data-copy="lf_from_label"></p>
        <p class="price plate-price fit"><b data-copy="lf_from_price"></b><span class="unit" data-copy="lf_won"></span><span class="from" data-copy="lf_from"></span></p>
        <p class="plate-vat" data-copy="lf_vat"></p>
      </div>
    </div>
    <p class="hero-lead" data-copy="lf_lead"></p>
  </section>

  <!-- 2. WHY PAIRING: depth chart -->
  <section class="depth" aria-labelledby="why-title">
    <div class="why">
      <figure class="why-photo"><img src="assets/profile.jpg" data-alt="lf_alt_profile" alt="" width="900" height="1125"></figure>
      <div class="why-text">
        <p class="eyebrow">WHY PAIRING</p>
        <h2 class="sec-title" id="why-title" data-copy="lf_why_title"></h2>
        <img class="divider" src="assets/miri/divider_gold.webp" alt="">
        <p class="why-body" data-copy="lf_why_body"></p>
      </div>
    </div>

    <div class="chart">
      <div class="chart-head">
        <p class="ch-label" data-copy="lf_chart_label"></p>
        <p class="ch-cols"><span data-copy="lf_layer_dermis"></span><span data-copy="lf_layer_fat"></span><span data-copy="lf_layer_smas"></span></p>
      </div>
      <div class="dev">
        <figure class="dev-img"><img src="assets/dev-sofwave.webp" data-alt="lf_alt_sof" alt="" width="1000" height="1000"></figure>
        <p class="dev-name"><b data-copy="lf_d_sof_name"></b><span data-copy="lf_d_sof_tech"></span></p>
        <div class="track" aria-hidden="true"><i></i><i></i><i></i><span class="dot" style="--at:22%"></span></div>
        <p class="dev-depth" data-copy="lf_d_sof_depth"></p>
      </div>
      <div class="dev">
        <figure class="dev-img"><img src="assets/dev-thermage-flx.webp" data-alt="lf_alt_thm" alt="" width="1000" height="1000"></figure>
        <p class="dev-name"><b data-copy="lf_d_thm_name"></b><span data-copy="lf_d_thm_tech"></span></p>
        <div class="track" aria-hidden="true"><i></i><i></i><i></i><span class="bar" style="--from:4%;--to:38%"></span></div>
        <p class="dev-depth" data-copy="lf_d_thm_depth"></p>
      </div>
      <div class="dev">
        <figure class="dev-img"><img src="assets/dev-onda.webp" data-alt="lf_alt_ond" alt="" width="1000" height="1000"></figure>
        <p class="dev-name"><b data-copy="lf_d_ond_name"></b><span data-copy="lf_d_ond_tech"></span></p>
        <div class="track" aria-hidden="true"><i></i><i></i><i></i><span class="bar" style="--from:44%;--to:69%"></span></div>
        <p class="dev-depth" data-copy="lf_d_ond_depth"></p>
      </div>
      <div class="dev">
        <figure class="dev-img"><img src="assets/dev-ultherapy-prime.webp" data-alt="lf_alt_ult" alt="" width="1000" height="1000"></figure>
        <p class="dev-name"><b data-copy="lf_d_ult_name"></b><span data-copy="lf_d_ult_tech"></span></p>
        <div class="track" aria-hidden="true"><i></i><i></i><i></i><span class="line" style="--from:16%;--to:86%"></span><span class="dot" style="--at:16%"></span><span class="dot" style="--at:36%"></span><span class="dot big" style="--at:86%"></span></div>
        <p class="dev-depth" data-copy="lf_d_ult_depth"></p>
      </div>
      <p class="chart-note" data-copy="lf_chart_note"></p>
    </div>
  </section>

  <!-- 3. PAIRING MENU -->
  <section class="menu-sec" aria-labelledby="menu-title">
    <div class="menu-intro">
      <div class="menu-head">
        <p class="eyebrow">PAIRING MENU</p>
        <h2 class="sec-title" id="menu-title" data-copy="lf_menu_title"></h2>
        <p class="menu-lead" data-copy="lf_menu_lead"></p>
      </div>
      <figure class="menu-photo"><img src="assets/menu.jpg" data-alt="lf_alt_menu" alt="" width="900" height="1125"></figure>
    </div>

    <div class="card">
      <img class="deco corner c-tl" src="assets/miri/corner_gold.webp" alt="">
      <img class="deco corner c-tr" src="assets/miri/corner_gold.webp" alt="">
      <img class="deco corner c-bl" src="assets/miri/corner_gold.webp" alt="">
      <img class="deco corner c-br" src="assets/miri/corner_gold.webp" alt="">
      <div class="card-head">
        <p class="card-en">Pairing Menu</p>
        <img class="divider" src="assets/miri/divider_gold.webp" alt="">
      </div>
      <ol class="courses">
        <li class="course">
          <span class="no" aria-hidden="true">I</span>
          <div class="c-body">
            <div class="c-top"><h3 class="c-name" data-copy="lf_c1_name"></h3><i class="leader" aria-hidden="true"></i><p class="price c-price"><b data-copy="lf_c1_price"></b><span class="unit" data-copy="lf_won"></span></p></div>
            <p class="c-items" data-copy="lf_c1_items"></p>
            <p class="c-pair"><span class="pl" data-copy="lf_pair_label"></span><span class="pv" data-copy="lf_c1_pair"></span></p>
          </div>
        </li>
        <li class="course">
          <span class="no" aria-hidden="true">II</span>
          <div class="c-body">
            <div class="c-top"><h3 class="c-name" data-copy="lf_c2_name"></h3><i class="leader" aria-hidden="true"></i><p class="price c-price"><b data-copy="lf_c2_price"></b><span class="unit" data-copy="lf_won"></span></p></div>
            <p class="c-items" data-copy="lf_c2_items"></p>
            <p class="c-pair"><span class="pl" data-copy="lf_pair_label"></span><span class="pv" data-copy="lf_c2_pair"></span></p>
          </div>
        </li>
        <li class="course">
          <span class="no" aria-hidden="true">III</span>
          <div class="c-body">
            <div class="c-top"><h3 class="c-name" data-copy="lf_c3_name"></h3><i class="leader" aria-hidden="true"></i><p class="price c-price"><b data-copy="lf_c3_price"></b><span class="unit" data-copy="lf_won"></span></p></div>
            <p class="c-items"><span data-copy="lf_c3_items"></span><span class="tag" data-copy="lf_c3_extra"></span></p>
            <p class="c-pair"><span class="pl" data-copy="lf_pair_label"></span><span class="pv" data-copy="lf_c3_pair"></span></p>
          </div>
        </li>
        <li class="course">
          <span class="no" aria-hidden="true">IV</span>
          <div class="c-body">
            <div class="c-top"><h3 class="c-name" data-copy="lf_c4_name"></h3><i class="leader" aria-hidden="true"></i><p class="price c-price"><b data-copy="lf_c4_price"></b><span class="unit" data-copy="lf_won"></span></p></div>
            <p class="c-items"><span data-copy="lf_c4_items"></span><span class="tag" data-copy="lf_c4_extra"></span></p>
            <p class="c-pair"><span class="pl" data-copy="lf_pair_label"></span><span class="pv" data-copy="lf_c4_pair"></span></p>
          </div>
        </li>
      </ol>
      <p class="card-vat" data-copy="lf_vat"></p>
    </div>

    <div class="sig">
      <img class="deco spark sp2" src="assets/miri/sparkle_gold.webp" alt="">
      <p class="sig-type"><img class="type-img t-sig" src="assets/miri/type_signature.webp" alt="Signature"></p>
      <h3 class="sig-name" data-copy="lf_sig_name"></h3>
      <p class="sig-lead" data-copy="lf_sig_lead"></p>
      <p class="sig-items" data-copy="lf_sig_items"></p>
      <p class="c-pair sig-pair"><span class="pl" data-copy="lf_pair_label"></span><span class="pv" data-copy="lf_sig_pair"></span></p>
      <p class="price sig-price fit"><b data-copy="lf_sig_price"></b><span class="unit" data-copy="lf_won"></span></p>
      <p class="sig-vat" data-copy="lf_vat"></p>
    </div>
  </section>

  <!-- 4. Q&A -->
  <section class="qa" aria-labelledby="qa-title">
    <p class="eyebrow">BEFORE YOU CHOOSE</p>
    <h2 class="sec-title" id="qa-title" data-copy="lf_qa_title"></h2>
    <dl class="qas">
      <div class="qa-item"><dt><b>Q.</b><span data-copy="lf_q1"></span></dt><dd data-copy="lf_a1"></dd></div>
      <div class="qa-item"><dt><b>Q.</b><span data-copy="lf_q2"></span></dt><dd data-copy="lf_a2"></dd></div>
      <div class="qa-item"><dt><b>Q.</b><span data-copy="lf_q3"></span></dt><dd data-copy="lf_a3"></dd></div>
    </dl>
  </section>

  <!-- 5. RESERVATION -->
  <section class="rsv-sec" aria-labelledby="rsv-title">
    <div class="rsv">
      <img class="cloche" src="assets/miri/cloche_gold.webp" alt="">
      <p class="rsv-en">RESERVATION</p>
      <h2 class="rsv-title" id="rsv-title" data-copy="lf_rsv_title"></h2>
      <div class="rsv-body">
        <dl class="rsv-rows">
          <div class="rsv-row"><dt data-copy="lf_label_booking"></dt><dd><a data-link="booking" data-copy="lf_link_naver"></a><span class="sep">/</span><a data-link="kakao" data-copy="lf_link_kakao"></a></dd></div>
          <div class="rsv-row"><dt data-copy="lf_label_place"></dt><dd data-copy="lf_place"></dd></div>
          <div class="rsv-row"><dt data-copy="lf_label_phone"></dt><dd><a class="tel" data-link="phone" data-copy="lf_phone"></a></dd></div>
        </dl>
        <div class="rsv-qr">
          <img class="qr" src="assets/naver-booking-qr.png" alt="" width="424" height="424">
          <p class="qr-label" data-copy="lf_qr_label"></p>
        </div>
      </div>
    </div>
    <div class="cta">
      <a class="btn btn-naver" data-link="booking" data-copy="lf_cta_naver"></a>
      <a class="btn btn-kakao" data-link="kakao" data-copy="lf_cta_kakao"></a>
    </div>
  </section>

  <!-- 6. NOTICE + FOOTER -->
  <section class="notice">
    <h2 class="notice-title" data-copy="lf_notice_title"></h2>
    <ul>
      <li data-copy="lf_cond1"></li>
      <li data-copy="lf_cond2"></li>
      <li data-copy="lf_cond3"></li>
      <li data-copy="lf_cond4" data-optional data-placeholder="추가 안내 입력"></li>
    </ul>
  </section>
  <footer class="foot">
    <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
    <p><span data-copy="lf_place"></span><span class="sep">·</span><a data-link="phone" data-copy="lf_phone"></a></p>
  </footer>

</div>
</main>
</body>
</html>
