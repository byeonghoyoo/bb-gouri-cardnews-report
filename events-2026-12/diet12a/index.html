<body>
<!-- DIE12A 다이어트 · 지방분해주사 · 겨울 시즌 (Korean first). 다이어트 같은 주제 묶음(레퍼런스 시트 D50 '동일한 주제로 2페이지 구성')의 첫 페이지.
     Design language from sheet F (diet poster: model inside a thin white arch outline, date set vertically along the arch, a badge on the arch line,
     centred heavy two-line title with a pill line between, twinkle stars, water-light background). Palette from sheet H (#FFE1C6 · #FF7A00 · #1E3A8A ·
     #6B8F5E · #9EC5E8); this page weights light sky blue. Model = team photo G (same model for both pages of the bundle).
     Six 1080x1350 cards (section[data-card="1..6"]); every word is editable copy (data-copy, ../inline-edit.js, aptos-* board messages).
     Pictures: generated model photos (layout references; the lead replaces them in the same paths), generated icons / decorations / texture
     (v4/diet12a/gen, qa/image-attempts.json), real ONDA cut-out (v3/products), shared clinic files.
     Price rows: data-price-row="9_diet:<sheet row>" with [data-price-list] / [data-price-sale]; strings from v4/events/_data/pages.json via v4/diet12a/build-diet12a.cjs. -->
<main class="dt2 p-a">
  <div class="sheet">

    <!-- 1 / 6 : hero (F composition): full-bleed photo (slot M1, object-fit cover), arch outline, vertical date, badge on the arch line,
         title = the sheet event name in two lines with the hook pill between, price band (row 12, strings from the sheet) with VAT and phone -->
    <section class="card c1" data-card="1" aria-labelledby="da-t1">
      <img class="c1-photo" src="assets/hero.jpg?v=a" data-alt="da_alt_hero" alt="" width="1080" height="1350">
      <div class="c1-fade" aria-hidden="true"></div>
      <span class="arch-line" aria-hidden="true"></span>
      <img class="dec sp-h" src="assets/dec/sprig.png" alt="" aria-hidden="true" width="320" height="320">
      <img class="dec tw tw1" src="assets/dec/spark-1.png" alt="" aria-hidden="true" width="220" height="220">
      <img class="dec tw tw2" src="assets/dec/spark-2.png" alt="" aria-hidden="true" width="220" height="220">
      <img class="dec tw tw3" src="assets/dec/spark-3.png" alt="" aria-hidden="true" width="220" height="220">
      <header class="c1-top"><span class="brand" data-copy="da_brand"></span></header>
      <p class="h-period" data-copy="da_period"></p>
      <div class="seal s-hero"><img class="seal-img" src="assets/dec/seal.png" alt="" aria-hidden="true" width="560" height="560"><p class="seal-tx"><span class="sl s1" data-copy="da_seal1"></span><span class="sl s2" data-copy="da_seal2"></span><span class="sl s3" data-copy="da_seal3"></span></p></div>
      <div class="h-title">
        <h1 class="h-l1" id="da-t1" data-copy="da_title1"></h1>
        <p class="h-pill" data-copy="da_hook"></p>
        <p class="h-l2" data-copy="da_title2"></p>
      </div>
      <div class="h-band">
        <div class="hb">
          <p class="hb-top"><span class="hb-tag" data-copy="da_hb_tag"></span><span class="hb-name" data-copy="da_hb_name"></span><span class="hb-opt" data-copy="da_hb_opt"></span></p>
          <p class="hb-main"><span class="hb-list money" data-copy="da_hb_list"></span><span class="hb-sale money" data-copy="da_hb_sale"></span></p>
        </div>
        <div class="hb-side">
          <p class="hb-vat" data-copy="da_vat"></p>
          <p class="hb-contact"><img class="ico ico-phone" src="assets/icons/phone.webp" alt="" aria-hidden="true" width="192" height="192"><span data-copy="da_contact"></span></p>
        </div>
      </div>
    </section>

    <!-- 2 / 6 : prices 2-1, sheet rows 8-16 of 9_diet B7:K23 in sheet order (row 7 = table title; rows 8-9 = prescription lines under the title;
         row 10 = product; rows 12-16 = options of the group row 11) -->
    <section class="card cp c2" data-card="2" aria-labelledby="da-t2">
      <img class="tex" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <img class="dec cx-sn" src="assets/dec/snow-1.png" alt="" aria-hidden="true" width="220" height="220">
      <img class="dec cx-or" src="assets/dec/orange.png" alt="" aria-hidden="true" width="300" height="300">
      <div class="cp-in">
        <header class="top"><span class="brand" data-copy="da_brand"></span><span class="period" data-copy="da_period"></span></header>
        <div class="cp-head">
          <p class="kicker" data-copy="da_p_kicker"></p>
          <h2 class="p-title" id="da-t2"><span class="pt-main" data-copy="da_p_title"></span></h2>
          <p class="p-lead" data-copy="da_p_lead2"></p>
        </div>
        <div class="seal s-board"><img class="seal-img" src="assets/dec/seal.png" alt="" aria-hidden="true" width="560" height="560"><p class="seal-tx"><span class="sl s1" data-copy="da_seal1"></span><span class="sl s2" data-copy="da_seal2"></span><span class="sl s3" data-copy="da_seal3"></span></p></div>
        <div class="pboard mid">
          <div class="prod">
            <p class="prod-h"><span class="prod-n" data-copy="da_g_rx"></span><span class="prod-chip" data-copy="da_g_rx_chip"></span></p>
            <ul class="prows opts">
              <li class="prow" data-price-row="9_diet:8"><div class="pn"><p class="popt"><span data-copy="da_r8_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r8_list"></span><span class="psale money" data-price-sale data-copy="da_r8_sale"></span></li>
              <li class="prow" data-price-row="9_diet:9"><div class="pn"><p class="popt"><span data-copy="da_r9_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r9_list"></span><span class="psale money" data-price-sale data-copy="da_r9_sale"></span></li>
            </ul>
          </div>
          <div class="prod">
            <ul class="prows">
              <li class="prow" data-price-row="9_diet:10"><div class="pn"><p class="pname" data-copy="da_r10_name"></p><p class="psub pplus" data-copy="da_r10_sub"></p></div><span class="plist money" data-price-list data-copy="da_r10_list"></span><span class="psale money" data-price-sale data-copy="da_r10_sale"></span></li>
            </ul>
          </div>
          <div class="prod">
            <p class="prod-h"><span class="prod-n" data-copy="da_g11_name"></span></p>
            <ul class="prows opts cc">
              <li class="prow" data-price-row="9_diet:12"><div class="pn"><p class="popt"><span data-copy="da_r12_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r12_list"></span><span class="psale money" data-price-sale data-copy="da_r12_sale"></span></li>
              <li class="prow" data-price-row="9_diet:13"><div class="pn"><p class="popt"><span data-copy="da_r13_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r13_list"></span><span class="psale money" data-price-sale data-copy="da_r13_sale"></span></li>
              <li class="prow" data-price-row="9_diet:14"><div class="pn"><p class="popt"><span data-copy="da_r14_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r14_list"></span><span class="psale money" data-price-sale data-copy="da_r14_sale"></span></li>
              <li class="prow" data-price-row="9_diet:15"><div class="pn"><p class="popt"><span data-copy="da_r15_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r15_list"></span><span class="psale money" data-price-sale data-copy="da_r15_sale"></span></li>
              <li class="prow" data-price-row="9_diet:16"><div class="pn"><p class="popt"><span data-copy="da_r16_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r16_list"></span><span class="psale money" data-price-sale data-copy="da_r16_sale"></span></li>
            </ul>
            <p class="p-note" data-copy="da_cc_note"></p>
          </div>
        </div>
        <p class="vat"><span data-copy="da_vat"></span></p>
      </div>
    </section>

    <!-- 3 / 6 : prices 2-2 (continued), sheet rows 18-23 in sheet order (rows 18-22 = options of the group row 17; row 23 = product with its
         sheet note as a small footnote inside the price row element, outside [data-price-list]/[data-price-sale]) -->
    <section class="card cp c3" data-card="3" aria-labelledby="da-t3">
      <img class="tex tex-flip" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <img class="dec cx-tw tw" src="assets/dec/spark-3.png" alt="" aria-hidden="true" width="220" height="220">
      <div class="cp-in">
        <header class="top"><span class="brand" data-copy="da_brand"></span><span class="period" data-copy="da_period"></span></header>
        <div class="cp-head">
          <p class="kicker" data-copy="da_p_kicker"></p>
          <h2 class="p-title" id="da-t3"><span class="pt-main" data-copy="da_p_title"></span><span class="pt-cont" data-copy="da_p_cont"></span></h2>
          <p class="p-lead" data-copy="da_p_lead3"></p>
        </div>
        <div class="seal s-board"><img class="seal-img" src="assets/dec/seal.png" alt="" aria-hidden="true" width="560" height="560"><p class="seal-tx"><span class="sl s1" data-copy="da_seal1"></span><span class="sl s2" data-copy="da_seal2"></span><span class="sl s3" data-copy="da_seal3"></span></p></div>
        <div class="pboard roomy">
          <div class="prod">
            <p class="prod-h"><span class="prod-n" data-copy="da_g17_name"></span></p>
            <ul class="prows opts cc">
              <li class="prow" data-price-row="9_diet:18"><div class="pn"><p class="popt"><span data-copy="da_r18_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r18_list"></span><span class="psale money" data-price-sale data-copy="da_r18_sale"></span></li>
              <li class="prow" data-price-row="9_diet:19"><div class="pn"><p class="popt"><span data-copy="da_r19_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r19_list"></span><span class="psale money" data-price-sale data-copy="da_r19_sale"></span></li>
              <li class="prow" data-price-row="9_diet:20"><div class="pn"><p class="popt"><span data-copy="da_r20_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r20_list"></span><span class="psale money" data-price-sale data-copy="da_r20_sale"></span></li>
              <li class="prow" data-price-row="9_diet:21"><div class="pn"><p class="popt"><span data-copy="da_r21_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r21_list"></span><span class="psale money" data-price-sale data-copy="da_r21_sale"></span></li>
              <li class="prow" data-price-row="9_diet:22"><div class="pn"><p class="popt"><span data-copy="da_r22_opt"></span></p></div><span class="plist money" data-price-list data-copy="da_r22_list"></span><span class="psale money" data-price-sale data-copy="da_r22_sale"></span></li>
            </ul>
          </div>
          <div class="prod">
            <p class="prod-h"><span class="prod-n" data-copy="da_r23_head"></span></p>
            <ul class="prows opts">
              <li class="prow" data-price-row="9_diet:23"><div class="pn"><p class="popt"><span class="otag" data-copy="da_r23_tag"></span><span class="pplus" data-copy="da_r23_opt"></span></p><p class="pnote" data-copy="da_r23_note"></p></div><span class="plist money" data-price-list data-copy="da_r23_list"></span><span class="psale money" data-price-sale data-copy="da_r23_sale"></span></li>
            </ul>
          </div>
        </div>
        <p class="vat"><span data-copy="da_vat"></span></p>
      </div>
    </section>

    <!-- 4 / 6 : what is in the table and how to choose (facts: v4/diet12a/REFERENCE_AND_PLAN.md). Icons = generated set (slot G1); ONDA = real cut-out -->
    <section class="card cx c4" data-card="4" aria-labelledby="da-t4">
      <img class="tex" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <img class="dec cx-tw tw" src="assets/dec/spark-1.png" alt="" aria-hidden="true" width="220" height="220">
      <div class="cx-in">
        <header class="top solo"><span class="brand" data-copy="da_brand"></span></header>
        <div class="q-head">
          <p class="kicker" data-copy="da_c4_kicker"></p>
          <h2 class="q-title" id="da-t4" data-copy="da_c4_q"></h2>
          <p class="q-ans" data-copy="da_c4_a"></p>
        </div>
        <ul class="kinds">
          <li class="kd"><img class="kd-ico" src="assets/icons/calendar.webp" alt="" aria-hidden="true" width="192" height="192"><div class="kd-tx"><p class="kd-k" data-copy="da_c4_k1_k"></p><h3 class="kd-t" data-copy="da_c4_k1_t"></h3><p class="kd-d" data-copy="da_c4_k1_d"></p></div></li>
          <li class="kd"><img class="kd-ico" src="assets/icons/drop.webp" alt="" aria-hidden="true" width="192" height="192"><div class="kd-tx"><p class="kd-k" data-copy="da_c4_k2_k"></p><h3 class="kd-t" data-copy="da_c4_k2_t"></h3><p class="kd-d" data-copy="da_c4_k2_d"></p></div></li>
          <li class="kd wide"><img class="kd-ico" src="assets/icons/cells.webp" alt="" aria-hidden="true" width="192" height="192"><div class="kd-tx"><p class="kd-k" data-copy="da_c4_k3_k"></p><h3 class="kd-t" data-copy="da_c4_k3_t"></h3><p class="kd-d" data-copy="da_c4_k3_d"></p>
            <ul class="vs"><li><span class="vs-n" data-copy="da_c4_v1_n"></span><span class="vs-d" data-copy="da_c4_v1_d"></span></li><li><span class="vs-n" data-copy="da_c4_v2_n"></span><span class="vs-d" data-copy="da_c4_v2_d"></span></li></ul></div></li>
          <li class="kd wide has-dev"><img class="kd-ico" src="assets/icons/wave.webp" alt="" aria-hidden="true" width="192" height="192"><div class="kd-tx"><p class="kd-k" data-copy="da_c4_k4_k"></p><h3 class="kd-t" data-copy="da_c4_k4_t"></h3><p class="kd-d" data-copy="da_c4_k4_d"></p></div>
            <figure class="kd-dev"><img src="assets/products/onda.webp" data-alt="da_alt_onda" alt="" width="430" height="900"></figure></li>
        </ul>
        <div class="pick"><img class="pick-ico" src="assets/icons/plan.webp" alt="" aria-hidden="true" width="192" height="192"><div><p class="pick-t" data-copy="da_c4_pick_t"></p><p class="pick-d" data-copy="da_c4_pick_d"></p></div></div>
        <p class="src" data-copy="da_c4_src"></p>
      </div>
    </section>

    <!-- 5 / 6 : the treatment day (four steps with generated icons, treatment info, care; arch photo = slot M2, a different frame of the same session) -->
    <section class="card cx c5" data-card="5" aria-labelledby="da-t5">
      <img class="tex tex-flip" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <img class="dec c5-tw tw" src="assets/dec/spark-2.png" alt="" aria-hidden="true" width="220" height="220">
      <div class="cx-in">
        <header class="top solo"><span class="brand" data-copy="da_brand"></span></header>
        <div class="day-head">
          <div class="q-head">
            <p class="kicker" data-copy="da_c5_kicker"></p>
            <h2 class="q-title" id="da-t5" data-copy="da_c5_q"></h2>
            <p class="q-ans" data-copy="da_c5_a"></p>
          </div>
          <figure class="arch"><img src="assets/model-c5.jpg?v=a" data-alt="da_alt_c5" alt="" width="600" height="770"></figure>
        </div>
        <ol class="steps">
          <li class="st"><img class="st-ico" src="assets/icons/consult.webp" alt="" aria-hidden="true" width="192" height="192"><div><h3 class="st-t" data-copy="da_c5_s1_t"></h3><p class="st-d" data-copy="da_c5_s1_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/plan.webp" alt="" aria-hidden="true" width="192" height="192"><div><h3 class="st-t" data-copy="da_c5_s2_t"></h3><p class="st-d" data-copy="da_c5_s2_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/drop.webp" alt="" aria-hidden="true" width="192" height="192"><div><h3 class="st-t" data-copy="da_c5_s3_t"></h3><p class="st-d" data-copy="da_c5_s3_d"></p></div></li>
          <li class="st"><img class="st-ico" src="assets/icons/care.webp" alt="" aria-hidden="true" width="192" height="192"><div><h3 class="st-t" data-copy="da_c5_s4_t"></h3><p class="st-d" data-copy="da_c5_s4_d"></p></div></li>
        </ol>
        <ul class="infos">
          <li class="inf"><span class="inf-k" data-copy="da_c5_i1_k"></span><span class="inf-v" data-copy="da_c5_i1_v"></span><span class="inf-n" data-copy="da_c5_i1_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="da_c5_i2_k"></span><span class="inf-v" data-copy="da_c5_i2_v"></span><span class="inf-n" data-copy="da_c5_i2_n"></span></li>
          <li class="inf"><span class="inf-k" data-copy="da_c5_i3_k"></span><span class="inf-v" data-copy="da_c5_i3_v"></span><span class="inf-n" data-copy="da_c5_i3_n"></span></li>
        </ul>
        <ul class="care">
          <li class="care-t" data-copy="da_c5_care_t"></li>
          <li><span class="cdot" aria-hidden="true"></span><span data-copy="da_c5_care1"></span></li>
          <li><span class="cdot" aria-hidden="true"></span><span data-copy="da_c5_care2"></span></li>
          <li><span class="cdot" aria-hidden="true"></span><span data-copy="da_c5_care3"></span></li>
          <li><span class="cdot" aria-hidden="true"></span><span data-copy="da_c5_care4"></span></li>
        </ul>
        <p class="src" data-copy="da_c5_src"></p>
      </div>
    </section>

    <!-- 6 / 6 : clinic intro, the V4 bento grid (same content and order as oligio12 / FV12 / ligament12 / oneday12 / combo12e) in this page's tone; icons = generated set (slot G1) -->
    <section class="card cx c6" data-card="6" aria-labelledby="da-t6">
      <img class="tex" src="assets/tex.jpg?v=a" alt="" aria-hidden="true" width="1080" height="1350">
      <div class="cx-in">
        <header class="top solo"><span class="brand" data-copy="da_brand"></span></header>
        <div class="bento">
          <div class="bt bt-about">
            <div class="ab-top">
              <div class="ab-intro">
                <p class="bt-k" data-copy="da_ab_kicker"></p>
                <h2 class="ab-title" id="da-t6" data-copy="da_ab_title"></h2>
                <p class="ab-lead"><span data-copy="da_ab_intro1"></span><span data-copy="da_ab_intro2"></span></p>
              </div>
              <figure class="dr">
                <figcaption class="dr-tx"><span class="dr-name" data-copy="da_ab_dr_name"></span><span class="dr-quote" data-copy="da_ab_dr_quote"></span></figcaption>
                <img class="dr-img" src="assets/director-lee.webp?v=a" data-alt="da_alt_director" alt="" width="640" height="640">
              </figure>
            </div>
            <div class="ab-photos">
              <figure><img src="assets/hp-reception.jpg?v=a" data-alt="da_alt_ph1" alt="" width="960" height="450"><figcaption data-copy="da_ab_ph1"></figcaption></figure>
              <figure><img src="assets/hp-care.png?v=a" data-alt="da_alt_ph2" alt="" width="600" height="280"><figcaption data-copy="da_ab_ph2"></figcaption></figure>
              <figure><img src="assets/hp-treatment.jpg?v=a" data-alt="da_alt_ph3" alt="" width="960" height="450"><figcaption data-copy="da_ab_ph3"></figcaption></figure>
            </div>
            <ul class="ab-strengths">
              <li><span class="sh"><img class="si" src="assets/icons/genuine.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="da_ab_s1_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="da_ab_s1_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/consult.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="da_ab_s2_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="da_ab_s2_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/hours.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="da_ab_s3_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="da_ab_s3_d"></span></li>
              <li><span class="sh"><img class="si" src="assets/icons/language.webp" alt="" aria-hidden="true" width="192" height="192"><span class="at" data-copy="da_ab_s4_t"></span><i class="dots" aria-hidden="true"></i></span><span class="ad" data-copy="da_ab_s4_d"></span></li>
            </ul>
          </div>
          <!-- B: directions. The Google Maps capture is shown untouched (Google marker, logo and attribution inside the image); one file per width tier. -->
          <div class="bt bt-loc">
            <div class="loc-head"><p class="bt-k" data-copy="da_ab_loc"></p><h3 class="bt-t" data-copy="da_ab_loc_title"></h3></div>
            <div class="loc-body">
              <figure class="map">
                <picture>
                  <source media="(max-width: 600px)" srcset="assets/gmap/gmap-oligio12-mob-KO.webp" width="332" height="200" data-gmap="mob">
                  <source media="(max-width: 1023px)" srcset="assets/gmap/gmap-oligio12-tab-KO.webp" width="384" height="355" data-gmap="tab">
                  <img class="map-img" src="assets/gmap/gmap-oligio12-desk-KO.webp" data-gmap="desk" data-alt="da_alt_map" alt="" width="460" height="425">
                </picture>
              </figure>
              <div class="way">
                <img class="way-pin" src="assets/icons/pin.webp" alt="" aria-hidden="true" width="192" height="192">
                <div class="way-tx">
                  <p class="way-top"><span class="way-st" data-copy="da_ab_way_station"></span><span class="way-line" data-copy="da_ab_way_line"></span></p>
                  <p class="way-addr"><span data-copy="da_ab_way_addr"></span><span class="way-desk"><span data-copy="da_ab_way_desk"></span></span></p>
                </div>
              </div>
            </div>
          </div>
          <div class="bt bt-hours">
            <p class="bt-k" data-copy="da_ab_hours_kicker"></p>
            <h3 class="bt-t" data-copy="da_ab_hours_lbl"></h3>
            <ul class="hrs"><li data-copy="da_ab_h1"></li><li data-copy="da_ab_h2"></li></ul>
            <p class="hrs-note" data-copy="da_ab_h3"></p>
          </div>
          <div class="bt bt-book">
            <p class="bt-k" data-copy="da_ab_bk_kicker"></p>
            <h3 class="bt-t" data-copy="da_ab_bk_title"></h3>
            <div class="bk-row">
              <figure class="qr"><img src="assets/naver-booking-qr.png" data-qr data-alt="da_alt_qr" alt="" width="424" height="424"><figcaption data-copy="da_ab_qr"></figcaption></figure>
              <div class="bk-text">
                <p class="bk-links"><a data-link="booking"><span data-copy="da_ab_bk_naver"></span></a><span class="bk-alt" data-bk-alt><span class="bk-sep" aria-hidden="true">/</span><a data-link="kakao"><span data-copy="da_ab_bk_kakao"></span></a></span></p>
                <p class="bk-phone"><img class="ico ico-phone" src="assets/icons/phone.webp" alt="" aria-hidden="true" width="192" height="192"><a data-link="phone"><span data-copy="da_ab_phone"></span></a></p>
              </div>
            </div>
            <span class="bk-mark" data-copy="da_brand"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- notes under the cards (not a card) -->
    <section class="notes" aria-labelledby="da-notes">
      <h2 id="da-notes"><img class="notes-ico" src="assets/icons/genuine.webp" alt="" aria-hidden="true" width="192" height="192"><span data-copy="da_note_title"></span></h2>
      <ul>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="da_cond1"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="da_cond2"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="da_cond3"></span></li>
        <li><span class="dot" aria-hidden="true"></span><span data-copy="da_cond4"></span></li>
        <li data-optional-group><span class="dot" aria-hidden="true"></span><span data-copy="da_cond5" data-optional data-placeholder="추가 안내 (예: 대상·조건)"></span></li>
      </ul>
    </section>

  </div>
</main>
</body>
</html>
