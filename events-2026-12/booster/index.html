<!doctype html>
<html lang="ko" data-locale="KO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>건조한 겨울, 피부에 한 잔 채워요 · BEAUTY BLOSSOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link id="locale-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;display=swap">
<link rel="stylesheet" href="booster.css?v=20261029-booster2">
<script src="copy-data.js?v=20261029-booster2" defer></script>
<script src="../inline-edit.js?v=20261029-booster2" defer></script>
<script src="booster.js?v=20261029-booster2" defer></script>
</head>
<body>
<main class="booster" id="booster">
<div class="sheet">

  <!-- 1. HERO · glow bar -->
  <section class="hero" aria-labelledby="hero-type">
    <div class="hero-bg" aria-hidden="true"><i class="ripple r1"></i><i class="ripple r2"></i><i class="ripple r3"></i></div>
    <header class="hero-top">
      <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
      <span class="kicker" data-copy="hero_kicker"></span>
    </header>
    <h1 class="hero-type" id="hero-type"><img class="type-img" src="assets/miri/type_glow_bar.webp" alt="GLOW BAR" data-miri="type_glow_bar"></h1>
    <p class="hero-head"><span class="hh1" data-copy="hero_line1"></span> <strong class="hh2" data-copy="hero_line2"></strong></p>
    <p class="hero-lead" data-copy="hero_lead"></p>
    <div class="hero-pills" data-optional-group>
      <span class="pill" data-copy="open_period" data-optional data-placeholder="기간 입력 (예: 12.1 – 12.31)"></span>
      <span class="pill pill-target" data-copy="open_target" data-optional data-placeholder="대상·조건 입력"></span>
    </div>

    <div class="hero-stage">
      <figure class="arch">
        <img class="arch-photo" src="assets/hero.jpg" data-alt="alt_main" alt="" width="1000" height="1250">
      </figure>
      <img class="deco glint g-a" src="assets/miri/glass_glint.webp" alt="" data-miri="glass_glint">
      <img class="deco glint g-b" src="assets/miri/glass_glint.webp" alt="" data-miri="glass_glint">
      <img class="deco hero-ice" src="assets/miri/ice_cubes.webp" alt="" data-miri="ice_cubes">

      <div class="board">
        <img class="deco board-drops" src="assets/miri/water_drops.webp" alt="" data-miri="water_drops">
        <p class="board-head"><span class="en">Glow Bar Menu</span><span class="board-title" data-copy="board_title"></span></p>
        <ul class="board-list">
          <li><span class="bi-name"><span data-copy="m1_name"></span> <span class="bi-size" data-copy="m1_size"></span></span><i class="lead"></i><span class="bi-price fit"><b data-copy="m1_price"></b><span class="unit" data-copy="won"></span></span></li>
          <li><span class="bi-name"><span data-copy="m2_name"></span> <span class="bi-size" data-copy="m2_size"></span></span><i class="lead"></i><span class="bi-price fit"><b data-copy="m2_price"></b><span class="unit" data-copy="won"></span></span></li>
          <li><span class="bi-name"><span data-copy="m3_name"></span> <span class="bi-size" data-copy="m3_size_a"></span></span><i class="lead"></i><span class="bi-price fit"><b data-copy="m3_price_a"></b><span class="unit" data-copy="won"></span></span></li>
          <li class="bi-blend"><span class="bi-name"><span data-copy="bl_name"></span></span><i class="lead"></i><span class="bi-price fit"><b data-copy="bl_price"></b><span class="unit" data-copy="won"></span></span></li>
        </ul>
        <p class="board-vat" data-copy="vat_label"></p>
      </div>
    </div>
  </section>

  <!-- 2. INGREDIENTS -->
  <section class="pick" aria-labelledby="pick-title">
    <p class="en-mark">Ingredients</p>
    <h2 class="sec-title" id="pick-title" data-copy="pick_title"></h2>
    <img class="wave" src="assets/miri/wave_divider.webp" alt="" data-miri="wave_divider">
    <p class="sec-lead" data-copy="pick_lead"></p>
    <div class="pick-grid">
      <figure class="pick-photo">
        <img src="assets/glass.jpg" data-alt="alt_glass" alt="" width="880" height="1100">
        <img class="deco pick-drops" src="assets/miri/water_drops.webp" alt="" data-miri="water_drops">
      </figure>
      <div class="glasses">
        <div class="gl g1">
          <div class="tumbler" aria-hidden="true"><span class="cup"><span class="water"></span><span class="shine"></span></span><img class="deco tb-bubbles" src="assets/miri/bubbles.webp" alt="" data-miri="bubbles"></div>
          <div class="gl-text"><p class="gl-name" data-copy="in1_name"></p><p class="gl-prod" data-copy="m1_name"></p><p class="gl-fact" data-copy="in1_fact"></p></div>
        </div>
        <div class="gl g2">
          <div class="tumbler" aria-hidden="true"><span class="cup"><span class="water"></span><span class="shine"></span></span><img class="deco tb-bubbles" src="assets/miri/bubbles.webp" alt="" data-miri="bubbles"></div>
          <div class="gl-text"><p class="gl-name" data-copy="in2_name"></p><p class="gl-prod" data-copy="m2_name"></p><p class="gl-fact" data-copy="in2_fact"></p></div>
        </div>
        <div class="gl g3">
          <div class="tumbler" aria-hidden="true"><span class="cup"><span class="water"></span><span class="shine"></span></span><img class="deco tb-bubbles" src="assets/miri/bubbles.webp" alt="" data-miri="bubbles"></div>
          <div class="gl-text"><p class="gl-name" data-copy="in3_name"></p><p class="gl-prod" data-copy="m3_name"></p><p class="gl-fact" data-copy="in3_fact"></p></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. SIGNATURE -->
  <section class="sig" aria-labelledby="sig-title">
    <p class="en-mark">Signature</p>
    <h2 class="sec-title" id="sig-title" data-copy="sig_title"></h2>
    <img class="wave" src="assets/miri/wave_divider.webp" alt="" data-miri="wave_divider">
    <div class="cards">
      <article class="card c1">
        <div class="prod-box"><img class="prod-img" src="assets/prod-juvelook.webp" data-alt="alt_p1" data-prod="juvelook" alt="" width="1000" height="1000"></div>
        <div class="c-body">
          <p class="no">No.01</p>
          <h3 class="c-name" data-copy="m1_name"></h3>
          <p class="c-base" data-copy="in1_name"></p>
          <ul class="c-rows">
            <li><span class="c-size" data-copy="m1_size"></span><i class="lead"></i><span class="c-price fit"><b data-copy="m1_price"></b><span class="unit" data-copy="won"></span></span></li>
          </ul>
          <p class="c-vat" data-copy="vat_label"></p>
        </div>
      </article>
      <article class="card c2">
        <div class="prod-box"><img class="prod-img" src="assets/prod-rejuran.webp" data-alt="alt_p2" data-prod="rejuran" alt="" width="1000" height="1000"></div>
        <div class="c-body">
          <p class="no">No.02</p>
          <h3 class="c-name" data-copy="m2_name"></h3>
          <p class="c-base" data-copy="in2_name"></p>
          <ul class="c-rows">
            <li><span class="c-size" data-copy="m2_size"></span><i class="lead"></i><span class="c-price fit"><b data-copy="m2_price"></b><span class="unit" data-copy="won"></span></span></li>
          </ul>
          <p class="c-vat" data-copy="vat_label"></p>
        </div>
      </article>
      <article class="card c3">
        <img class="deco card-drops" src="assets/miri/water_drops.webp" alt="" data-miri="water_drops">
        <div class="prod-box"><img class="prod-img" src="assets/prod-skinvive.webp" data-alt="alt_p3" data-prod="skinvive" alt="" width="1000" height="1000"></div>
        <div class="c-body">
          <p class="no">No.03</p>
          <h3 class="c-name" data-copy="m3_name"></h3>
          <p class="c-base" data-copy="in3_name"></p>
          <ul class="c-rows">
            <li><span class="c-size" data-copy="m3_size_a"></span><i class="lead"></i><span class="c-price fit"><b data-copy="m3_price_a"></b><span class="unit" data-copy="won"></span></span></li>
            <li><span class="c-size" data-copy="m3_size_b"></span><i class="lead"></i><span class="c-price fit"><b data-copy="m3_price_b"></b><span class="unit" data-copy="won"></span></span></li>
          </ul>
          <p class="c-vat" data-copy="vat_label"></p>
        </div>
      </article>
    </div>
  </section>

  <!-- 4. BLEND -->
  <section class="blend" aria-labelledby="bl-title">
    <p class="en-mark">Blend</p>
    <h2 class="sec-title" id="bl-title" data-copy="bl_title"></h2>
    <img class="wave" src="assets/miri/wave_divider.webp" alt="" data-miri="wave_divider">
    <div class="bl-card">
      <figure class="bl-photo"><img src="assets/blend.jpg" data-alt="alt_blend" alt="" width="880" height="1100"></figure>
      <div class="bl-body">
        <p class="bl-hook" data-copy="bl_hook"></p>
        <h3 class="bl-name" data-copy="bl_name"></h3>
        <div class="recipe">
          <div class="rc">
            <div class="rc-img"><img class="prod-img" src="assets/prod-rejuran.webp" data-alt="alt_p2" data-prod="rejuran" alt="" width="1000" height="1000"></div>
            <p class="rc-txt"><b data-copy="bl_part1_cc"></b><span data-copy="bl_part1"></span></p>
          </div>
          <span class="plus" aria-hidden="true">+</span>
          <div class="rc">
            <div class="rc-img"><img class="prod-img" src="assets/prod-juvelook.webp" data-alt="alt_p1" data-prod="juvelook" alt="" width="1000" height="1000"></div>
            <p class="rc-txt"><b data-copy="bl_part2_cc"></b><span data-copy="bl_part2"></span></p>
          </div>
        </div>
        <p class="bl-line" data-copy="bl_line"></p>
        <p class="bl-price fit"><b data-copy="bl_price"></b><span class="unit" data-copy="won"></span></p>
        <p class="bl-vat" data-copy="vat_label"></p>
      </div>
      <img class="deco bl-mint" src="assets/miri/mint_leaf.webp" alt="" data-miri="mint_leaf">
      <img class="deco bl-ice" src="assets/miri/ice_cubes.webp" alt="" data-miri="ice_cubes">
    </div>
  </section>

  <!-- 5. Q&A -->
  <section class="qa" aria-labelledby="qa-title">
    <p class="en-mark">Ask the bar</p>
    <h2 class="sec-title" id="qa-title" data-copy="qa_title"></h2>
    <img class="wave" src="assets/miri/wave_divider.webp" alt="" data-miri="wave_divider">
    <div class="qas">
      <article class="qa-item"><p class="q"><b>Q</b><span data-copy="qa1_q"></span></p><p class="a" data-copy="qa1_a"></p></article>
      <article class="qa-item"><p class="q"><b>Q</b><span data-copy="qa2_q"></span></p><p class="a" data-copy="qa2_a"></p></article>
      <article class="qa-item"><p class="q"><b>Q</b><span data-copy="qa3_q"></span></p><p class="a" data-copy="qa3_a"></p></article>
      <article class="qa-item"><p class="q"><b>Q</b><span data-copy="qa4_q"></span></p><p class="a" data-copy="qa4_a"></p></article>
    </div>
  </section>

  <!-- 6. ORDER receipt -->
  <section class="order" aria-labelledby="order-title">
    <img class="deco order-bubbles ob-l" src="assets/miri/bubbles.webp" alt="" data-miri="bubbles">
    <img class="deco order-bubbles ob-r" src="assets/miri/bubbles.webp" alt="" data-miri="bubbles">
    <div class="receipt-wrap">
      <div class="receipt">
        <p class="rc-en">GLOW BAR · ORDER</p>
        <h2 class="rc-title" id="order-title" data-copy="order_title"></h2>
        <dl class="rc-rows">
          <div class="rc-row"><dt data-copy="lb_book"></dt><dd><a data-link="booking" data-copy="lk_naver"></a><span class="sep">/</span><a data-link="kakao" data-copy="lk_kakao"></a></dd></div>
          <div class="rc-row"><dt data-copy="lb_place"></dt><dd data-copy="place"></dd></div>
          <div class="rc-row"><dt data-copy="lb_call"></dt><dd><a class="tel" data-link="phone" data-copy="phone"></a></dd></div>
        </dl>
        <div class="rc-foot">
          <img class="qr" src="assets/naver-booking-qr.png" data-alt="alt_qr" alt="" width="424" height="424">
          <p class="qr-label" data-copy="qr_label"></p>
          <img class="stamp" src="assets/logo-square.png" alt="" width="360" height="360">
        </div>
      </div>
    </div>
    <div class="cta">
      <a class="btn btn-naver" data-link="booking" data-copy="cta_naver"></a>
      <a class="btn btn-kakao" data-link="kakao" data-copy="cta_kakao"></a>
    </div>
  </section>

  <!-- 7. NOTICE + FOOTER -->
  <section class="notice">
    <h2 class="notice-title" data-copy="notice_title"></h2>
    <ul>
      <li data-copy="notice1"></li>
      <li data-copy="notice2"></li>
      <li data-copy="notice3" data-optional data-placeholder="추가 안내 입력 (예: 1인 1회 적용)"></li>
    </ul>
  </section>
  <footer class="foot">
    <img class="logo" src="assets/logo-wordmark.png" alt="BEAUTY BLOSSOM" width="975" height="111">
    <p><span data-copy="place"></span><span class="sep">·</span><a data-link="phone" data-copy="phone"></a></p>
  </footer>

</div>
</main>
</body>
</html>
