<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NAMICA 리프팅 런칭!</title><link rel="stylesheet" href="style.css"><script src="copy-data.js" defer></script><script src="app.js" defer></script><script src="miri-art.js" defer></script><link rel="stylesheet" href="review-adapter.css"><script src="review-adapter.js" defer></script></head><body><main>
<section class="panel hero" aria-labelledby="hero-title">
<img class="hero-photo" src="assets/hero.webp" data-alt="alt_hero" fetchpriority="high">
<div class="hero-shade"></div>
<img class="brand" src="assets/brand.png" data-alt="brand">
<span class="period" data-copy="period"></span>
<img class="product-corner" src="assets/product-perspective.png" data-alt="alt_product">
<img class="product-front" src="assets/product-front.png" data-alt="alt_product">
<div class="face-focus" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
<span class="benefit benefit-firm" data-copy="benefit_firm"></span><span class="benefit benefit-line" data-copy="benefit_line"></span>
<div class="twinkles" aria-hidden="true"></div>
<p class="hero-first" data-copy="title_first"></p>
<h1 id="hero-title" class="hero-title" data-copy="title_main"></h1>
<p class="hero-intro" data-copy="intro"></p><p class="hero-intro-bold" data-copy="intro_bold"></p>
<a class="contact" data-link="phone" data-copy="contact"></a>
</section>
<section class="panel pricing" aria-labelledby="pricing-title">
<div class="pricing-photo"><img src="assets/hero.webp" data-alt="alt_hero"></div>
<div class="pricing-light" aria-hidden="true"></div>
<img class="brand" src="assets/brand.png" data-alt="brand"><span class="period" data-copy="period"></span>
<img class="product-corner" src="assets/product-perspective.png" data-alt="alt_product">
<p class="pricing-first" data-copy="title_first"></p><h2 id="pricing-title" class="pricing-title" data-copy="title_main"></h2>
<div class="price-card"><p class="price-heading" data-copy="price_heading"></p><div class="price-row row-1"><h3 class="item-name" data-copy="name_1"></h3><p class="item-desc" data-copy="desc_1"></p><span class="quantity" data-copy="qty_1"></span><del class="old-price" data-copy="old_1"></del><strong class="sale-price" data-copy="sale_1"></strong></div><div class="price-row row-2"><h3 class="item-name" data-copy="name_2"></h3><p class="item-desc" data-copy="desc_2"></p><span class="quantity" data-copy="qty_2"></span><del class="old-price" data-copy="old_2"></del><strong class="sale-price" data-copy="sale_2"></strong></div><div class="price-row row-3"><h3 class="item-name" data-copy="name_3"></h3><p class="item-desc" data-copy="desc_3"></p><span class="quantity" data-copy="qty_3"></span><del class="old-price" data-copy="old_3"></del><strong class="sale-price" data-copy="sale_3"></strong></div><div class="price-row row-4"><h3 class="item-name" data-copy="name_4"></h3><p class="item-desc" data-copy="desc_4"></p><span class="quantity" data-copy="qty_4"></span><del class="old-price" data-copy="old_4"></del><strong class="sale-price" data-copy="sale_4"></strong></div><div class="price-row row-5"><h3 class="item-name" data-copy="name_5"></h3><p class="item-desc" data-copy="desc_5"></p><span class="quantity" data-copy="qty_5"></span><del class="old-price" data-copy="old_5"></del><strong class="sale-price" data-copy="sale_5"></strong></div><div class="price-row row-6"><h3 class="item-name" data-copy="name_6"></h3><p class="item-desc" data-copy="desc_6"></p><div class="quantity multi"><span data-copy="qty_6a"></span><span data-copy="qty_6b"></span></div><del class="old-price" data-copy="old_6"></del><strong class="sale-price" data-copy="sale_6"></strong></div><div class="price-row row-7"><h3 class="item-name" data-copy="name_7"></h3><p class="item-desc" data-copy="desc_7"></p><div class="quantity multi signature-quantity"><span data-copy="qty_7a"></span><span data-copy="qty_7b"></span><span data-copy="qty_7c"></span></div><del class="old-price" data-copy="old_7"></del><strong class="sale-price" data-copy="sale_7"></strong></div></div>
<div class="offer-seal"><span data-copy="badge"></span></div>
<p class="vat" data-copy="vat"></p>
<div class="booking-card"><a class="qr-link" data-link="booking" target="_blank" rel="noopener noreferrer"><img src="assets/reservation-qr.png" data-alt="alt_qr"></a><a class="booking-label" data-copy="booking_title" data-link="booking" target="_blank" rel="noopener noreferrer"></a><p class="booking-text" data-copy="booking_text"></p><img class="aptos-mark" src="assets/aptos-logo.png" data-alt="alt_aptos"></div>
<a class="contact" data-link="phone" data-copy="contact"></a>
</section>
</main></body></html>
